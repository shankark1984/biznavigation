<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizNavigation - Full Truck Load</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js"></script>

    <!-- Local CSS (commented out as in original) -->
    <!-- <link rel="stylesheet" href="assets/css/fulltruckload.css"> -->
    <!-- <link rel="stylesheet" href="assets/css/styles.css"> -->
</head>

<body class="bg-light">
    <div class="container mt-2" id="root">
        <div class="card shadow-lg rounded">
            <div class="card-header bg-primary text-white" style="margin-top: 68px;">
                <h3 class="mb-0">Full Truck Load</h3>
                <input type="hidden" id="tempFormID" name="tempFormID">
                <input type="hidden" id="partyCode" name="partyCode">
                <input type="hidden" id="vendorCode" name="vendorCode">
            </div>

            <div class="card-body">
                <form class="container">
                    <!-- Button Group -->
                    <div class="d-flex flex-wrap justify-content-start gap-1 mb-2">
                        <button type="button" class="btn btn-primary btn-sm" id="newButton">
                            <i class="bi bi-file-earmark-plus"></i> New
                        </button>
                        <button type="button" class="btn btn-warning btn-sm" id="modifyButton">
                            <i class="bi bi-pencil"></i> Modify
                        </button>
                        <button type="button" class="btn btn-danger btn-sm" id="deleteButton">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                        <button type="button" class="btn btn-info btn-sm" id="reportButton">
                            <i class="bi bi-file-earmark-text"></i> Report
                        </button>
                        <button type="button" class="btn btn-success btn-sm" id="saveButton">
                            <i class="bi bi-save"></i> Save
                        </button>
                    </div>

                    <!-- Form Grid -->
                    <div class="row g-1">
                        <!-- Row 1 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="lrnumber" class="col-4 col-form-label">LR Number</label>
                                <div class="col-8">
                                    <input list="lrNumberSuggestions" class="form-control" id="lrnumber" name="lrnumber"
                                        required placeholder="Choose..." autocomplete="off">
                                    <datalist id="lrNumberSuggestions"></datalist>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="lrdate" class="col-4 col-form-label">LR Date</label>
                                <div class="col-8">
                                    <input type="date" class="form-control" id="lrdate" name="lrdate" required>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="partyName" class="col-4 col-form-label">Customer Name</label>
                                <div class="col-8">
                                    <input list="partySuggestions" class="form-control" id="partyName" name="partyName"
                                        required placeholder="Choose..." autocomplete="off">
                                    <datalist id="partySuggestions"></datalist>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="requesteddate" class="col-4 col-form-label">Requested Date</label>
                                <div class="col-8">
                                    <input type="date" class="form-control" id="requesteddate" name="requesteddate">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="quotationid" class="col-4 col-form-label">Quotation ID</label>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="quotationid" name="quotationid">
                                </div>
                            </div>
                        </div>

                        <!-- Row 2 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="movementType" class="col-4 col-form-label">Movement Type</label>
                                <div class="col-8">
                                    <select id="movementType" class="form-control name=" movementType">
                                        <option value="" disabled selected>Select Movement Type</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="originPinCode" class="col-4 col-form-label">Origin Pincode</label>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="originPinCode" name="originPinCode"
                                        required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Row 3 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="orgincity" class="col-4 col-form-label">Origin City</label>
                                <div class="col-8">
                                    <input type="text" id="orgincity" name="orgincity"
                                        style="text-transform: capitalize;" required autocomplete="off"
                                        class="form-control">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="orginAddress" class="col-4 col-form-label">P_Address</label>
                                <div class="col-8">
                                    <textarea id="orginAddress" class="form-control" name="orginAddress"
                                        style="text-transform: capitalize;" required rows="1" autocomplete="off"
                                        placeholder="Origin Address"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="destinationPinCode" class="col-4 col-form-label">D_Pincode</label>
                                <div class="col-8">
                                    <input type="text" id="destinationPinCode" name="destinationPinCode" required
                                        autocomplete="off" class="form-control" placeholder="Destination Pincode">
                                </div>
                            </div>
                        </div>

                        <!-- Row 4 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="destinationcity" class="col-4 col-form-label">Destination City</label>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="destinationcity" name="destinationcity"
                                        style="text-transform: capitalize;" required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="destinationAddress" class="col-4 col-form-label">D_Address</label>
                                <div class="col-8">
                                    <textarea class="form-control" id="destinationAddress" name="destinationAddress"
                                        style="text-transform: capitalize;" required rows="1" autocomplete="off"
                                        placeholder="Destination Address"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Row 5 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="vehicleType" class="col-4 col-form-label">Vehicle Type</label>
                                <div class="col-8">
                                    <select class="form-control" id="vehicleType" name="vehicleType">
                                        <option value="" disabled selected>Select Vehicle Type</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="referencenumber" class="col-4 col-form-label">Reference No</label>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="referencenumber" name="referencenumber"
                                        style="text-transform: uppercase;" required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="invoicevalue" class="col-4 col-form-label">Invoice Value</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="invoicevalue" name="invoicevalue"
                                        min="0" step="0.01" placeholder="00.00" value="0" onblur="formatCurrency(this)">
                                </div>
                            </div>
                        </div>
                        <!-- Row 6 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="vendorName" class="col-4 col-form-label">Vendor Name</label>
                                <div class="col-8">
                                    <input list="vendorSuggestions" class="form-control" id="vendorName"
                                        name="vendorName" required placeholder="Vendor Name" autocomplete="off">
                                    <datalist id="vendorSuggestions"></datalist>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="vehiclenumber" class="col-4 col-form-label">Vehicle Number</label>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="vehiclenumber" name="vehiclenumber"
                                        style="text-transform: uppercase;" required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Row 7 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="containernumber" class="col-4 col-form-label">Container No</label>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="containernumber" name="containernumber"
                                        style="text-transform: uppercase;" autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="modeType" class="col-4 col-form-label">Mode Type</label>
                                <div class="col-8">
                                    <select class="form-control" id="modeType" name="modeType" required>
                                        <option value="" disabled selected>Select Mode Type</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="quantity" class="col-4 col-form-label">Quantity</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="quantity" name="quantity" min="1"
                                        required>
                                </div>
                            </div>
                        </div>

                        <!-- Row 8 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="actualwt" class="col-4 col-form-label">Actual Wt (Kgs)</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="actualwt" name="actualwt" min="0"
                                        step="0.01" placeholder="00.00" value="0" required>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="volumetricwt" class="col-4 col-form-label">Volumetric Wt (Kgs)</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="volumetricwt" name="volumetricwt"
                                        min="0" step="0.01" placeholder="00.00" value="0" required>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="chargewt" class="col-4 col-form-label">Charge Wt (Kgs)</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="chargewt" name="chargewt" min="0"
                                        step="0.01" placeholder="00.00" value="0" disabled>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="paymentType" class="col-4 col-form-label">Payment Type</label>
                                <div class="col-8">
                                    <select class="form-control" id="paymentType" name="paymentType" required>
                                        <option value="" disabled selected>Select Payment Type</option>
                                        <option value="To-Pay">To-Pay</option>
                                        <option value="Paid">Paid</option>
                                        <option value="TBB">TBB</option>
                                        <option value="Credit">Credit</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="routedetails" class="col-4 col-form-label">Route Details</label>
                                <div class="col-8">
                                    <input list="routeSuggestions" class="form-control" id="routedetails"
                                        name="routedetails" required placeholder="Selete Route" autocomplete="off">
                                    <datalist id="routeSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <!-- Row 10 -->
                        <div class="col-md-8 col-sm-12">
                            <div class="row align-items-center">
                                <label for="infomation" class="col-2 col-form-label">Information</label>
                                <div class="col-10">
                                    <input type="text" class="form-control" id="infomation"
                                        placeholder="Enter Information">
                                </div>
                            </div>
                        </div>

                        <!-- Tabbed Form Section -->
                        <div class="col-12 mt-3">
                            <ul class="nav nav-tabs" id="bookingTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="frightCharges-tab" data-bs-toggle="tab"
                                        data-bs-target="#frightCharges" type="button" role="tab">Freight
                                        Charges</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="vendorCharges-details-tab" data-bs-toggle="tab"
                                        data-bs-target="#vendorCharges" type="button" role="tab">Vendor
                                        Charges</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="description-tab" data-bs-toggle="tab"
                                        data-bs-target="#description" type="button" role="tab">Description</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="status-tab" data-bs-toggle="tab"
                                        data-bs-target="#status" type="button" role="tab">Status</button>
                                </li>
                            </ul>
                            <div class="tab-content p-3 border border-top-0" id="bookingTabsContent">
                                <!-- Fright Charges Tab -->
                                <div class="tab-pane fade show active" id="frightCharges" role="tabpanel">
                                    <div class="row g-3 align-items-center">
                                        <!-- Charges Type -->
                                        <div class="col-lg-3 col-md-4 col-sm-6">
                                            <div class="row align-items-center">
                                                <label for="chargesType"
                                                    class="col-5 col-form-label text-end small">Charges Type</label>
                                                <div class="col-7">
                                                    <select class="form-control" id="chargesType" name="chargesType">
                                                        <option value="" disabled selected>Select Charges Type</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Charges Input -->
                                        <div class="col-lg-3 col-md-4 col-sm-6">
                                            <div class="row align-items-center">
                                                <label for="frightcharges"
                                                    class="col-4 col-form-label text-end small">Charges</label>
                                                <div class="col-8">
                                                    <input type="number" class="form-control" id="frightcharges"
                                                        name="frightcharges" min="0" step="0.01" placeholder="00.00"
                                                        onblur="formatCurrency(this)">
                                                </div>
                                            </div>
                                        </div>
                                        <!-- Tax Rate -->
                                        <div class="col-lg-3 col-md-4 col-sm-6">
                                            <div class="row align-items-center">
                                                <label for="partyDefaultTax"
                                                    class="col-4 col-form-label text-end small">Tax
                                                    Rate</label>
                                                <div class="col-8">
                                                    <select class="form-control" id="partyDefaultTax"
                                                        name="partyDefaultTax">
                                                        <option value="" disabled selected>Select Default Tax</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Add Button -->
                                        <div class="col-lg-3 col-md-4 col-sm-6 text-center">
                                            <button type="button" id="addButton" class="btn btn-primary">Add</button>
                                        </div>
                                    </div>
                                    <!-- Table to display data from-->
                                    <div id="chargesDetailsTableContainer" class="mt-4"
                                        style="max-height: 400px; overflow: auto; border: 1px solid #ddd;">
                                        <table id="chargesDetailsTable" class="table table-striped table-bordered">
                                            <thead>
                                                <tr>
                                                    <th>Charges Type</th>
                                                    <th>GST Type</th>
                                                    <th>Amount</th>
                                                    <th>CGST Amount</th>
                                                    <th>SGST Amount</th>
                                                    <th>IGST Amount</th>
                                                    <th>Total GST Amount</th>
                                                    <th>Grand Total Billing</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <!-- Dynamic rows will be added here -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <!-- Vendor Charges Tab -->
                                <div class="tab-pane fade" id="vendorCharges" role="tabpanel">
                                    <div class="row g-3 align-items-center">
                                        <!-- Charges Type -->
                                        <div class="col-lg-3 col-md-10 col-sm-6">
                                            <div class="row align-items-center">
                                                <label for="vendorChargesType"
                                                    class="col-5 col-form-label text-end small">Charges Type</label>
                                                <div class="col-7">
                                                    <select class="form-control" id="vendorChargesType"
                                                        name="vendorChargesType">
                                                        <option value="" disabled selected>Select Charges Type</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Charges Input -->
                                        <div class="col-lg-3 col-md-4 col-sm-6">
                                            <div class="row align-items-center">
                                                <label for="vendorFrightcharges"
                                                    class="col-4 col-form-label text-end small">Charges</label>
                                                <div class="col-8">
                                                    <input type="number" class="form-control" id="vendorFrightcharges"
                                                        name="vendorFrightcharges" min="0" step="0.01"
                                                        placeholder="00.00" onblur="formatCurrency(this)">
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Tax Rate -->
                                        <div class="col-lg-3 col-md-4 col-sm-6">
                                            <div class="row align-items-center">
                                                <label for="vendorDefaultTax"
                                                    class="col-4 col-form-label text-end small">Tax
                                                    Rate</label>
                                                <div class="col-8">
                                                    <select class="form-control" id="vendorDefaultTax"
                                                        name="vendorDefaultTax">
                                                        <option value="" disabled selected>Select Default Tax</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Add Button -->
                                        <div class="col-lg-3 col-md-4 col-sm-6 text-center">
                                            <button type="button" id="VendoraddButton"
                                                class="btn btn-primary">Add</button>
                                        </div>
                                    </div>
                                    <!-- Table to display data from Google Sheet -->
                                    <div id="vendorchargesDetailsTableContainer" class="mt-4"
                                        style="max-height: 400px; overflow: auto; border: 1px solid #ddd;">
                                        <table id="vendorchargesDetailsTable"
                                            class="table table-striped table-bordered">
                                            <thead>
                                                <tr>
                                                    <th>Charges Type</th>
                                                    <th>GST Type</th>
                                                    <th>Amount</th>
                                                    <th>CGST Amount</th>
                                                    <th>SGST Amount</th>
                                                    <th>IGST Amount</th>
                                                    <th>Total GST Amount</th>
                                                    <th>Grand Total Billing</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <!-- Dynamic rows will be added here -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <!-- Description Tab -->
                                <div class="tab-pane fade" id="description" role="tabpanel">
                                    <div class="row g-1">
                                        <div class="col-md-6 col-sm-6">
                                            <div class="row align-items-center">
                                                <label for="chargesType"
                                                    class="col-5 col-form-label text-end small">Description of
                                                    Goods</label>
                                                <div class="col-7">
                                                    <textarea class="form-control" id="descriptionofGoods"
                                                        name="descriptionofGoods" style="text-transform: capitalize;"
                                                        required rows="1" autocomplete="off"></textarea>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-md-6 col-sm-6">
                                            <div class="row align-items-center">
                                                <label for="wayBillNo" class="col-4 col-form-label text-end small">E-Way
                                                    Bill Number</label>
                                                <div class="col-7">
                                                    <input type="text" class="form-control" id="wayBillNo"
                                                        name="wayBillNo" style="text-transform: uppercase;" required
                                                        autocomplete="off" placeholder="E-Way Bill Number">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- Status Tab -->
                                <div class="tab-pane fade" id="status" role="tabpanel">
                                    <div class="mb-3">
                                        <label for="statusDetails" class="form-label small">Status</label>
                                        <textarea class="form-control" id="statusDetails" rows="3"
                                            placeholder="Enter Status"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Local Scripts -->
    <script src="assets/js/server.js"></script>
    <!-- <script src="assets/js/generalfunction.js"></script> -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/AccessRules.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/pincode.js"></script>
    <script src="assets/js/fulltruckload.js"></script>
    <script src="assets/js/dropdownlist.js"></script>
    <script src="assets/js/taxDescription.js"></script>
    <script src="assets/js/customerlist.js"></script>
    <script src="assets/js/logout.js"></script>
    <script src="assets/js/routemaster.js"></script>

    <!-- <script src="assets/js/International_Booking.js"></script> -->
</body>

</html>
