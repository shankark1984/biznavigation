<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>BizNavigation - Full Truck Load Booking</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="assets/css/fulltruckload.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Include DOMPurify from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js"></script>
    <!-- Include html2canvas from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Include jsPDF from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js"></script> <!-- Supabase client -->
</head>

<body class="bg-light">
    <div class="container mt-2" id="root">
        <div class="card shadow-lg rounded">
            <div class="card-header bg-primary text-white" style="margin-top: 68px;">
                <h3 class="mb-0">Full Truck Load</h3>
                <input type="hidden" id="tempFormID" name="tempFormID">
                <input type="hidden" id="partyCode" name="partyCode">
                <input type="hidden" id="vendorCode" name="vendorCode">
            </div>
            <div class="card-body">
                <form class="container">
                    <!-- Button Group -->
                    <div class="d-flex flex-wrap justify-content-start gap-1 mb-2">
                        <button type="button" class="btn btn-primary btn-sm" id="newButton">
                            <i class="bi bi-file-earmark-plus"></i> New
                        </button>
                        <button type="button" class="btn btn-warning btn-sm" id="modifyButton">
                            <i class="bi bi-pencil"></i> Modify
                        </button>
                        <button type="button" class="btn btn-danger btn-sm" id="deleteButton">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                        <button type="button" class="btn btn-info btn-sm" id="reportButton">
                            <i class="bi bi-file-earmark-text"></i> Report
                        </button>
                        <button type="button" class="btn btn-success btn-sm" id="saveButton">
                            <i class="bi bi-save"></i> Save
                        </button>
                    </div>
                    <!-- Form Grid -->
                    <div class="row g-1">
                        <!-- LR Number -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="lrnumber">LR Number</label>
                                </div>
                                <div class="col-8">
                                    <input list="lrNumberSuggestions" class="form-control" id="lrnumber" name="lrnumber"
                                        placeholder="LR Number" autocomplete="off">
                                    <datalist id="lrNumberSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <!-- LR Date -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="lrdate">LR Date</label>
                                </div>
                                <div class="col-8">
                                    <input type="date" class="form-control" id="lrdate" name="lrdate" required>
                                </div>
                            </div>
                        </div>

                        <!-- Quotation ID -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="quotationid">Quotation ID</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="quotationid" name="quotationid"
                                        placeholder="Quotation ID" autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Movement Type -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="movementType">Movement Type</label>
                                </div>
                                <div class="col-8">
                                    <select id="movementType" class="form-control" name="movementType">
                                        <option value="" disabled selected>Select Movement Type</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Customer Name -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="partyName">Customer Name</label>
                                </div>
                                <div class="col-8">
                                    <input list="partySuggestions" class="form-control" id="partyName" name="partyName"
                                        required placeholder="Party Name" autocomplete="off">
                                    <datalist id="partySuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <!-- Origin Pincode -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="originPinCode">Origin Pincode</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="originPinCode" name="originPinCode"
                                        required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Origin City -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="originCity">Origin City</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="originCity" name="originCity"
                                        style="text-transform: capitalize;" required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Origin Address -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="originAddress">Origin Address</label>
                                </div>
                                <div class="col-8">
                                    <textarea id="originAddress" class="form-control" name="originAddress"
                                        style="text-transform: capitalize;" required rows="1"
                                        autocomplete="off"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Destination Pincode -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="destinationPinCode">Destination Pincode</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="destinationPinCode"
                                        name="destinationPinCode" required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Destination City -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="destinationCity">Destination City</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="destinationCity" name="destinationCity"
                                        style="text-transform: capitalize;" required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Destination Address -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="destinationAddress">Destination Address</label>
                                </div>
                                <div class="col-8">
                                    <textarea id="destinationAddress" class="form-control" name="destinationAddress"
                                        style="text-transform: capitalize;" required rows="1"
                                        autocomplete="off"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Requested Date -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="requesteddate">Requested Date</label>
                                </div>
                                <div class="col-8">
                                    <input type="date" class="form-control" id="requesteddate" name="requesteddate">
                                </div>
                            </div>
                        </div><!-- Vehicle Type -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="vehicleType">Vehicle Type</label>
                                </div>
                                <div class="col-8">
                                    <select id="vehicleType" name="vehicleType" class="form-control">
                                        <option value="" disabled selected>Select Vehicle Type</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Reference Number -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="referencenumber">Reference Number</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" id="referencenumber" name="referencenumber" class="form-control"
                                        style="text-transform: uppercase;" required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Invoice Value -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="invoicevalue">Invoice Value</label>
                                </div>
                                <div class="col-8 d-flex align-items-center">
                                    <span class="inr-symbol me-2">₹</span>
                                    <input type="number" id="invoicevalue" name="invoicevalue" class="form-control"
                                        min="0" step="0.01" placeholder="00.00" value="0" onblur="formatCurrency(this)">
                                </div>
                            </div>
                        </div>

                        <!-- Vendor Name -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="vendorName">Vendor Name</label>
                                </div>
                                <div class="col-8">
                                    <input list="vendorSuggestions" id="vendorName" name="vendorName"
                                        class="form-control" required placeholder="Vendor Name" autocomplete="off">
                                    <datalist id="vendorSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <!-- Vehicle Number -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="vehiclenumber">Vehicle Number</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" id="vehiclenumber" name="vehiclenumber" class="form-control"
                                        style="text-transform: uppercase;" required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Container Number -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="containernumber">Container Number</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" id="containernumber" name="containernumber" class="form-control"
                                        style="text-transform: uppercase;" autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Mode Type -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="modeType" class="form-label">Mode Type</label>
                                </div>
                                <div class="col-8">
                                    <select id="modeType" name="modeType" class="form-control" required>
                                        <option value="" disabled selected>Select Mode Type</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Destination Country-->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="quantity" class="form-label small">Quantity</label>
                                </div>
                                <div class="col-8">
                                    <input type="number" id="quantity" name="quantity" class="form-control" required>
                                </div>
                            </div>
                        </div>
                        <!-- Packing Type -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="actualwt" class="form-label small">Actual Wt (Kgs)</label>
                                </div>
                                <div class="col-8">
                                    <input type="number" id="actualwt" name="actualwt" class="form-control" required>
                                </div>
                            </div>
                        </div>
                        <!-- Freight UOM -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="chargewt" class="form-label small">Charge Wt (Kgs)</label>
                                </div>
                                <div class="col-8">
                                    <input type="number" id="chargewt" name="chargewt" required>
                                </div>
                            </div>
                        </div>
                        <!-- Quantity -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="paymentType">Payment Type</label>
                                </div>
                                <div class="col-8">
                                    <select id="paymentType" name="paymentType" required>
                                        <option value="" disabled selected>Select Payment Type</option>
                                        <option value="To-Pay">To-Pay</option>
                                        <option value="Paid">Paid</option>
                                        <option value="TBB">TBB</option>
                                        <option value="Credit">Credit</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <!-- Actual Weight -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="routedetails">Route Details</label>
                                </div>
                                <div class="col-8">
                                    <input list="routeSuggestions" id="routedetails" name="routedetails" required
                                        placeholder="Selete Route" autocomplete="off">
                                    <datalist id="routeSuggestions"></datalist>
                                </div>
                            </div>
                        </div>
                        <!-- Infomation -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="infomation" class="form-label small">Additional Information</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="infomation"
                                        placeholder="Enter Infomation">
                                </div>
                            </div>
                        </div>
                        <!-- Tabbed Form -->
                        <div class="col-md-12 mt-3">
                            <ul class="nav nav-tabs" id="frightTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="description-tab" data-bs-toggle="tab"
                                        data-bs-target="#description" type="button" role="tab">Description</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="freightCharges-tab" data-bs-toggle="tab"
                                        data-bs-target="#freightCharges" type="button" role="tab">Freight
                                        Charges</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="vendorCharges-tab" data-bs-toggle="tab"
                                        data-bs-target="#vendorCharges" type="button" role="tab">Vendor
                                        Charges</button>
                                </li>
                            </ul>
                            <div class="tab-content p-3 border border-top-0" id="frightTabsContent">
                                <!-- Freight Tab Start -->
                                <div class="tab-pane fade show active" id="description" role="tabpanel">
                                    <div class="row g-1 align-items-center">
                                        <!-- Charges Type -->
                                        <div class="col-md-3 col-sm-6">
                                            <div class="row align-items-center">
                                                <div class="col-5 text-end">
                                                    <label for="chargesType" class="form-label small">Charges
                                                        Type:</label>
                                                </div>
                                                <div class="col-7">
                                                    <input list="chargesTypeSuggestions" class="form-control"
                                                        id="chargesType" name="chargesType" required
                                                        placeholder="Select Charges Type" autocomplete="off"
                                                        oninput="chargesTypeDetails(this.value)">
                                                    <datalist id="chargesTypeSuggestions"></datalist>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- HSN Number -->
                                        <div class="col-md-2 col-sm-6">
                                            <div class="row align-items-center">
                                                <div class="col-4 text-end">
                                                    <label for="hsnNumber" class="form-label small">HSN:</label>
                                                </div>
                                                <div class="col-8">
                                                    <input type="text" class="form-control" id="hsnNumber"
                                                        name="hsnNumber">
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Freight Amount -->
                                        <div class="col-md-3 col-sm-6">
                                            <div class="row align-items-center">
                                                <div class="col-4 text-end">
                                                    <label for="freightAmount" class="form-label small">Amount:</label>
                                                </div>
                                                <div class="col-8">
                                                    <input type="number" class="form-control" id="freightAmount"
                                                        name="freightAmount">
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Remarks -->
                                        <div class="col-md-3 col-sm-6">
                                            <div class="row align-items-center">
                                                <div class="col-4 text-end">
                                                    <label for="remarksDetails"
                                                        class="form-label small">Remarks:</label>
                                                </div>
                                                <div class="col-8">
                                                    <input type="text" class="form-control" id="remarksDetails"
                                                        name="remarksDetails">
                                                </div>
                                            </div>
                                        </div>
                                        <!-- Add Button -->
                                        <div class="col-md-1 col-sm-6 d-flex justify-content-end">
                                            <button type="button" class="btn btn-primary">Add</button>
                                        </div>
                                    </div>
                                </div>
                                <!-- Freight Tab End -->

                                <div class="tab-pane fade" id="freightCharges" role="tabpanel">
                                    <label for="containerDetails" class="form-label small">Container Details</label>
                                    <textarea class="form-control" id="containerDetails" rows="3"
                                        placeholder="Enter Container Details"></textarea>
                                </div>
                                <div class="tab-pane fade" id="vendorCharges" role="tabpanel">
                                    <label for="statusDetails" class="form-label small">Status</label>
                                    <textarea class="form-control" id="statusDetails" rows="3"
                                        placeholder="Enter Status"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>

            </div>

        </div>
    </div>
    </div>

    <script src="assets/js/server.js"></script>
    <script src="assets/js/generalfunction.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/AccessRules.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/pincode.js"></script>
    <script src="assets/js/dropdownlist.js"></script>
    <script src="assets/js/taxDescription.js"></script>
    <script src="assets/js/customerlist.js"></script>
    <script src="assets/js/logout.js"></script>
    <!-- <script src="assets/js/routemaster.js"></script> -->
    <script src="assets/js/International_Booking.js"></script>
    <!-- <script src="assets/js/work.js"></script> -->
    <script src="assets/js/fulltruckload.js"></script>
    <!-- <script src="assets/js/routemaster.js"></script> -->
</body>

</html>
