<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizNavigation</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Include DOMPurify from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js"></script>
    <!-- Include html2canvas from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Include jsPDF from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js"></script> <!-- Supabase client -->
</head>

<body>
    <div class="container mt-1">

        <form>

            <div class="form-header">
                <h2 class="mb-3">International Booking</h2>
                <input type="hidden" id="tempFormID" name="tempFormID">
                <input type="hidden" id="partyCode" name="partyCode">
                <input type="hidden" id="vendorCode" name="vendorCode">
            </div>

            <!-- Button Group -->
            <div class="button-group mt-4 d-flex justify-content-start gap-2">
                <button type="button" class="btn btn-primary" id="newButton" accesskey="n">New</button>
                <button type="button" class="btn btn-warning" id="modifyButton" accesskey="m">Modify</button>
                <button type="button" class="btn btn-danger" id="deleteButton" accesskey="d">Delete</button>
                <button type="button" class="btn btn-info" id="reportButton" accesskey="r">Report</button>
                <button type="button" class="btn btn-success" id="saveButton" accesskey="s">Save</button>
            </div>
            <div class="row g-3">
                <!-- Customer Name -->
                <div class="col-md-4">
                    <label for="partyName" class="form-label small">Customer Name</label>
                    <input list="partySuggestions" id="partyName" name="partyName" required placeholder="Party Name"
                        autocomplete="off">
                    <datalist id="partySuggestions"></datalist>
                </div>

                <!-- BL/AWB No -->
                <div class="col-md-4">
                    <label for="awbNo" class="form-label small">Docket No</label>
                    <input list="docketNoSuggestions" id="awbNo" name="awbNo" required placeholder="Enter Docket No"
                        autocomplete="off" oninput="loadAWBNoDetails(this.value)"><!-- Dynamically loads suggestions -->
                    <datalist id="docketNoSuggestions"></datalist>
                </div>

                <!-- Booked Date -->
                <div class="col-md-2">
                    <label for="bookedDate" class="form-label small">Booked Date</label>
                    <input type="date" class="form-control" id="bookedDate">
                </div>

                <!-- Status -->
                <div class="col-md-2">
                    <label for="status" class="form-label small">Status</label>
                    <input type="text" class="form-control" id="status" placeholder="Enter Status" value="New" readonly>
                </div>

                <!-- Transaction Type -->
                <div class="col-md-2">
                    <label for="transactionType" class="form-label small">Transaction Type</label>
                    <input list="transactionTypeSuggestions" id="transactionType" name="transactionType" required
                        placeholder="Enter Transaction Type" autocomplete="off"
                        oninput="transactionTypeDetails(this.value)">
                    <!-- Dynamically loads suggestions -->
                    <datalist id="transactionTypeSuggestions"></datalist>
                </div>

                <!-- Transit Type -->
                <div class="col-md-2">
                    <label for="transitTypeInternational" class="form-label small">Transit Type</label>
                    <input list="transitTypeInternationalSuggestions" id="transitTypeInternational"
                        name="transitTypeInternational" required placeholder="Enter Transit Type" autocomplete="off"
                        oninput="transitTypeInternationalDetails(this.value)"><!-- Dynamically loads suggestions -->
                    <datalist id="transitTypeInternationalSuggestions"></datalist>
                </div>

                <!-- Mode Type -->
                <div class="col-md-2">
                    <label for="modeType" class="form-label small">Mode Type</label>
                    <input list="modeTypeSuggestions" id="modeType" name="modeType" required
                        placeholder="Enter Mode Type" autocomplete="off"
                        oninput="modeTypeDetails(this.value)"><!-- Dynamically loads suggestions -->
                    <datalist id="modeTypeSuggestions"></datalist>
                </div>

                <!-- P.O No -->
                <div class="col-md-2">
                    <label for="poNo" class="form-label small">P.O No</label>
                    <input list="poNoSuggestions" id="poNo" name="poNo" required placeholder="Enter P.O No"
                        autocomplete="off" oninput="poNoDetails(this.value)"><!-- Dynamically loads suggestions -->
                    <datalist id="poNoSuggestions"></datalist>
                </div>

                <!-- Shipping Type -->
                <div class="col-md-2">
                    <label for="shippingType" class="form-label small">Shipping Type</label>
                    <input list="shippingTypeSuggestions" id="shippingType" name="shippingType" required
                        placeholder="Enter Shipping Type" autocomplete="off" value="NA"
                        oninput="shippingTypeDetails(this.value)"><!-- Dynamically loads suggestions -->
                    <datalist id="shippingTypeSuggestions"></datalist>
                </div>

                <!-- Cargo Carrier -->
                <div class="col-md-2">
                    <label for="carrierName" class="form-label small">Carrier</label>
                    <input list="cargoCarrierSuggestions" id="carrierName" name="carrierName" required
                        placeholder="Enter Shipping Type" autocomplete="off"
                        oninput="cargoCarrierDetails(this.value)"><!-- Dynamically loads suggestions -->
                    <datalist id="cargoCarrierSuggestions"></datalist>
                </div>

                <!-- Service Provider -->
                <div class="col-md-3">
                    <label for="serviceProvider" class="form-label small">Service Provider</label>
                    <input list="serviceProviderSuggestions" id="serviceProvider" name="serviceProvider" required
                        placeholder="Enter Service Provider" autocomplete="off"
                        oninput="serviceProviderDetails(this.value)">
                    <!-- Dynamically loads suggestions -->
                    <datalist id="serviceProviderSuggestions"></datalist>
                </div>

                <!-- Shipper Ref -->
                <div class="col-md-2">
                    <label for="shipperRef" class="form-label small">Shipper Ref</label>
                    <input list="shipperRefSuggestions" id="shipperRef" name="shipperRef" required
                        placeholder="Enter shipper Ref" autocomplete="off"
                        oninput="shipperRefDetails(this.value)"><!-- Dynamically loads suggestions -->
                </div>

                <!-- Invoice Value Ref -->
                <div class="col-md-3">
                    <label for="invoiceValue" class="form-label small">Invoice Value</label>
                    <input type="number" id="invoiceValue" name="invoiceValue" autocomplete="off" value="0.00">
                </div>

                <!-- Pickup Address -->
                <div class="col-md-4">
                    <label for="PartyAddress" class="form-label small">Pickup Address</label>
                    <input list="PartyAddressSuggestions" id="PartyAddress" name="PartyAddress" required
                        placeholder="Enter Pickup Address" autocomplete="off"
                        oninput="PartyAddressDetails(this.value, 'Address', 'PartyAddressSuggestions')">
                    <datalist id="PartyAddressSuggestions"></datalist>
                </div>

                <!-- Consignee Name -->
                <div class="col-md-4">
                    <label for="consigneeName" class="form-label small">Consignee Name</label>
                    <input list="consigneeNameSuggestions" id="consigneeName" name="consigneeName" required
                        placeholder="Enter Consignee Name" autocomplete="off"
                        oninput="consigneeDetails(this.value, 'ConsigneeName', 'consigneeNameSuggestions')"
                        onchange="updateDeliveryAddress()">
                    <datalist id="consigneeNameSuggestions"></datalist>
                </div>

                <!-- Delivery Address -->
                <div class="col-md-5">
                    <label for="deliveryAddress" class="form-label small">Delivery Address</label>
                    <textarea id="deliveryAddress" name="deliveryAddress" placeholder="Delivery Address"
                        autocomplete="off" rows="1"></textarea>
                </div>


                <!-- Commodity Mode -->
                <div class="col-md-3">
                    <label for="commodity" class="form-label small">Commodity</label>
                    <input list="commoditySuggestions" id="commodity" name="commodity" required
                        placeholder="Enter Commodity Type" autocomplete="off" oninput="commodityDetails(this.value)">
                    <!-- Dynamically loads suggestions -->
                    <datalist id="commoditySuggestions"></datalist>

                </div>

                <!-- Clearance Mode -->
                <div class="col-md-3">
                    <label for="clearanceMode" class="form-label small">Clearance Mode</label>
                    <input list="clearanceModeSuggestions" id="clearanceMode" name="clearanceMode" required
                        placeholder="Enter Clearance Mode" autocomplete="off" oninput="commodityDetails(this.value)">
                    <!-- Dynamically loads suggestions -->
                    <datalist id="clearanceModeSuggestions"></datalist>
                </div>

                <!-- Origin Country -->
                <div class="col-md-3">
                    <label for="originCountry" class="form-label small">Origin</label>
                    <input list="originCountrySuggestions" id="originCountry" name="originCountry" required
                        placeholder="Enter Origin Country" autocomplete="new-password""
                        oninput=" CountryDetails(this.value, 'originCountrySuggestions' , 'originCountry' )">
                    <!-- Dynamically loads suggestions -->
                    <datalist id="originCountrySuggestions"></datalist>
                </div>

                <!-- Destination Country-->
                <div class="col-md-3">
                    <label for="destination" class="form-label small">Destination</label>
                    <input list="destinationCountrySuggestions" id="destinationCountry" name="destinationCountry"
                        required placeholder="Enter Destination Country" autocomplete="new-password""
                        oninput=" CountryDetails(this.value, 'destinationCountrySuggestions' , 'destinationCountry' )">
                    <!-- Dynamically loads suggestions -->
                    <datalist id="destinationCountrySuggestions"></datalist>
                </div>


                <!-- Packing Type -->
                <div class="col-md-2">
                    <label for="packingType" class="form-label small">Packing Type</label>
                    <select class="form-select" id="packingType">
                        <option selected>Choose...</option>
                        <option value="1">Type 1</option>
                        <option value="2">Type 2</option>
                    </select>
                </div>

                <!-- Freight UOM -->
                <div class="col-md-2">
                    <label for="freightUOM" class="form-label small">UOM</label>
                    <select class="form-select" id="freightUOM">
                        <option selected>Choose...</option>
                        <option value="1">UOM 1</option>
                        <option value="2">UOM 2</option>
                    </select>
                </div>

                <!-- Quantity -->
                <div class="col-md-1">
                    <label for="quantity" class="form-label small">Quantity</label>
                    <input type="text" class="form-control" id="quantity" placeholder="Enter Quantity">
                </div>

                <!-- Volume Calculator Button -->
                <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-secondary" data-bs-toggle="modal"
                        data-bs-target="#volumeCalculatorModal">Vol
                    </button>
                </div>

                <!-- Actual Weight -->
                <div class="col-md-1">
                    <label for="actualWeight" class="form-label small">Act Wt</label>
                    <input type="text" class="form-control" id="actualWeight" placeholder="Enter Actual Weight">
                </div>

                <!-- Volumetric Weight -->
                <div class="col-md-1">
                    <label for="volumetricWeight" class="form-label small">Vol Wt</label>
                    <input type="text" class="form-control" id="volumetricWeight" placeholder="Enter Volumetric Weight">
                </div>

                <!-- Chargeable Weight -->
                <div class="col-md-1">
                    <label for="chargeableWeight" class="form-label small">Char Wt</label>
                    <input type="text" class="form-control" id="chargeableWeight" placeholder="Enter Chargeable Weight">
                </div>

                <!-- Infomation Weight -->
                <div class="col-md-12">
                    <label for="infomation" class="form-label small">Infomation</label>
                    <input type="text" class="form-control" id="infomation" placeholder="Enter Infomation">
                </div>
            </div>
        </form>

        <!-- Modal (Outside Main Form) -->
        <div id="addConsigneeModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
background: white; padding: 20px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); border-radius: 5px;">
            <h3>Add New Consignee</h3>
            <form id="consigneeForm" onsubmit="addNewConsignee(event)">
                <input type="text" id="newConsigneeName" placeholder="Consignee Name" required>
                <input type="text" id="newConsigneeAddress" placeholder="Consignee Address" required>
                <input type="text" id="newContactPerson" placeholder="Contact Person" required>
                <input type="text" id="newContactNumber" placeholder="Contact Number" required>
                <input type="email" id="newEmailID" placeholder="Email ID" required>

                <div style="margin-top: 10px;">
                    <button type="submit">Add Consignee</button>
                    <button type="button" onclick="hideModal()">Cancel</button>
                </div>
            </form>
        </div>

    </div>



    <!-- Volume Calculator Modal -->
    <div class="modal fade" id="volumeCalculatorModal" tabindex="-1" aria-labelledby="volumeCalculatorModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="volumeCalculatorModalLabel">Volume Calculator</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Volume Calculator functionality will go here.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/server.js"></script>
    <script src="assets/js/generalfunction.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/pincode.js"></script>
    <script src="assets/js/fulltruckload.js"></script>
    <script src="assets/js/dropdownlist.js"></script>
    <script src="assets/js/taxDescription.js"></script>
    <script src="assets/js/customerlist.js"></script>
    <script src="assets/js/logout.js"></script>
    <script src="assets/js/routemaster.js"></script>
    <script src="assets/js/International_Booking.js"></script>
    <!-- <script src="assets/js/work.js"></script> -->
</body>

</html>
