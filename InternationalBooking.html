<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizNavigation - International Booking</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js"></script>

    <!-- Local CSS (commented out as in original) -->
    <!-- <link rel="stylesheet" href="assets/css/styles.css"> -->
    <style>
        /* Hide the 12th column (Tax Type) in both header and body */
        #freightTable th:nth-child(13),
        #freightTable td:nth-child(13) {
            display: none;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container mt-2" id="root">
        <div class="card shadow-lg rounded">
            <div class="card-header bg-primary text-white" style="margin-top: 68px;">
                <h3 class="mb-0">International Booking</h3>
                <input type="hidden" id="tempFormID" name="tempFormID">
                <input type="hidden" id="partyCode" name="partyCode">
                <input type="hidden" id="vendorCode" name="vendorCode">
            </div>

            <div class="card-body">
                <form class="container">
                    <!-- Button Group -->
                    <div class="d-flex flex-wrap justify-content-start gap-1 mb-2">
                        <button type="button" class="btn btn-primary btn-sm" id="newButton">
                            <i class="bi bi-file-earmark-plus"></i> New
                        </button>
                        <button type="button" class="btn btn-warning btn-sm" id="modifyButton" disabled>
                            <i class="bi bi-pencil"></i> Modify
                        </button>
                        <button type="button" class="btn btn-danger btn-sm" id="deleteButton" disabled>
                            <i class="bi bi-trash"></i> Delete
                        </button>
                        <button type="button" class="btn btn-info btn-sm" id="reportButton" disabled>
                            <i class="bi bi-file-earmark-text"></i> Report
                        </button>
                        <button type="button" class="btn btn-success btn-sm" id="saveButton">
                            <i class="bi bi-save"></i> Save
                        </button>
                        <!-- Row 2 -->
                        <div class="col-md-4 col-sm-6" hidden>
                            <div class="row align-items-center">
                                <label for="status" class="col-4 col-form-label">Status</label>
                                <div class="col-8">
                                    <input type="text" class="form-control bg-light" id="status" value="New" readonly>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Form Grid -->
                    <div class="row g-1">
                        <!-- Row 1 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="awbNo" class="col-4 col-form-label">Docket No</label>
                                <div class="col-8">
                                    <input list="docketNoSuggestions" class="form-control" id="awbNo" name="awbNo"
                                        required autocomplete="off" style="background-color: #e6f7ff;"
                                        oninput="loadAWBNoDetails(this.value)">
                                    <datalist id="docketNoSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="bookedDate" class="col-4 col-form-label">Booked Date</label>
                                <div class="col-8">
                                    <input type="date" class="form-control" id="bookedDate">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="partyName" class="col-4 col-form-label">Customer Name</label>
                                <div class="col-8">
                                    <input list="partySuggestions" class="form-control" id="partyName" name="partyName"
                                        required placeholder="Choose..." autocomplete="off">
                                    <datalist id="partySuggestions"></datalist>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="movementTypeI" class="col-4 col-form-label">Movement Type</label>
                                <div class="col-8">
                                    <select class="form-control" id="movementTypeI" name="movementTypeI" required>
                                        <option value="">Choose...</option>
                                        <option value="Export">Export</option>
                                        <option value="Import">Import</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="transitTypeI" class="col-4 col-form-label">Transit Type</label>
                                <div class="col-8">
                                    <select class="form-control" id="transitTypeI" name="transitTypeI" required>
                                        <option value="">Choose...</option>
                                        <option value="By Air Freight">By Air Freight</option>
                                        <option value="By Courier">By Courier</option>
                                        <option value="By Sea Freight">By Sea Freight</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Row 3 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="modeTypeI" class="col-4 col-form-label">Mode Type</label>
                                <div class="col-8">
                                    <select class="form-control" id="modeTypeI" name="modeTypeI" required>
                                        <option value="">Choose...</option>
                                        <option value="Dox">Dox</option>
                                        <option value="Non-Dox">Non-Dox</option>
                                        <option value="FCL">FCL</option>
                                        <option value="LCL">LCL</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="poNo" class="col-4 col-form-label">P.O No</label>
                                <div class="col-8">
                                    <input list="poNoSuggestions" class="form-control" id="poNo" name="poNo" required
                                        autocomplete="off">
                                    <datalist id="poNoSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="shippingType" class="form-label small">Shipping Type</label>
                                </div>
                                <div class="col-8">
                                    <select name="shippingType" id="shippingType" class="form-control"></select>
                                </div>
                            </div>
                        </div>
                        <!-- Row 4 -->

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="carrierName" class="form-label small">Carrier</label>
                                </div>
                                <div class="col-8">
                                    <select name="carrierName" id="carrierName" class="form-control"></select>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="serviceProvider" class="col-4 col-form-label">Service Provider</label>
                                <div class="col-8">
                                    <input list="vendorSuggestions" class="form-control" id="serviceProvider"
                                        name="serviceProvider" required placeholder="Choose..." autocomplete="off">
                                    <datalist id="vendorSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="shipperRef" class="col-4 col-form-label">Shipper Ref</label>
                                <div class="col-8">
                                    <input list="shipperRefSuggestions" class="form-control" id="shipperRef"
                                        name="shipperRef" required autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <!-- Row 5 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="invoiceValue" class="col-4 col-form-label">Invoice Value</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="invoiceValue" name="invoiceValue"
                                        autocomplete="off" value="0.00" step="0.01" min="0">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="PartyAddress" class="col-4 col-form-label">Pickup Address</label>
                                <div class="col-8">
                                    <input list="PartyAddressSuggestions" class="form-control" id="PartyAddress"
                                        name="PartyAddress" required autocomplete="off"
                                        oninput="PartyAddressDetails(this.value, 'Address', 'PartyAddressSuggestions')">
                                    <datalist id="PartyAddressSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="consigneeName" class="col-4 col-form-label">Consignee</label>
                                <div class="col-8">
                                    <input list="consigneeNameSuggestions" class="form-control" id="consigneeName"
                                        name="consigneeName" required autocomplete="off"
                                        oninput="consigneeDetails(this.value, 'ConsigneeName', 'consigneeNameSuggestions')"
                                        onchange="updateDeliveryAddress()">
                                    <datalist id="consigneeNameSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <!-- Row 6 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="deliveryAddress" class="col-4 col-form-label">D_Address</label>
                                <div class="col-8">
                                    <textarea class="form-control" id="deliveryAddress" name="deliveryAddress"
                                        autocomplete="off" rows="1"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="commodity" class="col-4 col-form-label">Commodity</label>
                                <div class="col-8">
                                    <input list="commoditySuggestions" class="form-control" id="commodity"
                                        name="commodity" required autocomplete="off" placeholder="Choose...">
                                    <datalist id="commoditySuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <!-- Row 7 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="clearanceMode" class="col-4 col-form-label">Clearance Mode</label>
                                <div class="col-8">
                                    <input list="clearanceModeSuggestions" class="form-control" id="clearanceMode"
                                        name="clearanceMode" required placeholder="Choose..." autocomplete="off">
                                    <datalist id="clearanceModeSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="originCountry" class="col-4 col-form-label">Origin</label>
                                <div class="col-8">
                                    <input list="originCountrySuggestions" class="form-control" id="originCountry"
                                        name="originCountry" required placeholder="Choose..."
                                        autocomplete="new-password"
                                        oninput="CountryDetails(this.value, 'originCountrySuggestions', 'originCountry')">
                                    <datalist id="originCountrySuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="destinationCountry" class="col-4 col-form-label">Destination</label>
                                <div class="col-8">
                                    <input list="destinationCountrySuggestions" class="form-control"
                                        id="destinationCountry" name="destinationCountry" required
                                        placeholder="Choose..." autocomplete="new-password"
                                        oninput="CountryDetails(this.value, 'destinationCountrySuggestions', 'destinationCountry')">
                                    <datalist id="destinationCountrySuggestions"></datalist>
                                </div>
                            </div>
                        </div>


                        <!-- Row 8 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="packingType" class="col-4 col-form-label">Packing Type</label>
                                <div class="col-8">
                                    <input list="packingTypeSuggestions" class="form-control" id="packingType"
                                        name="packingType" required placeholder="Enter Packing Type" autocomplete="off">
                                    <datalist id="packingTypeSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="uOMType" class="col-4 col-form-label">UOM</label>
                                <div class="col-8">
                                    <input list="uOMTypeSuggestions" class="form-control" id="uOMType" name="uOMType"
                                        required placeholder="Select UOM" autocomplete="off">
                                    <datalist id="uOMTypeSuggestions"></datalist>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="quantity" class="col-4 col-form-label">Quantity</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="quantity" placeholder="Enter Quantity"
                                        min="0">
                                </div>
                            </div>
                        </div>

                        <!-- Row 9 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="actualWeight" class="col-4 col-form-label">Act Wt</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="actualWeight"
                                        placeholder="Enter Actual Weight" min="0" step="0.01">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="volumetricWeight" class="col-4 col-form-label">Vol Wt</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="volumetricWeight"
                                        placeholder="Enter Volumetric Weight" min="0" step="0.01">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="chargeableWeight" class="col-4 col-form-label">Char Wt</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="chargeableWeight"
                                        placeholder="Enter Chargeable Weight" min="0" step="0.01">
                                </div>
                            </div>
                        </div>
                        <!-- Row 10 -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="infomation" class="col-4 col-form-label">Information</label>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="infomation"
                                        placeholder="Enter Information">
                                </div>
                            </div>
                        </div>

                        <!-- Tabbed Form Section -->
                        <div class="col-12 mt-3">
                            <ul class="nav nav-tabs" id="bookingTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="freight-tab" data-bs-toggle="tab"
                                        data-bs-target="#freight" type="button" role="tab">Freight</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="volumetric-tab" data-bs-toggle="tab"
                                        data-bs-target="#volumetric" type="button" role="tab">Volumetric</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="container-details-tab" data-bs-toggle="tab"
                                        data-bs-target="#container-details" type="button" role="tab">Container
                                        Details</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="status-tab" data-bs-toggle="tab"
                                        data-bs-target="#status" type="button" role="tab">Status</button>
                                </li>
                            </ul>

                            <div class="tab-content p-3 border border-top-0" id="bookingTabsContent">
                                <!-- Freight Tab -->
                                <div class="tab-pane fade show active" id="freight" role="tabpanel">
                                    <div class="row g-2 align-items-center">

                                        <!-- Charges Type -->
                                        <div class="col-md-3 col-sm-4">
                                            <div class="d-flex align-items-center">
                                                <label for="chargesTypeInput" class="form-label small me-1 mb-0"
                                                    style="white-space: nowrap;">Charges:</label>
                                                <input class="form-control" id="chargesTypeInput"
                                                    name="chargesTypeInput" list="chargesTypeList"
                                                    placeholder="Charges Type" autocomplete="off">
                                                <datalist id="chargesTypeList"></datalist>
                                            </div>
                                        </div>
                                        <!-- HSN -->
                                        <div class="col-md-1 col-sm-2">
                                            <div class="d-flex align-items-center">
                                                <label for="hsnNumber" class="form-label small me-1 mb-0">HSN:</label>
                                                <input type="text" class="form-control form-control-sm" id="hsnNumber"
                                                    name="hsnNumber">
                                            </div>
                                        </div>
                                        <!-- Amount -->
                                        <div class="col-md-2 col-sm-3">
                                            <div class="d-flex align-items-center">
                                                <label for="freightAmount"
                                                    class="form-label small me-1 mb-0">Amount:</label>
                                                <input type="number" class="form-control form-control-sm"
                                                    id="freightAmount" name="freightAmount" min="0" step="0.01">
                                            </div>
                                        </div>
                                        <!-- Remarks -->
                                        <div class="col-md-2 col-sm-4">
                                            <div class="d-flex align-items-center">
                                                <label for="remarksDetails"
                                                    class="form-label small me-1 mb-0">Remarks:</label>
                                                <input type="text" class="form-control form-control-sm"
                                                    id="remarksDetails" name="remarksDetails">
                                            </div>
                                        </div>
                                        <!-- Tax Rate -->
                                        <div class="col-md-3 col-sm-4">
                                            <div class="d-flex align-items-center">
                                                <label for="partyDefaultTax" class="form-label small me-1 mb-0">Tax
                                                    Rate:</label>
                                                <select class="form-control form-control-sm" id="partyDefaultTax"
                                                    name="partyDefaultTax">
                                                    <option value="" disabled selected>Select Tax</option>
                                                </select>
                                            </div>
                                        </div>

                                        <!-- Add Button -->
                                        <div class="col-md-1 col-sm-2">
                                            <button type="button" class="btn btn-sm btn-primary w-100"
                                                id="addFreightRow">Add</button>
                                            <!-- <button type="button" class="btn btn-sm btn-primary w-100">Add</button> -->
                                        </div>
                                    </div>
                                    <!-- Freight Charges Table -->
                                    <div class="table-responsive mt-3">
                                        <table class="table table-bordered table-sm" id="freightTable">
                                            <thead class="table-light">
                                                <tr class="text-center">
                                                    <th>Charges Type</th>
                                                    <th>HSN No</th>
                                                    <th>Remarks</th>
                                                    <th>Tax Rate</th>
                                                    <th>Quantity</th>
                                                    <th>Basic Amount</th>
                                                    <th>SGST Amt</th>
                                                    <th>CGST Amt</th>
                                                    <th>IGST Amt</th>
                                                    <th>Total GST Amt</th>
                                                    <th>Grand Total</th>
                                                    <th>Action</th>
                                                    <th>Tax Type</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <!-- Dynamically added rows will appear here -->
                                            </tbody>
                                            <tfoot>
                                                <tr id="totalsRow">
                                                    <th colspan="5" class="text-end">Totals:</th>
                                                    <th class="text-end" id="totalFreight">0.00</th>
                                                    <th class="text-end" id="totalSGST">0.00</th>
                                                    <th class="text-end" id="totalCGST">0.00</th>
                                                    <th class="text-end" id="totalIGST">0.00</th>
                                                    <th class="text-end" id="totalGST">0.00</th>
                                                    <th class="text-end" id="totalGrand">0.00</th>
                                                    <th></th><!-- for delete button column -->
                                                    <th style="display:none;"></th><!-- taxType column is hidden -->
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                </div>
                                <!-- Container Details Tab -->
                                <div class="tab-pane fade" id="container-details" role="tabpanel">
                                    <div class="mb-3">
                                        <label for="containerDetails" class="form-label small">Container Details</label>
                                        <textarea class="form-control" id="containerDetails" rows="3"
                                            placeholder="Enter Container Details"></textarea>
                                    </div>
                                </div>

                                <!-- Status Tab -->
                                <div class="tab-pane fade" id="status" role="tabpanel">
                                    <div class="mb-3">
                                        <label for="statusDetails" class="form-label small">Status</label>
                                        <textarea class="form-control" id="statusDetails" rows="3"
                                            placeholder="Enter Status"></textarea>
                                    </div>
                                </div>

                                <!-- Volumetric Tab -->
                                <div class="tab-pane fade" id="volumetric" role="tabpanel">
                                    <div class="mb-3">
                                        <label for="volumetricDetails" class="form-label small">Volumetric</label>
                                        <textarea class="form-control" id="volumetricDetails" rows="3"
                                            placeholder="Enter Volumetric Details"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>

                <!-- Add Consignee Modal -->
                <div class="modal fade" id="addConsigneeModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">

                            <div class="modal-header">
                                <h5 class="modal-title">Add New Consignee</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>

                            <div class="modal-body">
                                <form id="consigneeForm">
                                    <div class="mb-3">
                                        <label for="newConsigneeName" class="form-label">Consignee Name</label>
                                        <input type="text" class="form-control" id="newConsigneeName" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newConsigneeAddress" class="form-label">Consignee Address</label>
                                        <textarea class="form-control" id="newConsigneeAddress" required></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newContactPerson" class="form-label">Contact Person</label>
                                        <input type="text" class="form-control" id="newContactPerson" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newContactNumber" class="form-label">Contact Number</label>
                                        <input type="tel" class="form-control" id="newContactNumber" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newEmailID" class="form-label">Email ID</label>
                                        <input type="email" class="form-control" id="newEmailID" required>
                                    </div>
                                </form>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary" onclick="addNewConsignee(event)">
                                    Add Consignee
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Local Scripts -->
