<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizNavigation - Route Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js"></script>

    <!-- Local CSS (commented out as in original) -->
    <!-- <link rel="stylesheet" href="assets/css/styles.css"> -->
    <style>
        /* Hide the 12th column (Tax Type) in both header and body */
        #freightTable th:nth-child(13),
        #freightTable td:nth-child(13) {
            display: none;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container mt-2" id="root">
        <div class="card shadow-lg rounded">
            <div class="card-header bg-primary text-white" style="margin-top: 68px;">
                <h3 class="mb-0">Route Details</h3>
                <input type="hidden" id="tempFormID" name="tempFormID">
                <input type="hidden" id="partyCode" name="partyCode">
                <input type="hidden" id="vendorCode" name="vendorCode">
            </div>

            <div class="card-body">
                <form class="container">
                    <!-- Button Group -->
                    <div class="d-flex flex-wrap justify-content-start gap-1 mb-2">
                        <button type="button" class="btn btn-primary btn-sm" id="newButton">
                            <i class="bi bi-file-earmark-plus"></i> New
                        </button>
                        <button type="button" class="btn btn-warning btn-sm" id="modifyButton" disabled>
                            <i class="bi bi-pencil"></i> Modify
                        </button>
                        <button type="button" class="btn btn-danger btn-sm" id="deleteButton" disabled>
                            <i class="bi bi-trash"></i> Delete
                        </button>
                        <button type="button" class="btn btn-info btn-sm" id="reportButton" disabled>
                            <i class="bi bi-file-earmark-text"></i> Report
                        </button>
                        <button type="button" class="btn btn-success btn-sm" id="saveButton">
                            <i class="bi bi-save"></i> Save
                        </button>
                        <!-- Row 2 -->
                        <div class="col-md-4 col-sm-6" hidden>
                            <div class="row align-items-center">
                                <label for="status" class="col-4 col-form-label">Status</label>
                                <div class="col-8">
                                    <input type="text" class="form-control bg-light" id="status" value="New" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Form Grid -->
                    <div class="row g-1">
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="routeDescription" class="col-4 col-form-label">Route Description</label>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="routeDescription"
                                        name="routeDescription" style="text-transform: capitalize;" autocomplete="off"
                                        placeholder="Choose..." required>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <label for="distance" class="col-4 col-form-label">Distance (Kms)</label>
                                <div class="col-8">
                                    <input type="number" class="form-control" id="distance" name="distance"
                                        style="text-transform: capitalize;" autocomplete="off" step="1" min="1"
                                        value="0" required>
                                </div>
                            </div>
                        </div>
                        <!-- Add Button -->
                        <div class="col-md-1 col-sm-1 d-flex flex-column align-items-center pt-2">
                            <label class="form-label small invisible">Add</label>
                            <button type="button" class="btn btn-sm btn-primary w-100" id="addRouteDetails">Add</button>
                        </div>
                        <!-- Route Table -->
                        <div class="table-responsive mt-3">
                            <table class="table table-sm table-bordered text-center align-middle" id="routeTable">
                                <thead class="table-light">
                                    <tr>
                                        <th>Route Description</th>
                                        <th>Distance (Kms)</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Rows will be populated dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Local Scripts -->
    <script src="assets/js/server.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/AccessRules.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/taxDescription.js"></script>
    <script src="assets/js/customerlist.js"></script>
    <script src="assets/js/logout.js"></script>
    <script src="assets/js/dropdownLoader.js"></script>
    <script src="assets/js/utils.js"></script>
</body>

</html>
