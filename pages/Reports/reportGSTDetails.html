<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tax Report</title>

    <!-- Vendor CSS -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://code.jquery.com">
    <link rel="preconnect" href="https://unpkg.com">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="../../assets/css/navbar.css" />

    <style>
        :root {
            --table-header-bg: #343a40;
            --table-header-color: #fff;
            --table-hover-bg: #f1f1f1;
            --table-even-bg: #f9f9f9;
            --table-cell-padding: 8px 10px;
            --table-font-size: 0.8rem;
            --table-header-font-size: 0.85rem;
        }

        body {
            background: #f8f9fa;
        }

        #root {
            flex: 1;
            min-width: 0;
        }

        .hidden {
            display: none !important;
        }

        .table-wrapper {
            max-height: 500px;
            overflow: auto;
            background: #fff;
            border: 1px solid #6c757d;
            border-radius: 0.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }

        #taxDetailsTable {
            width: 100%;
            table-layout: fixed;
            margin-bottom: 0;
        }

        #taxDetailsTable th,
        #taxDetailsTable td {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
            padding: var(--table-cell-padding);
            font-size: var(--table-font-size);
        }

        #taxDetailsTable thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--table-header-bg);
            color: var(--table-header-color);
            text-align: center;
            font-size: var(--table-header-font-size);
            cursor: pointer;
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.08);
            vertical-align: middle;
        }

        #taxDetailsTable tbody tr:nth-child(even) {
            background: var(--table-even-bg);
        }

        #taxDetailsTable tbody tr:hover {
            background: var(--table-hover-bg);
        }

        /* Alignment */
        #taxDetailsTable th:nth-child(1),
        #taxDetailsTable td:nth-child(1),
        #taxDetailsTable th:nth-child(2),
        #taxDetailsTable td:nth-child(2),
        #taxDetailsTable th:nth-child(3),
        #taxDetailsTable td:nth-child(3) {
            text-align: center;
        }

        #taxDetailsTable th:nth-child(4),
        #taxDetailsTable td:nth-child(4),
        #taxDetailsTable th:nth-child(5),
        #taxDetailsTable td:nth-child(5),
        #taxDetailsTable th:nth-child(6),
        #taxDetailsTable td:nth-child(6) {
            text-align: left;
        }

        #taxDetailsTable th:nth-child(n+7),
        #taxDetailsTable td:nth-child(n+7) {
            text-align: right;
        }

        /* Column widths */
        #taxDetailsTable th:nth-child(1),
        #taxDetailsTable td:nth-child(1) {
            width: 70px;
        }

        #taxDetailsTable th:nth-child(2),
        #taxDetailsTable td:nth-child(2) {
            width: 100px;
        }

        #taxDetailsTable th:nth-child(3),
        #taxDetailsTable td:nth-child(3) {
            width: 130px;
        }

        #taxDetailsTable th:nth-child(4),
        #taxDetailsTable td:nth-child(4) {
            width: 220px;
        }

        #taxDetailsTable th:nth-child(5),
        #taxDetailsTable td:nth-child(5) {
            width: 120px;
        }

        #taxDetailsTable th:nth-child(6),
        #taxDetailsTable td:nth-child(6) {
            width: 160px;
        }

        #taxDetailsTable th:nth-child(n+7),
        #taxDetailsTable td:nth-child(n+7) {
            width: 120px;
        }

        #paginationControls {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 0;
        }

        .filter-actions,
        .report-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        @media (max-width: 768px) {
            :root {
                --table-cell-padding: 6px 8px;
                --table-font-size: 0.75rem;
                --table-header-font-size: 0.78rem;
            }
        }

        #taxDetailsTable tfoot td {
            position: sticky;
            bottom: 0;
            z-index: 9;
            background: #e9ecef;
            font-weight: 700;
            text-align: right;
            box-shadow: 0 -2px 2px rgba(0, 0, 0, 0.08);
            text-align: right;
        }

        #taxDetailsTable tfoot td:first-child {
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="app-wrapper">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="text-center text-white p-3">Loading...</div>
        </div>

        <!-- Main -->
        <div class="main-content">
            <div class="page-content">
                <div class="container-fluid" id="root">

                    <!-- Filter Toggle -->
                    <div class="mb-3 d-flex justify-content-between align-items-center flex-wrap">
                        <button class="btn btn-outline-secondary" type="button" data-bs-toggle="collapse"
                            data-bs-target="#filterSection" aria-expanded="false" aria-controls="filterSection">
                            <i class="bi bi-funnel"></i> Toggle Filters
                        </button>
                    </div>

                    <!-- Filters -->
                    <div class="collapse" id="filterSection">
                        <div class="row g-3 mb-4" id="searchFilters">
                            <div class="col-12 col-md-3 col-lg-2">
                                <label for="invoiceMonth" class="form-label">Invoice Month</label>
                                <input type="month" id="invoiceMonth" class="form-control">
                            </div>

                            <div class="col-12 col-md-3 col-lg-2">
                                <label for="invoiceYear" class="form-label">Invoice Year</label>
                                <input type="number" id="invoiceYear" class="form-control" placeholder="YYYY" min="2000"
                                    max="2100">
                            </div>

                            <div class="col-12 col-md-4 col-lg-3">
                                <label for="financialYear" class="form-label">Financial Year</label>
                                <input id="financialYear" class="form-control" placeholder="YYYY-YYYY"
                                    list="financialYearList">
                                <datalist id="financialYearList"></datalist>
                            </div>

                            <div class="col-12 col-md-2 col-lg-2 d-grid align-self-end">
                                <button class="btn btn-primary" id="searchBtn">
                                    <i class="bi bi-search"></i> Search Tax Report
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Loading -->
                    <div id="loadingSpinner" class="text-center my-4 d-none">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="table-wrapper">
                        <table class="table table-bordered table-hover table-sm" id="taxDetailsTable"
                            aria-label="Tax Report Table">
                            <thead>
                                <tr>
                                    <th data-key="RowID" class="text-center">Sr<br>No</th>
                                    <th data-key="InvoiceDate" class="text-center">Invoice<br>Date</th>
                                    <th data-key="InvoiceNo" class="text-center">Invoice No</th>
                                    <th data-key="CustomerName" class="text-center">Customer Name</th>
                                    <th data-key="State" class="text-center">State</th>
                                    <th data-key="GSTNo" class="text-center">GST No</th>
                                    <th data-key="NonTaxableAmount" class="text-center">Non-Taxable<br>Amount</th>
                                    <th data-key="TaxableAmount" class="text-center">Taxable<br>Amount</th>
                                    <th data-key="SGST" class="text-center">SGST Amt</th>
                                    <th data-key="CGST" class="text-center">CGST Amt</th>
                                    <th data-key="IGST" class="text-center">IGST Amt</th>
                                    <th data-key="TotalGST" class="text-center">Total GST<br>Amount</th>
                                    <th data-key="TotalInvoiceAmount" class="text-center">Total Invoice<br>Amount</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr id="emptyRow">
                                    <td colspan="13" class="text-center text-muted">
                                        No records found
                                    </td>
                                </tr>
                            <tfoot id="tableFooter">
                                <tr class="table-secondary fw-bold">
                                    <td colspan="6" class="text-end">Page Total</td>
                                    <td id="totalNonTaxable" class="text-end">0.00</td>
                                    <td id="totalTaxable" class="text-end">0.00</td>
                                    <td id="totalSGST" class="text-end">0.00</td>
                                    <td id="totalCGST" class="text-end">0.00</td>
                                    <td id="totalIGST" class="text-end">0.00</td>
                                    <td id="totalGST" class="text-end">0.00</td>
                                    <td id="totalInvoice" class="text-end">0.00</td>
                                </tr>
                            </tfoot>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination + Export -->
                    <div class="my-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <nav>
                            <ul class="pagination mb-0" id="paginationControls"></ul>
                        </nav>

                        <div class="report-actions">
                            <button class="btn btn-success px-3" id="exportExcelBtn" disabled>
                                <i class="bi bi-file-earmark-excel"></i> Export to Excel
                            </button>
                            <button class="btn btn-danger px-3" id="exportPdfBtn" disabled>
                                <i class="bi bi-file-earmark-pdf"></i> Export to PDF
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Vendor JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"
        defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>

    <!-- App JS -->
    <script src="../../assets/js/utils/server.js"></script>
    <script src="../../assets/js/utils/navbar.js"></script>
    <script src="../../assets/js/utils/utils.js"></script>
    <script src="../../assets/js/Report/taxDetails.js"></script>
    <script src="../../assets/js/utils/logout.js"></script>
</body>

</html>
