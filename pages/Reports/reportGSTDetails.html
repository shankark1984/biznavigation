<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tax Report</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- SheetJS, jsPDF, jsPDF AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"
        defer></script>

    <!-- jQuery, Bootstrap JS, Flatpickr, Supabase -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://code.jquery.com">
    <link rel="preconnect" href="https://unpkg.com">
    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="../../assets/css/navbar.css" />

    <!-- UI Enhancements -->
    <style>
        :root {
            --table-header-bg: #343a40;
            --table-header-color: #fff;
            --table-hover-bg: #f1f1f1;
            --table-even-bg: #f9f9f9;
        }

        #root {
            flex: 1;
        }

        .hidden {
            display: none !important;
        }

        .table-responsive {
            max-height: 500px;
            background: #fff;
            overflow: auto;
        }

        #paymentTable {
            width: 100%;
            table-layout: fixed;
        }

        #paymentTable th,
        #paymentTable td {
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #paymentTable th:nth-child(1),
        #paymentTable td:nth-child(1),
        #paymentTable th:nth-child(3),
        #paymentTable td:nth-child(3) {
            text-align: center;
        }

        #paymentTable th:nth-child(2),
        #paymentTable td:nth-child(2),
        #paymentTable th:nth-child(4),
        #paymentTable td:nth-child(4),
        #paymentTable th:nth-child(5),
        #paymentTable td:nth-child(5) {
            text-align: left;
        }

        #paymentTable th:nth-child(n+6),
        #paymentTable td:nth-child(n+6) {
            text-align: right;
        }

        .container-fluid {
            min-width: 0;
        }

        #paymentTable thead th {
            position: sticky;
            top: 0;
            z-index: 11;
            box-shadow: 0 2px 2px rgba(0, 0, 0, .1);
            background: var(--table-header-bg);
            color: var(--table-header-color);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 10px;
        }

        #paymentTable tbody td {
            vertical-align: middle;
            font-size: 0.8rem;
            padding: 8px 10px;
        }

        #paymentTable tbody tr:hover {
            background: var(--table-hover-bg);
        }

        #paymentTable tbody tr:nth-child(even) {
            background: var(--table-even-bg);
        }

        /* Column widths */

        #paymentTable th:nth-child(1),
        #paymentTable td:nth-child(1) {
            width: 70px;
        }

        #paymentTable th:nth-child(2),
        #paymentTable td:nth-child(2) {
            width: 120px;
        }

        #paymentTable th:nth-child(3),
        #paymentTable td:nth-child(3) {
            width: 110px;
        }

        #paymentTable th:nth-child(4),
        #paymentTable td:nth-child(4) {
            width: 180px;
        }

        #paymentTable th:nth-child(5),
        #paymentTable td:nth-child(5) {
            width: 130px;
        }

        #paymentTable th:nth-child(n+6),
        #paymentTable td:nth-child(n+6) {
            width: 120px;
            text-align: right;
        }

        #paginationControls {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        @media (max-width: 768px) {

            #paymentTable thead th,
            #paymentTable tbody td {
                font-size: 0.75rem;
                padding: 6px 8px;
            }
        }
    </style>
</head>

<body class="bg-light">
    <!-- 🔥 APP LAYOUT -->
    <div class="app-wrapper">

        <!-- Sidebar -->
        <div id="sidebar">
            <!-- fallback -->
            <div class="text-center text-white p-3">Loading...</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">

            <!-- 🔥 PAGE CONTENT -->
            <div class="page-content">

                <!-- YOUR EXISTING UI (UNCHANGED) -->

                <div class="container-fluid" id="root">

                    <!-- Filter Toggle -->
                    <div class="mb-3 d-flex justify-content-between align-items-center flex-wrap">
                        <button class="btn btn-outline-secondary" type="button" data-bs-toggle="collapse"
                            data-bs-target="#filterSection">
                            <i class="bi bi-funnel"></i> Toggle Filters
                        </button>
                    </div>

                    <!-- Filters Section -->
                    <div class="collapse" id="filterSection">
                        <div class="row g-3 mb-4" id="searchFilters">

                            <div class="col-6 col-md-2">
                                <label for="paymentMonth" class="form-label">Payment Month</label>
                                <input type="month" id="paymentMonth" class="form-control">
                            </div>
                            <div class="col-4 col-md-4">
                                <label for="paymentYear" class="form-label">Payment Year</label>
                                <input type="number" id="paymentYear" class="form-control" placeholder="YYYY" min="2000"
                                    max="2100">
                            </div>
                            <div class="col-4 col-md-4">
                                <label for="financialYear" class="form-label">Financial Year</label>
                                <input id="financialYear" class="form-control" placeholder="YYYY-YYYY"
                                    list="financialYearList">
                                <datalist id="financialYearList"></datalist>
                            </div>
                            <div class="col-6 col-md-2 col-lg-2 d-grid align-self-end">
                                <button class="btn btn-primary" id="searchBtn"><i class="bi bi-search"></i>
                                    Search Tax Report</button>
                            </div>
                        </div>
                    </div>

                    <!-- Spinner -->
                    <div id="loadingSpinner" class="text-center my-4 hidden">
                        <div class="spinner-border text-primary" role="status"><span
                                class="visually-hidden">Loading...</span></div>
                    </div>

                    <!-- Table -->
                    <!-- Table with outer border -->
                    <div class="table-responsive bg-white border border-secondary rounded shadow-sm">
                        <table class="table table-bordered table-hover table-sm mb-0" id="taxDetailsTable"
                            aria-label="Tax Report Table">
                            <thead class="table-dark text-center">
                                <tr>
                                    <th data-key="RowID">Sr No</th>
                                    <th data-key="InvoiceDate">Invoice Date</th>
                                    <th data-key="InvoiceNo">Invoice No</th>
                                    <th data-key="CustomerName">Customer Name</th>
                                    <th data-key="State">State</th>
                                    <th data-key="GSTNo">GST No</th>
                                    <th data-key="TotalInvoiceAmount">Total Invoice Amount</th>
                                    <th data-key="NonTaxableAmount">Non-Taxable Amount</th>
                                    <th data-key="TaxableAmount">Taxable Amount</th>
                                    <th data-key="SGST">SGST @9%</th>
                                    <th data-key="CGST">CGST @9%</th>
                                    <th data-key="IGST">IGST @18%</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr id="emptyRow">
                                    <td colspan="12" class="text-center text-muted">
                                        No records found
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>


                    <!-- Pagination & Export -->
                    <div class="mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <nav>
                            <ul class="pagination mb-0" id="paginationControls"></ul>
                        </nav>
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-success px-3" id="exportExcelBtn" disabled><i
                                    class="bi bi-file-earmark-excel"></i>
                                Export to
                                Excel</button>
                            <button class="btn btn-danger px-3" id="exportPdfBtn" disabled><i
                                    class="bi bi-file-earmark-pdf"></i>
                                Export to
                                PDF</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="../../assets/js/utils/server.js"></script>
    <script src="../../assets/js/utils/navbar.js"></script>
    <script src="../../assets/js/utils/utils.js"></script>
    <script src="../../assets/js/Report/taxDetails.js"></script>
    <script src="../../assets/js/utils/logout.js"></script>
</body>

</html>
