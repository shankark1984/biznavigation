<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Accounting Voucher Entry System">
    <title>Accounting Voucher</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

    <!-- Sidebar -->
    <link rel="stylesheet" href="../../assets/css/navbar.css">

    <style>
        .card {
            border: none;
            border-radius: .5rem;
        }

        .card-header {
            font-weight: 600;
        }

        .required::after {
            content: " *";
            color: red;
        }

        .readonly {
            background: #fff3cd !important;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: .25rem;
        }

        .btn-toolbar .btn {
            min-width: 90px;
        }
    </style>
</head>

<body class="bg-light">

    <div class="app-wrapper">

        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="text-center text-white p-3">
                Loading...
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <form id="voucherForm" autocomplete="off">
                <div class="container-fluid mt-3">

                    <!-- ===================================================== -->
                    <!-- TOOLBAR -->
                    <!-- ===================================================== -->
                    <div class="card shadow-sm mb-3">
                        <div class="card-body">
                            <div class="d-flex flex-wrap justify-content-between align-items-center">
                                <div class="btn-toolbar gap-2">
                                    <button type="button" class="btn btn-primary btn-sm" id="newButton">
                                        <i class="bi bi-file-earmark-plus"></i> New
                                    </button>
                                    <button type="button" class="btn btn-warning btn-sm" id="modifyButton" disabled>
                                        <i class="bi bi-pencil"></i> Modify
                                    </button>
                                    <button type="button" class="btn btn-danger btn-sm" id="deleteButton" disabled>
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                    <button type="button" class="btn btn-info btn-sm" id="printButton" disabled>
                                        <i class="bi bi-printer"></i> Print
                                    </button>
                                    <button type="button" class="btn btn-success btn-sm" id="saveButton"
                                        data-mode="insert">
                                        <i class="bi bi-save"></i> Save
                                    </button>
                                </div>
                                <div>
                                    <select id="selectCompany" class="form-select form-select-sm d-none"
                                        style="width:250px;">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Hidden Fields -->
                    <input type="hidden" id="voucherID">
                    <input type="hidden" id="companyID">
                    <input type="hidden" id="partyGST">

                    <!-- ===================================================== -->
                    <!-- VOUCHER INFORMATION -->
                    <!-- ===================================================== -->
                    <div class="card shadow-sm mb-3">
                        <div class="card-header bg-primary text-white"> Voucher Information </div>
                        <div class="card-body">
                            <div class="row g-3">
                                <!-- Voucher Type -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label required" for="voucherType"> Voucher Type </label>
                                    <select id="voucherType" class="form-select form-select-sm">
                                        <option value="JV">Journal Voucher</option>
                                        <option value="RV">Receipt Voucher</option>
                                        <option value="PV">Payment Voucher</option>
                                        <option value="CV">Contra Voucher</option>
                                        <option value="SV">Sales Voucher</option>
                                        <option value="PUR">Purchase Voucher</option>
                                        <option value="SAL">Salary Voucher</option>
                                        <option value="GST">GST Voucher</option>
                                        <option value="DN">Debit Note</option>
                                        <option value="CN">Credit Note</option>
                                        <option value="BC">Bank Charges</option>
                                        <option value="EMI">EMI Voucher</option>
                                        <option value="LV">Loan Voucher</option>
                                        <option value="IC">Interest Capitalized</option>
                                    </select>
                                </div>

                                <!-- Voucher No -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label required" for="voucherNo"> Voucher No </label>
                                    <div class="input-group input-group-sm">
                                        <input type="text" id="voucherNo" class="form-control"
                                            placeholder="Select Voucher No" readonly>
                                        <button type="button" class="btn btn-outline-secondary" id="voucherNoSearch">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Voucher Date -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label required" for="voucherDate"> Voucher Date </label>
                                    <input type="date" id="voucherDate" class="form-control form-control-sm">
                                </div>

                                <!-- Branch -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label required" for="branch"> Branch </label>
                                    <select id="branch" class="form-select form-select-sm"> </select>
                                </div>

                                <!-- Cost Center -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label" for="costCenter"> Cost Center </label>
                                    <select id="costCenter" class="form-select form-select-sm"> </select>
                                </div>

                                <!-- Reference -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label" for="referenceNo"> Reference No </label>
                                    <input type="text" id="referenceNo" class="form-control form-control-sm">
                                </div>
                            </div>

                            <hr>

                            <div class="row g-3">
                                <!-- Transaction -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label" for="transactionMode"> Transaction Mode </label>
                                    <select id="transactionMode" class="form-select form-select-sm">
                                        <option value="Bank">Bank</option>
                                        <option value="Cash">Cash</option>
                                        <option value="Cheque">Cheque</option>
                                        <option value="NEFT">NEFT</option>
                                        <option value="RTGS">RTGS</option>
                                        <option value="IMPS">IMPS</option>
                                        <option value="UPI">UPI</option>
                                        <option value="Card">Card</option>
                                        <option value="Online">Online</option>
                                    </select>
                                </div>

                                <!-- Bank -->
                                <div class="col-lg-2 col-md-8" id="bankSection">
                                    <label class="form-label" for="bankAccount"> Bank Account </label>
                                    <select id="bankAccount" class="form-select form-select-sm">
                                        <option value=""> Select Bank </option>
                                    </select>
                                </div>

                                <!-- Cheque -->
                                <div class="col-lg-2 col-md-4" id="instrumentSection">
                                    <label class="form-label" for="instrumentNo"> Cheque / UTR No </label>
                                    <input type="text" id="instrumentNo" class="form-control form-control-sm">
                                </div>

                                <!-- Narration -->
                                <div class="col-lg-2 col-md-8" id="narrationSection">
                                    <label class="form-label" for="narration"> Narration </label>
                                    <textarea id="narration" rows="1" class="form-control form-control-sm"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ===================================================== -->
                    <!-- ACCOUNTING ENTRY -->
                    <!-- ===================================================== -->
                    <div class="card shadow-sm mb-3">
                        <div class="card-header bg-success text-white"> Accounting Entry </div>
                        <div class="card-body">

                            <!-- Account & Party -->
                            <div class="row g-3">
                                <!-- Account -->
                                <div class="col-lg-4">
                                    <label class="form-label required" for="accountName"> Account </label>
                                    <div class="input-group input-group-sm">
                                        <input type="text" id="accountName" class="form-control"
                                            placeholder="Select Ledger" readonly>
                                        <input type="hidden" id="accountCode">
                                        <button type="button" class="btn btn-outline-secondary" id="btnAccountSearch">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Party -->
                                <div class="col-lg-5">
                                    <label class="form-label" for="partyName"> Party </label>
                                    <div class="input-group input-group-sm">
                                        <input type="text" id="partyName" class="form-control"
                                            placeholder="Select Party" readonly>
                                        <input type="hidden" id="partyCode">
                                        <button type="button" class="btn btn-outline-secondary" id="btnPartySearch">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- GSTIN -->
                                <div class="col-lg-3">
                                    <label class="form-label" for="partyGSTIN"> GSTIN </label>
                                    <input type="text" id="partyGSTIN" class="form-control form-control-sm" readonly>
                                </div>
                            </div>

                            <hr>

                            <!-- Debit / Credit -->
                            <div class="row g-3">
                                <div class="col-lg-2">
                                    <label class="form-label required" for="debit"> Debit </label>
                                    <input type="number" id="debit" class="form-control form-control-sm text-end"
                                        step="0.01" min="0" placeholder="0.00">
                                </div>

                                <div class="col-lg-2">
                                    <label class="form-label required" for="credit"> Credit </label>
                                    <input type="number" id="credit" class="form-control form-control-sm text-end"
                                        step="0.01" min="0" placeholder="0.00">
                                </div>

                                <div class="col-lg-2">
                                    <label class="form-label" for="gstType"> GST Type </label>
                                    <select id="gstType" class="form-select form-select-sm">
                                        <option value="Exclusive"> Exclusive </option>
                                        <option value="Inclusive"> Inclusive </option>
                                    </select>
                                </div>

                                <div class="col-lg-2">
                                    <label class="form-label" for="gstRate"> GST % </label>
                                    <select id="gstRate" class="form-select form-select-sm">
                                        <option value="0">0%</option>
                                        <option value="5">5%</option>
                                        <option value="12">12%</option>
                                        <option value="18">18%</option>
                                        <option value="28">28%</option>
                                    </select>
                                </div>
                            </div>

                            <hr>

                            <!-- GST Details -->
                            <div class="row g-3">
                                <div class="col-lg-2">
                                    <label class="form-label" for="cgstAmount"> CGST </label>
                                    <input type="number" id="cgstAmount"
                                        class="form-control form-control-sm text-end readonly" readonly value="0.00">
                                </div>
                                <div class="col-lg-2">
                                    <label class="form-label" for="sgstAmount"> SGST </label>
                                    <input type="number" id="sgstAmount"
                                        class="form-control form-control-sm text-end readonly" readonly value="0.00">
                                </div>
                                <div class="col-lg-2">
                                    <label class="form-label" for="igstAmount"> IGST </label>
                                    <input type="number" id="igstAmount"
                                        class="form-control form-control-sm text-end readonly" readonly value="0.00">
                                </div>
                                <div class="col-lg-2">
                                    <label class="form-label" for="gstAmount"> GST Amount </label>
                                    <input type="number" id="gstAmount"
                                        class="form-control form-control-sm text-end readonly fw-bold" readonly
                                        value="0.00">
                                </div>
                                <div class="col-lg-4">
                                    <label class="form-label" for="totalAmount"> Total Amount </label>
                                    <input type="number" id="totalAmount"
                                        class="form-control form-control-sm text-end readonly fw-bold" readonly
                                        value="0.00">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ===================================================== -->
                    <!-- MODALS -->
                    <!-- ===================================================== -->

                    <!-- ACCOUNT SEARCH MODAL -->
                    <div class="modal fade" id="accountModal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-xl modal-dialog-scrollable">
                            <div class="modal-content">
                                <div class="modal-header bg-primary text-white">
                                    <h5 class="modal-title">
                                        <i class="bi bi-journal-bookmark me-2"></i> Select Ledger
                                    </h5>
                                    <button type="button" class="btn-close btn-close-white"
                                        data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row mb-3">
                                        <div class="col-md-8">
                                            <input type="search" id="accountSearch" class="form-control"
                                                placeholder="Search by Ledger Name / Code..." autocomplete="off">
                                        </div>
                                        <div class="col-md-4 text-end">
                                            <span id="accountCount" class="badge bg-secondary">0 Records</span>
                                        </div>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table table-hover table-bordered table-sm align-middle">
                                            <thead class="table-light">
                                                <tr>
                                                    <th width="120"> Code </th>
                                                    <th> Ledger Name </th>
                                                    <th width="180"> Group </th>
                                                </tr>
                                            </thead>
                                            <tbody id="accountListBody"></tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Close</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- PARTY SEARCH MODAL -->
                    <div class="modal fade" id="partyModal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-xl modal-dialog-scrollable">
                            <div class="modal-content">
                                <div class="modal-header bg-success text-white">
                                    <h5 class="modal-title">
                                        <i class="bi bi-people-fill me-2"></i> Select Party
                                    </h5>
                                    <button type="button" class="btn-close btn-close-white"
                                        data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row mb-3">
                                        <div class="col-md-8">
                                            <input type="search" id="partySearch" class="form-control"
                                                placeholder="Search by Party Name / GSTIN / Mobile..."
                                                autocomplete="off">
                                        </div>
                                        <div class="col-md-4 text-end">
                                            <span id="partyCountBadge" class="badge bg-secondary">0 Records</span>
                                        </div>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table table-hover table-bordered table-sm align-middle">
                                            <thead class="table-light">
                                                <tr>
                                                    <th width="120"> Code </th>
                                                    <th> Party Name </th>
                                                    <th width="170"> GSTIN </th>
                                                    <th width="150"> State </th>
                                                </tr>
                                            </thead>
                                            <tbody id="partyListBody"></tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Close</button>
                                </div>
                            </div>
                        </div>
                    </div>



                </div>
            </form>
        </main>
    </div>
    <!-- VOUCHER SEARCH MODAL -->
    <div class="modal fade" id="voucherModal" tabindex="-1" aria-labelledby="voucherModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content shadow">
                <div class="modal-header bg-success text-white py-2">
                    <h5 class="modal-title" id="voucherModalLabel">
                        <i class="bi bi-receipt-cutoff me-2"></i> Select Voucher
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-2 align-items-center mb-3">
                        <div class="col-lg-9 col-md-8">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>
                                <input type="search" id="voucherSearch" class="form-control"
                                    placeholder="Search Voucher No, Branch, Cost Center, Bank..." autocomplete="off">
                            </div>
                        </div>
                        <div class="col-lg-3 col-md-4 text-md-end">
                            <span id="voucherCountBadge" class="badge bg-secondary fs-6 px-3 py-2">0
                                Records</span>
                        </div>
                    </div>
                    <div class="table-responsive" style="max-height: 60vh;">
                        <table class="table table-hover table-bordered table-sm align-middle mb-0">
                            <thead class="table-success sticky-top">
                                <tr>
                                    <th style="width:200px;">Voucher No</th>
                                    <th style="width:120px;">Date</th>
                                    <th>Branch</th>
                                    <th>Cost Center</th>
                                    <th>Bank Account</th>
                                    <th class="text-end" style="width:140px;">Amount</th>
                                </tr>
                            </thead>
                            <tbody id="voucherListBody">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-3 px-3">
                    <div id="voucherCount" class="text-muted">0 Records</div>
                    <div id="voucherPagination"></div>
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-1"></i> Close
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Alert Container -->
    <div id="alertContainer" class="position-fixed top-0 end-0 p-3" style="z-index:1055;"></div>

    <!-- ==========================================
      JAVASCRIPT LIBRARIES
    ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ==========================================
      APPLICATION SCRIPTS
    ========================================== -->
    <script src="../../assets/js/utils/server.js"></script>
    <script src="../../assets/js/utils/utils.js"></script>
    <script src="../../assets/js/utils/navbar.js"></script>
    <script src="../../assets/js/utils/logout.js"></script>
    <script src="../../assets/js/utils/GlobalShortcut.js"></script>
    <script src="../../assets/js/accounting/AccountingVoucher.js"></script>

</body>

</html>
