<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Voucher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/AccountingVoucher.css">
    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="../../assets/css/navbar.css" />

</head>

<body class="bg-light">
    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside id="sidebar">
            <!-- fallback -->
            <div class="text-center text-white p-3">Loading...</div>
        </aside>
        <!-- Main Content -->
        <main class="main-content">
            <form id="voucherForm" autocomplete="off">
                <div class="container-fluid mt-2">
                    <!-- ===========================
            PAGE HEADER
            ============================ -->

                    <section id="pageHeader" class="card shadow-sm mb-3">


                        <div class="card-header d-flex flex-wrap justify-content-between gap-2 align-items-center">
                            <div class="d-flex flex-wrap gap-1 mb-2">
                                <button type="button" class="btn btn-primary btn-sm" id="newButton" aria-label="New"><i
                                        class="bi bi-file-earmark-plus"></i> New</button>
                                <button type="button" class="btn btn-warning btn-sm" id="modifyButton"
                                    aria-label="Modify"><i class="bi bi-pencil"></i> Modify</button>
                                <button type="button" class="btn btn-danger btn-sm" id="deleteButton"
                                    aria-label="Delete" disabled><i class="bi bi-trash"></i> Delete</button>
                                <button type="button" class="btn btn-info btn-sm" id="reportButton" disabled>
                                    <i class="bi bi-printer"></i> Print </button>
                                <button type="button" class="btn btn-success btn-sm" id="saveButton" data-mode="insert"
                                    aria-label="Save"><i class="bi bi-save"></i> Save</button>

                                <input type="hidden" id="tempFormID">
                                <input type="hidden" id="companyCode">
                                <input type="hidden" id="vendorCode">
                                <input type="hidden" id="voucherID">
                                <!-- Search Company Selection -->
                                <div id="companySelectWrapper" style="display:none;" class="company-search">
                                    <select class="form-select" id="selectCompany">
                                        <option value="">Select company</option>
                                    </select>
                                </div>
                                <span id="compID" class="d-none"></span>
                            </div>
                        </div>

                    </section>

                    <!-- ===========================
                    VOUCHER HEADER
                ============================ -->

                    <section id="voucherHeader" class="card shadow-sm mb-3">

                        <div class="card-body">

                            <div class="row g-3">
                                <div class="col-sm-6 col-lg-2">
                                    <label class="form-label">Voucher Type</label>
                                    <select class="form-select" id="voucherType">
                                        <option value="JV">Journal Voucher</option>
                                        <option value="RV">Receipt Voucher</option>
                                        <option value="PV">Payment Voucher</option>
                                        <option value="CV">Contra Voucher</option>
                                        <option value="SV">Sales Voucher</option>
                                        <option value="PUR">Purchase Voucher</option>
                                        <option value="SAL">Salary Voucher</option>
                                        <option value="GST">GST Voucher</option>
                                        <option value="DN">Debit Note</option>
                                        <option value="CN">Credit Note</option>
                                        <option value="BC">Bank Charges</option>
                                    </select>
                                </div>

                                <div class="col-sm-6 col-lg-2">
                                    <label class="form-label">Voucher No</label>
                                    <input type="text" class="form-control" id="voucherNo" readonly>
                                </div>
                                <div class="col-sm-6 col-lg-2">
                                    <label class="form-label">Date</label>
                                    <input type="date" class="form-control" id="voucherDate" required>
                                </div>
                                <div class="col-sm-6 col-lg-2">
                                    <label class="form-label">Reference No</label>
                                    <input type="text" class="form-control" id="referenceNo">
                                </div>
                                <div class="col-sm-6 col-lg-2">
                                    <label class="form-label">Branch</label>
                                    <select class="form-select" id="branch" required>
                                    </select>
                                </div>
                                <div class="col-sm-6 col-lg-2">
                                    <label class="form-label">Cost Center</label>
                                    <select class="form-select" id="costCenter" required>
                                    </select>
                                </div>
                                <div class="row g-3 mt-2">

                                    <!-- Transaction Mode -->
                                    <div class="col-sm-6 col-lg-2">
                                        <label class="form-label">Transaction Mode</label>
                                        <select class="form-select" id="transactionMode">
                                            <option value="Bank">Bank</option>
                                            <option value="Cash">Cash</option>
                                            <option value="UPI">UPI</option>
                                            <option value="Cheque">Cheque</option>
                                            <option value="NEFT">NEFT</option>
                                            <option value="RTGS">RTGS</option>
                                            <option value="IMPS">IMPS</option>
                                            <option value="Card">Card</option>
                                            <option value="Online">Online</option>
                                        </select>
                                    </div>

                                    <!-- Bank -->
                                    <div class="col-sm-6 col-lg-3" id="bankSection" style="display:none;">
                                        <label class="form-label">Bank Account</label>
                                        <select class="form-select" id="bankAccount">
                                            <option value="">Select Bank</option>
                                        </select>
                                    </div>

                                    <!-- Instrument No -->
                                    <div class="col-sm-6 col-lg-2" id="instrumentSection" style="display:none;">
                                        <label class="form-label">Cheque / UTR No.</label>
                                        <input type="text" class="form-control" id="instrumentNo">
                                    </div>
                                    <div class="col-10" id="narrationSection">
                                        <label class="form-label"> Narration </label>
                                        <textarea id="narration" class="form-control" rows="1"
                                            placeholder="Enter voucher narration..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    <!-- ===========================
         ACCOUNTING GRID
    ============================ -->

                    <section id="accountingGrid" class="card shadow-sm mb-3">
                        <div class="card-header d-flex justify-content-between">
                            <strong>Voucher Entries</strong>
                            <div>
                                <button type="button" class="btn btn-success btn-sm" id="btnAddRow">
                                    <i class="bi bi-plus-circle"></i>
                                    Add Row
                                </button>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle table-sm" id="voucherTable">

                                <thead class="table-dark">
                                    <tr>
                                        <th width="50">#</th>
                                        <th width="260"> Account </th>
                                        <th width="220"> Party </th>
                                        <th> Remarks </th>
                                        <th width="80"> Debit </th>
                                        <th width="80"> Credit </th>
                                        <th width="120"> GST Type </th>
                                        <th width="120"> GST % </th>
                                        <th width="130"> GST Amount </th>
                                        <th width="130"> Total Amount </th>
                                        <th width="60"> Action </th>
                                    </tr>
                                </thead>

                                <tbody id="voucherBody">
                                    <tr>
                                        <td>1</td>
                                        <td>
                                            <div class="input-group">
                                                <input type="text" class="form-control accountName"
                                                    placeholder="Select Ledger" readonly>
                                                <input type="hidden" class="accountCode">
                                                <button type="button" class="btn btn-outline-secondary accountSearch">
                                                    <i class="bi bi-search"></i>
                                                </button>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="input-group">
                                                <input type="text" class="form-control partyName"
                                                    placeholder="Select Party" readonly>
                                                <input type="hidden" class="partyCode">
                                                <button type="button" class="btn btn-outline-secondary partySearch">
                                                    <i class="bi bi-search"></i>
                                                </button>
                                            </div>
                                        </td>
                                        <td>
                                            <textarea class="form-control remarks" rows="1"></textarea>
                                        </td>
                                        <td>
                                            <input class="form-control debit text-end" type="number" inputmode="decimal"
                                                step="0.01" placeholder="0.00">
                                        </td>
                                        <td>
                                            <input class="form-control credit text-end" type="number"
                                                inputmode="decimal" step="0.01" placeholder="0.00">
                                        </td>
                                        <td>
                                            <select class="form-select gstType">
                                                <option value="Exclusive" selected>Exclusive</option>
                                                <option value="Inclusive">Inclusive</option>
                                            </select>
                                        </td>
                                        <td>
                                            <select class="form-select gstRate text-end">
                                                <option value="0">0%</option>
                                                <option value="5">5%</option>
                                                <option value="12">12%</option>
                                                <option value="18">18%</option>
                                                <option value="28">28%</option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="number" class="form-control gstAmount text-end" value="0"
                                                readonly>
                                        </td>
                                        <td> <input type="number" class="form-control totalAmount text-end" value="0"
                                                readonly></td>


                                        <td class="text-center">
                                            <button type="button" class="btn btn-danger btn-sm deleteRow">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr class="table-warning">
                                        <th colspan="4" class="text-end"> Total </th>
                                        <th id="totalDebit" class="text-end"> 0.00 </th>
                                        <th id="totalCredit" class="text-end"> 0.00 </th>
                                        <th></th>
                                        <th></th>
                                        <th id="totalGst" class="text-end"> 0.00</th>
                                        <th id="Grandtotal" class="text-end"> 0.00</th>
                                        <th></th>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </section>
                </div>
            </form>
            <!-- =========================================
     ACCOUNT SEARCH MODAL
========================================= -->

            <div class="modal fade" id="accountModal" tabindex="-1">
                <div class="modal-dialog modal-xl modal-dialog-scrollable">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5>Select Ledger</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal">
                            </button>
                        </div>
                        <div class="modal-body">
                            <div class="sticky-top bg-white pb-2">
                                <input class="form-control" id="accountSearch" autocomplete="off" spellcheck="false"
                                    placeholder="Search Ledger...">
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Code</th>
                                            <th>Ledger</th>
                                            <th>Type</th>
                                        </tr>
                                    </thead>
                                    <tbody id="accountListBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal fade" id="partyModal" tabindex="-1">
                <div class="modal-dialog modal-xl modal-dialog-scrollable">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5>Select Party</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal">
                            </button>
                        </div>
                        <div class="modal-body">
                            <input type="text" class="form-control mb-3" id="partySearch" placeholder="Search Party...">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Code</th>
                                            <th>Party Name</th>
                                            <th>GSTIN</th>
                                            <th>State</th>
                                        </tr>
                                    </thead>
                                    <tbody id="partyListBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ===================
    ACCOUNT DATALIST
    =================== -->

    <datalist id="accountList"></datalist>
    <datalist id="partyList"></datalist>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../../assets/js/utils/server.js"></script>
    <script src="../../assets/js/utils/utils.js"></script>
    <script src="../../assets/js/utils/navbar.js"></script>
    <script src="../../assets/js/utils/logout.js"></script>
    <script src="../../assets/js/utils/GlobalShortcut.js" defer></script>
    <script src="../../assets/js/accounting/AccountingVoucher.js"></script>
</body>

</html>
