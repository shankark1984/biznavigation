<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Accounting Voucher Entry System">
    <title>Accounting Voucher</title>

    <!-- Resource Hints -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

    <!-- Sidebar -->
    <link rel="stylesheet" href="../../assets/css/navbar.css">

    <!-- Upgraded Modern Voucher Styles (Unified) -->
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #059669;
            --warning-color: #d97706;
            --danger-color: #dc2626;
            --info-color: #0284c7;
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.2s ease-in-out;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        /* Card Styling */
        .card {
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02) !important;
            background-color: var(--surface-color);
        }

        .card-body {
            padding: 1.5rem 2rem !important;
        }

        /* Section Headers inside the single card */
        .section-header {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-main);
            padding: 0 0 0.65rem 0;
            margin: 0 0 1.25rem 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-header::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            border-radius: 2px;
            background-color: var(--primary-color);
        }

        .section-header.success::before {
            background-color: var(--success-color);
        }

        /* Action Bar */
        .action-bar {
            padding-bottom: 1.25rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        .btn {
            font-weight: 500;
            border-radius: 6px;
            padding: 0.4rem 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: var(--transition);
        }

        .btn-sm {
            font-size: 0.85rem;
        }

        .btn-toolbar .btn {
            min-width: 90px;
        }

        /* Form Controls */
        .form-label {
            margin-bottom: 0.3rem !important;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control,
        .form-select {
            padding: 0.45rem 0.75rem !important;
            font-size: 0.875rem !important;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            transition: var(--transition);
        }

        .form-control-sm,
        .form-select-sm {
            padding: 0.4rem 0.7rem !important;
            font-size: 0.85rem !important;
            border-radius: var(--radius-md);
        }

        .form-control:hover,
        .form-select:hover {
            border-color: #cbd5e1;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #ffffff;
            border-color: #93c5fd;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        textarea.form-control {
            min-height: 38px !important;
            resize: none;
        }

        /* Required asterisk */
        .required::after {
            content: " *";
            color: var(--danger-color);
            font-weight: 700;
        }

        /* Readonly / calculated fields */
        .readonly,
        .form-control[readonly] {
            background-color: #f1f5f9 !important;
            color: #475569;
            cursor: default;
        }

        /* Input group consistency */
        .input-group-sm>.form-control,
        .input-group-sm>.form-select {
            padding: 0.4rem 0.7rem !important;
            font-size: 0.85rem !important;
        }

        .input-group-text {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .input-group .btn-outline-secondary {
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            background-color: #ffffff;
        }

        .input-group .btn-outline-secondary:hover {
            background-color: #eff6ff;
            color: var(--primary-color);
            border-color: #bfdbfe;
        }

        /* Divider */
        hr {
            border-top: 1px solid var(--border-color);
            opacity: 1;
            margin: 1.5rem 0;
        }

        /* Modals */
        .modal-content {
            border: none;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            border-top: 1px solid var(--border-color);
            padding: 0.85rem 1.5rem;
            background-color: #f8fafc;
        }

        /* Soften modal header backgrounds */
        .modal-header.bg-primary {
            background-color: var(--primary-color) !important;
            color: #ffffff;
        }

        .modal-header.bg-success {
            background-color: var(--success-color) !important;
            color: #ffffff;
        }

        /* Modal Tables */
        .modal .table {
            margin-bottom: 0;
            font-size: 0.85rem;
        }

        .modal .table thead th {
            position: sticky;
            top: 0;
            background-color: #f1f5f9 !important;
            color: var(--text-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            padding: 0.6rem 0.75rem !important;
            border-bottom: 1px solid var(--border-color);
            border-top: none;
            z-index: 2;
            white-space: nowrap;
        }

        .modal .table tbody td {
            padding: 0.6rem 0.75rem !important;
            font-size: 0.85rem;
            vertical-align: middle;
            border-color: var(--border-color);
            color: var(--text-main);
        }

        .modal .table tbody tr {
            cursor: pointer;
            transition: var(--transition);
        }

        .modal .table tbody tr:hover {
            background-color: #f8fafc;
        }

        /* Badges */
        .badge.bg-secondary {
            background-color: #e2e8f0 !important;
            color: #475569 !important;
            font-weight: 600;
            padding: 0.4rem 0.75rem;
            font-size: 0.75rem;
        }

        /* Search input inside modal */
        .modal input[type="search"],
        .modal input[type="text"] {
            padding: 0.5rem 0.85rem !important;
            font-size: 0.875rem !important;
        }

        /* Select2 unified look */
        .select2-container--default .select2-selection--single,
        .select2-container--default .select2-selection--multiple {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: #f8fafc;
            min-height: 38px;
            padding: 0.15rem 0.5rem;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 30px;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .select2-container--default.select2-container--focus .select2-selection--single,
        .select2-container--default.select2-container--focus .select2-selection--multiple {
            border-color: #93c5fd;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            background-color: #ffffff;
        }

        .select2-dropdown {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .select2-results__option--highlighted {
            background-color: var(--primary-color) !important;
        }

        /* Alert / Toast */
        #alertContainer .alert {
            border: none;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            font-size: 0.875rem;
        }

        /* Mobile tweaks */
        @media (max-width: 768px) {
            .card-body {
                padding: 1rem 1.25rem !important;
            }

            .btn-toolbar .btn {
                min-width: auto;
            }
        }
    </style>
</head>

<body>
    <div class="app-wrapper">

        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="text-center text-muted p-3">Loading Sidebar...</div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <form id="voucherForm" autocomplete="off">
                <div class="container-fluid mt-3 mb-4">

                    <!-- Single Unified Card -->
                    <div class="card">
                        <div class="card-body">

                            <!-- ===================================================== -->
                            <!-- TOOLBAR / ACTION BAR -->
                            <!-- ===================================================== -->
                            <div class="action-bar d-flex flex-wrap gap-2 align-items-center justify-content-between">
                                <h5 class="m-0 fw-bold text-dark d-none d-md-block">Accounting Voucher</h5>

                                <div class="btn-toolbar gap-2" role="group" aria-label="Voucher actions">
                                    <button type="button" class="btn btn-outline-primary btn-sm bg-white" id="newButton"
                                        title="Create new voucher">
                                        <i class="bi bi-file-earmark-plus"></i> New
                                    </button>
                                    <button type="button" class="btn btn-outline-warning btn-sm bg-white"
                                        id="modifyButton" disabled title="Modify voucher">
                                        <i class="bi bi-pencil"></i> Modify
                                    </button>
                                    <button type="button" class="btn btn-outline-danger btn-sm bg-white"
                                        id="deleteButton" disabled title="Delete voucher">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                    <button type="button" class="btn btn-outline-info btn-sm bg-white" id="printButton"
                                        disabled title="Print voucher">
                                        <i class="bi bi-printer"></i> Print
                                    </button>
                                    <button type="button" class="btn btn-primary btn-sm px-4 shadow-sm" id="saveButton"
                                        data-mode="insert" title="Save voucher">
                                        <i class="bi bi-check2-circle"></i> Save
                                    </button>
                                </div>

                                <div>
                                    <select id="selectCompany" class="form-select form-select-sm d-none"
                                        style="width: 250px;">
                                    </select>
                                </div>
                            </div>

                            <!-- Hidden Fields -->
                            <input type="hidden" id="voucherID">
                            <input type="hidden" id="companyID">
                            <input type="hidden" id="partyGST">

                            <!-- ===================================================== -->
                            <!-- SECTION: VOUCHER INFORMATION -->
                            <!-- ===================================================== -->
                            <h6 class="section-header">
                                <i class="bi bi-file-text"></i> Voucher Information
                            </h6>

                            <div class="row g-3">
                                <!-- Voucher Type -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label required" for="voucherType">Voucher Type</label>
                                    <select id="voucherType" class="form-select form-select-sm">
                                        <option value="JV">Journal Voucher</option>
                                        <option value="RV">Receipt Voucher</option>
                                        <option value="PV">Payment Voucher</option>
                                        <option value="CV">Contra Voucher</option>
                                        <option value="SV">Sales Voucher</option>
                                        <option value="PUR">Purchase Voucher</option>
                                        <option value="SAL">Salary Voucher</option>
                                        <option value="GST">GST Voucher</option>
                                        <option value="DN">Debit Note</option>
                                        <option value="CN">Credit Note</option>
                                        <option value="BC">Bank Charges</option>
                                        <option value="EMI">EMI Voucher</option>
                                        <option value="LV">Loan Voucher</option>
                                        <option value="IC">Interest Capitalized</option>
                                    </select>
                                </div>

                                <!-- Voucher No -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label required" for="voucherNo">Voucher No</label>
                                    <div class="input-group input-group-sm">
                                        <input type="text" id="voucherNo" class="form-control"
                                            placeholder="Select Voucher No" readonly>
                                        <button type="button" class="btn btn-outline-secondary" id="voucherNoSearch"
                                            title="Search voucher">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Voucher Date -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label required" for="voucherDate">Voucher Date</label>
                                    <input type="date" id="voucherDate" class="form-control form-control-sm">
                                </div>

                                <!-- Branch -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label required" for="branch">Branch</label>
                                    <select id="branch" class="form-select form-select-sm"></select>
                                </div>

                                <!-- Cost Center -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label" for="costCenter">Cost Center</label>
                                    <select id="costCenter" class="form-select form-select-sm"></select>
                                </div>

                                <!-- Reference -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label" for="referenceNo">Reference No</label>
                                    <input type="text" id="referenceNo" class="form-control form-control-sm"
                                        placeholder="Optional">
                                </div>
                            </div>

                            <hr>

                            <div class="row g-3">
                                <!-- Transaction Mode -->
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label" for="transactionMode">Transaction Mode</label>
                                    <select id="transactionMode" class="form-select form-select-sm">
                                        <option value="Bank">Bank</option>
                                        <option value="Cash">Cash</option>
                                        <option value="Cheque">Cheque</option>
                                        <option value="NEFT">NEFT</option>
                                        <option value="RTGS">RTGS</option>
                                        <option value="IMPS">IMPS</option>
                                        <option value="UPI">UPI</option>
                                        <option value="Card">Card</option>
                                        <option value="Online">Online</option>
                                    </select>
                                </div>

                                <!-- Bank -->
                                <div class="col-lg-2 col-md-8" id="bankSection">
                                    <label class="form-label" for="bankAccount">Bank Account</label>
                                    <select id="bankAccount" class="form-select form-select-sm">
                                        <option value="">Select Bank</option>
                                    </select>
                                </div>

                                <!-- Cheque -->
                                <div class="col-lg-2 col-md-4" id="instrumentSection">
                                    <label class="form-label" for="instrumentNo">Cheque / UTR No</label>
                                    <input type="text" id="instrumentNo" class="form-control form-control-sm"
                                        placeholder="Instrument no">
                                </div>

                                <!-- Narration -->
                                <div class="col-lg-2 col-md-8" id="narrationSection">
                                    <label class="form-label" for="narration">Narration</label>
                                    <textarea id="narration" rows="1" class="form-control form-control-sm"
                                        placeholder="Enter narration"></textarea>
                                </div>
                            </div>

                            <!-- ===================================================== -->
                            <!-- SECTION: ACCOUNTING ENTRY -->
                            <!-- ===================================================== -->
                            <h6 class="section-header success mt-4" style="margin-top: 2rem;">
                                <i class="bi bi-journal-text"></i> Accounting Entry
                            </h6>

                            <!-- Account & Party -->
                            <div class="row g-3">
                                <!-- Account -->
                                <div class="col-lg-4">
                                    <label class="form-label required" for="accountName">Account</label>
                                    <div class="input-group input-group-sm">
                                        <input type="text" id="accountName" class="form-control"
                                            placeholder="Select Ledger" readonly>
                                        <input type="hidden" id="accountCode">
                                        <button type="button" class="btn btn-outline-secondary" id="btnAccountSearch"
                                            title="Search ledger">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Party -->
                                <div class="col-lg-5">
                                    <label class="form-label" for="partyName">Party</label>
                                    <div class="input-group input-group-sm">
                                        <input type="text" id="partyName" class="form-control"
                                            placeholder="Select Party" readonly>
                                        <input type="hidden" id="partyCode">
                                        <button type="button" class="btn btn-outline-secondary" id="btnPartySearch"
                                            title="Search party">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- GSTIN -->
                                <div class="col-lg-3">
                                    <label class="form-label" for="partyGSTIN">GSTIN</label>
                                    <input type="text" id="partyGSTIN"
                                        class="form-control form-control-sm text-uppercase" readonly>
                                </div>
                            </div>

                            <hr>

                            <!-- Debit / Credit -->
                            <div class="row g-3">
                                <div class="col-lg-2">
                                    <label class="form-label required" for="debit">Debit</label>
                                    <input type="number" id="debit" class="form-control form-control-sm text-end"
                                        step="0.01" min="0" placeholder="0.00">
                                </div>

                                <div class="col-lg-2">
                                    <label class="form-label required" for="credit">Credit</label>
                                    <input type="number" id="credit" class="form-control form-control-sm text-end"
                                        step="0.01" min="0" placeholder="0.00">
                                </div>

                                <div class="col-lg-2">
                                    <label class="form-label" for="gstType">GST Type</label>
                                    <select id="gstType" class="form-select form-select-sm">
                                        <option value="Exclusive">Exclusive</option>
                                        <option value="Inclusive">Inclusive</option>
                                    </select>
                                </div>

                                <div class="col-lg-2">
                                    <label class="form-label" for="gstRate">GST %</label>
                                    <select id="gstRate" class="form-select form-select-sm">
                                        <option value="0">0%</option>
                                        <option value="5">5%</option>
                                        <option value="12">12%</option>
                                        <option value="18">18%</option>
                                        <option value="28">28%</option>
                                    </select>
                                </div>
                            </div>

                            <hr>

                            <!-- GST Details -->
                            <div class="row g-3">
                                <div class="col-lg-2">
                                    <label class="form-label" for="cgstAmount">CGST</label>
                                    <input type="number" id="cgstAmount"
                                        class="form-control form-control-sm text-end readonly" readonly value="0.00">
                                </div>
                                <div class="col-lg-2">
                                    <label class="form-label" for="sgstAmount">SGST</label>
                                    <input type="number" id="sgstAmount"
                                        class="form-control form-control-sm text-end readonly" readonly value="0.00">
                                </div>
                                <div class="col-lg-2">
                                    <label class="form-label" for="igstAmount">IGST</label>
                                    <input type="number" id="igstAmount"
                                        class="form-control form-control-sm text-end readonly" readonly value="0.00">
                                </div>
                                <div class="col-lg-2">
                                    <label class="form-label" for="gstAmount">GST Amount</label>
                                    <input type="number" id="gstAmount"
                                        class="form-control form-control-sm text-end readonly fw-bold" readonly
                                        value="0.00">
                                </div>
                                <div class="col-lg-4">
                                    <label class="form-label" for="totalAmount">Total Amount</label>
                                    <input type="number" id="totalAmount"
                                        class="form-control form-control-sm text-end readonly fw-bold" readonly
                                        value="0.00">
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- ===================================================== -->
                    <!-- MODALS -->
                    <!-- ===================================================== -->

                    <!-- ACCOUNT SEARCH MODAL -->
                    <div class="modal fade" id="accountModal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-xl modal-dialog-scrollable">
                            <div class="modal-content">
                                <div class="modal-header bg-primary text-white">
                                    <h5 class="modal-title">
                                        <i class="bi bi-journal-bookmark me-2"></i> Select Ledger
                                    </h5>
                                    <button type="button" class="btn-close btn-close-white"
                                        data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row mb-3 align-items-center">
                                        <div class="col-md-8">
                                            <input type="search" id="accountSearch" class="form-control"
                                                placeholder="Search by Ledger Name / Code..." autocomplete="off">
                                        </div>
                                        <div class="col-md-4 text-end">
                                            <span id="accountCount" class="badge bg-secondary">0 Records</span>
                                        </div>
                                    </div>
                                    <div class="table-responsive"
                                        style="max-height: 55vh; border: 1px solid var(--border-color); border-radius: var(--radius-md);">
                                        <table class="table table-hover align-middle">
                                            <thead>
                                                <tr>
                                                    <th width="120">Code</th>
                                                    <th>Ledger Name</th>
                                                    <th width="180">Group</th>
                                                </tr>
                                            </thead>
                                            <tbody id="accountListBody"></tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-outline-secondary btn-sm"
                                        data-bs-dismiss="modal">Close</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- PARTY SEARCH MODAL -->
                    <div class="modal fade" id="partyModal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-xl modal-dialog-scrollable">
                            <div class="modal-content">
                                <div class="modal-header bg-success text-white">
                                    <h5 class="modal-title">
                                        <i class="bi bi-people-fill me-2"></i> Select Party
                                    </h5>
                                    <button type="button" class="btn-close btn-close-white"
                                        data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row mb-3 align-items-center">
                                        <div class="col-md-8">
                                            <input type="search" id="partySearch" class="form-control"
                                                placeholder="Search by Party Name / GSTIN / Mobile..."
                                                autocomplete="off">
                                        </div>
