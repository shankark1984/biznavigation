<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BizNavigation | New Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #198754);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-card {
            max-width: 420px;
            width: 100%;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }

        .strength span {
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

    <div class="card reset-card p-4 bg-white">
        <div class="text-center mb-3">
            <h4 class="fw-bold mb-1">🔐 Create New Password</h4>
            <p class="text-muted small">
                For security reasons, you must change your default password.
            </p>
        </div>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="resetForm" novalidate>
            <div class="mb-3">
                <label class="form-label small">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="newPassword" class="form-control" placeholder="Enter new password"
                        required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter new password"
                        required>
                </div>
            </div>

            <div class="strength mb-3">
                <span id="strengthText" class="text-muted">
                    Password must be at least 8 characters
                </span>
            </div>

            <button class="btn btn-primary w-100 fw-semibold" type="submit">
                Update Password
            </button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">
                © 2026 BizNavigation | AllEdge Soft & Logic
            </small>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/build/sha256.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>

    <!-- Page Script -->
    <script src="../../assets/js/utils/server.js"></script>
    <script src="../../assets/js/auth/new-password.js"></script>

</body>

</html>
