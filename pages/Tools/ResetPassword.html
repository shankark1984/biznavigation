<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizNavigation - Reset Password</title>

    <!-- Preload Bootstrap -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    </noscript>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/build/sha256.min.js" defer></script>

    <!-- Internal Scripts -->
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets\js\UserAccessRules\ResetPassword.js" defer></script>
    <script src="https://sdk.twilio.com/js/client/releases/1.13.5/twilio.min.js" defer></script>

    <style>
        :root {
            --background-color: linear-gradient(135deg, #74ebd5, #ACB6E5);
            --card-background: #ffffff;
            --text-color: #333333;
            --subtext-color: #666666;
            --input-background: #f9f9f9;
            --input-border: #ddd;
            --button-color: #6c63ff;
            --button-hover: #574b90;
            --link-color: #6c63ff;
            --error-color: #dc3545;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--background-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .reset-container {
            background: var(--card-background);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.8s ease;
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reset-title {
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--text-color);
        }

        .form-control {
            border-radius: 8px;
            padding: 0.75rem;
            border: 1px solid var(--input-border);
            background-color: var(--input-background);
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(108, 99, 255, 0.3);
            border-color: var(--button-color);
            background-color: #fff;
        }

        .btn-primary {
            background-color: var(--button-color);
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--button-hover);
        }

        .form-links {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .form-links a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
        }

        .form-links a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--error-color);
            text-align: center;
            margin-top: 1rem;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <main class="reset-container" role="main">
        <h2 class="reset-title">Reset Password</h2>

        <form id="userActivationForm" aria-label="Reset Password Form" novalidate>
            <div class="mb-3">
                <input type="text" id="loginID" class="form-control" placeholder="Username" autocomplete="off"
                    required />
            </div>

            <div class="mb-3">
                <input type="tel" id="userPhoneNo" class="form-control" placeholder="Phone No." autocomplete="off"
                    required />
            </div>

            <div class="mb-3">
                <input type="text" id="userPhoneOTP" class="form-control" placeholder="Enter phone OTP"
                    inputmode="numeric" required />
            </div>

            <div class="mb-3">
                <input type="password" id="newPassword" class="form-control" placeholder="New Password"
                    autocomplete="new-password" required />
            </div>

            <div class="mb-3">
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password"
                    autocomplete="new-password" required />
            </div>

            <button type="submit" class="btn btn-primary d-flex justify-content-center align-items-center">
                <span id="loginButtonText">Get OTP</span>
                <div id="resetPasswordSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"
                    aria-hidden="true"></div>
            </button>

            <div class="form-links mt-3">
                <a href="/pages/Tools/UserActivation.html">User Activation?</a>
            </div>
        </form>

        <p id="errorMessage" class="error-message d-none" role="alert">
            Something went wrong. Please try again.
        </p>
    </main>

</body>

</html>
