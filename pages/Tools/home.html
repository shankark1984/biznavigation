<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizNavigation - Home</title>

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg" />
    <link rel="manifest" href="../../manifest.json" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>

    <!-- Supabase JS Client -->
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Custom Styles (Uncomment when needed) -->

</head>
<style>
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    #root {
        flex: 1;
    }
</style>

<body>
    <div id="root">
        <main>
            <!-- Page content goes here -->
        </main>
    </div>

    <!-- Utility Scripts -->
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets/js/utils/navbar.js" defer></script>
    <script src="../../assets/js/utils/footer.js" defer></script>
    <script src="../../assets/js/utils/home.js" defer></script>

    <script src="../../assets/js/utils/logout.js" defer></script>

    <script>
        // Add enter animation on page load
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('page-enter');
        });

        // Apply exit animation on internal link clicks
        document.querySelectorAll('a').forEach(link => {
            if (link.href && link.href.startsWith(window.location.origin)) {
                link.addEventListener('click', event => {
                    event.preventDefault(); // Stop immediate navigation
                    const targetUrl = link.href;

                    // Remove enter class and add exit animation
                    document.body.classList.remove('page-enter');
                    document.body.classList.add('page-exit');

                    // Wait for animation to finish before navigating
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 500); // Match this to your CSS transition time
                });
            }
        });
    </script>

</body>

</html>
