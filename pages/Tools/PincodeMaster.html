<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BizNavigation - Pincode Master</title>
    <!-- Combined CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"
        crossorigin="anonymous" />
</head>

<body class="bg-light">

    <div class="container mt-4 pt-5" id="root">
        <header class="my-4">
            <h1 class="text-center">Pincode Master</h1>
        </header>

        <main>
            <form id="pincodeForm" class="row g-2" novalidate>
                <div class="col-md-2 col-sm-6">
                    <label for="pincode" class="form-label">Pincode</label>
                    <input type="text" id="pincode" class="form-control" maxlength="6" pattern="\d{6}" required
                        aria-describedby="pincodeHelp" inputmode="numeric" />
                    <div id="pincodeHelp" class="form-text">Enter a valid 6-digit pincode.</div>
                </div>

                <div class="col-md-2 col-sm-6">
                    <label for="areaName" class="form-label">Area Name</label>
                    <input type="text" id="areaName" class="form-control" required aria-describedby="areaNameHelp" />
                    <div id="areaNameHelp" class="form-text">Enter the area name.</div>
                </div>

                <div class="col-md-2 col-sm-6">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" class="form-control" required aria-describedby="cityHelp" />
                    <div id="cityHelp" class="form-text">Enter the city name.</div>
                </div>

                <div class="col-md-2 col-sm-6">
                    <label for="state" class="form-label">State</label>
                    <input type="text" id="state" class="form-control" required aria-describedby="stateHelp" />
                    <div id="stateHelp" class="form-text">Enter the state name.</div>
                </div>

                <div class="col-md-2 col-sm-6">
                    <label for="country" class="form-label">Country</label>
                    <input type="text" id="country" class="form-control" required aria-describedby="countryHelp" />
                    <div id="countryHelp" class="form-text">Enter the country name.</div>
                </div>

                <div class="col-md-2 col-sm-6">
                    <label for="serviceType" class="form-label">Service Type</label>
                    <select id="serviceType" class="form-select" required aria-describedby="serviceTypeHelp">
                        <option value="" disabled selected>Select Service Type</option>
                        <option value="Standard">Standard</option>
                        <option value="Express">Express</option>
                        <option value="Overnight">Overnight</option>
                    </select>
                    <div id="serviceTypeHelp" class="form-text">Select the service type.</div>
                </div>

                <div class="col-md-2 col-sm-6 d-flex align-items-end">
                    <button type="submit" id="submitButton" class="btn btn-primary w-100">Submit</button>
                </div>
            </form>

            <!-- Table to display input data -->
            <div class="table-responsive mt-4">
                <table class="table table-striped table-bordered" id="pincodeTable" aria-label="Pincode details table">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Pincode</th>
                            <th scope="col">Area Name</th>
                            <th scope="col">City</th>
                            <th scope="col">State</th>
                            <th scope="col">Country</th>
                            <th scope="col">Service Type</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="pincodeTableBody">
                        <!-- Rows will be dynamically added here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"
        defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js" crossorigin="anonymous"
        defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>

    <!-- Custom scripts -->
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets/js/utils/navbar.js" defer></script>
    <script src="../../assets/js/utils/footer.js" defer></script>

    <script src="../../assets/js/utils/PincodeMaster.js" defer></script>

</body>

</html>
