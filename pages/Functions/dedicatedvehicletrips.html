<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Domestic Booking System for cargo shipments" />
    <title>Domestic Booking</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="../../assets/css/navbar.css" />

    <!-- Upgraded Modern Form Styles (Unified) -->
    <link rel="stylesheet" href="../../assets/css/booking-theme.css" />

    <!-- Core Scripts (Deferred) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js" defer></script>
</head>

<body>
    <div class="app-wrapper">

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="text-center text-muted p-3">Loading Sidebar...</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="page-content">

                <div class="container-fluid mt-3 mb-4">
                    <div class="card">
                        <div class="card-body">

                            <form id="domesticBookingForm" class="container-fluid px-0" novalidate autocomplete="off">

                                <!-- Action Bar -->
                                <div
                                    class="action-bar d-flex flex-wrap gap-2 align-items-center justify-content-between">
                                    <h5 class="m-0 fw-bold text-dark d-none d-md-block">Trip Management</h5>
                                    <div class="d-flex flex-wrap gap-2" role="group"
                                        aria-label="Booking action buttons">
                                        <button type="button" class="btn btn-outline-primary btn-sm bg-white"
                                            id="newButton" title="Create new booking">
                                            <i class="bi bi-file-earmark-plus"></i> New
                                        </button>
                                        <button type="button" class="btn btn-outline-warning btn-sm bg-white"
                                            id="modifyButton" disabled title="Modify booking">
                                            <i class="bi bi-pencil"></i> Modify
                                        </button>
                                        <button type="button" class="btn btn-outline-danger btn-sm bg-white"
                                            id="deleteButton" disabled title="Delete booking">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                        <button type="button" class="btn btn-outline-info btn-sm bg-white"
                                            id="reportButton" disabled title="Print booking">
                                            <i class="bi bi-printer"></i> Print
                                        </button>
                                        <button type="button" class="btn btn-primary btn-sm px-4 shadow-sm"
                                            id="saveButton" data-mode="insert" title="Save booking">
                                            <i class="bi bi-check2-circle"></i> Save
                                        </button>
                                    </div>

                                    <!-- Hidden Inputs -->
                                    <input type="hidden" id="tempFormID" />
                                    <input type="hidden" id="partyCode" />
                                    <input type="hidden" id="consignorCode" />
                                    <input type="hidden" id="serviceProviderCode" />
                                    <input type="hidden" id="currentStatus" value="New" />
                                </div>

                                <!-- Form Grid -->
                                <div class="row g-3">
                                    <!-- Row 1: Trip & Vehicle -->
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="tripID" class="form-label">Trip ID</label>
                                        <input type="text" id="tripID" name="tripID"
                                            class="form-control bg-light fw-bold" readonly />
                                    </div>
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="vehicleAssigned" class="form-label">Vehicle Assigned</label>
                                        <input list="vehicleSuggestions" id="vehicleAssigned" name="vehicleAssigned"
                                            class="form-control" placeholder="Select Vehicle..." autocomplete="off" />
                                        <datalist id="vehicleSuggestions"></datalist>
                                    </div>
                                    <div class="col-lg-3 col-md-6 col-sm-12">
                                        <label for="customerName" class="form-label">Customer Name</label>
                                        <input list="customerNameSuggestions" id="customerName" name="customerName"
                                            data-force-list="true" data-list-id="customerNameSuggestions"
                                            class="form-control" placeholder="Choose Customer..." autocomplete="off"
                                            required />
                                        <datalist id="customerNameSuggestions"></datalist>
                                    </div>

                                    <!-- Origin Pincode & Location -->
                                    <div class="col-lg-2 col-md-3 col-sm-4">
                                        <label for="originPincode" class="form-label">Origin Pincode</label>
                                        <input type="text" class="form-control" id="originPincode" name="originPincode"
                                            maxlength="6" pattern="\d{6}" placeholder="e.g. 560001" required>
                                    </div>
                                    <div class="col-lg-3 col-md-9 col-sm-8">
                                        <label for="originLocation" class="form-label">Origin Location</label>
                                        <input type="text" class="form-control bg-light" id="originLocation"
                                            name="originLocation" placeholder="Auto-fills from pincode..."
                                            tabindex="-1">
                                    </div>

                                    <!-- Row 2: Consignee & Address -->
                                    <div class="col-lg-4 col-md-6 col-sm-6">
                                        <label for="consigneeName" class="form-label">Consignee</label>
                                        <input list="consigneeNameSuggestions" class="form-control" id="consigneeName"
                                            required placeholder="Choose Consignee..."
                                            oninput="consigneeDetails(this.value, 'ConsigneeName', 'consigneeNameSuggestions')"
                                            onchange="updateDeliveryAddress()">
                                        <datalist id="consigneeNameSuggestions"></datalist>
                                    </div>
                                    <div class="col-lg-5 col-md-6 col-sm-12">
                                        <label for="newConsigneeAddress" class="form-label">Consignor Address</label>
                                        <textarea class="form-control text-cap" id="newConsigneeAddress" rows="1"
                                            placeholder="Full Consignor Address" required></textarea>
                                    </div>

                                    <!-- Destination Pincode & Location -->
                                    <div class="col-lg-2 col-md-3 col-sm-4">
                                        <label for="destPincode" class="form-label">Dest. Pincode</label>
                                        <input type="text" class="form-control" id="destPincode" name="destPincode"
                                            maxlength="6" pattern="\d{6}" placeholder="e.g. 400001" required>
                                    </div>
                                    <div class="col-lg-3 col-md-9 col-sm-8">
                                        <label for="destLocation" class="form-label">Destination Location</label>
                                        <input type="text" class="form-control bg-light" id="destLocation"
                                            name="destLocation" placeholder="Auto-fills from pincode..." tabindex="-1">
                                    </div>

                                    <!-- Row 3: Schedule & Odometer -->
                                    <div class="col-lg-3 col-md-4 col-sm-6">
                                        <label for="scheduledDeparture" class="form-label">Scheduled Departure</label>
                                        <input type="datetime-local" class="form-control" id="scheduledDeparture"
                                            name="scheduledDeparture" required>
                                    </div>
                                    <div class="col-lg-2 col-md-2 col-sm-3">
                                        <label for="startOdometer" class="form-label">Start ODO (km)</label>
                                        <input type="number" class="form-control text-end" id="startOdometer"
                                            name="startOdometer" min="0" placeholder="0">
                                    </div>
                                    <div class="col-lg-2 col-md-2 col-sm-3">
                                        <label for="endOdometer" class="form-label">End ODO (km)</label>
                                        <input type="number" class="form-control text-end" id="endOdometer"
                                            name="endOdometer" min="0" placeholder="0">
                                    </div>

                                    <!-- Row 4: Special Instructions & Add -->
                                    <div class="col-lg-4 col-md-4 col-sm-10">
                                        <label for="specialInstructions" class="form-label">Special Instructions / Seal
                                            Numbers</label>
                                        <input type="text" class="form-control" id="specialInstructions"
                                            name="specialInstructions"
                                            placeholder="e.g., Handle with care, Seal #12345">
                                    </div>
                                    <div class="col-lg-1 col-md-2 col-sm-2 d-flex align-items-end">
                                        <button type="button" id="addFreightRow"
                                            class="btn btn-outline-primary btn-sm w-100">
                                            <i class="bi bi-plus-circle"></i> Add
                                        </button>
                                    </div>
                                </div>

                                <!-- Freight Charges Table Container -->
                                <div id="freight" class="mt-4">
                                    <div class="table-container">
                                        <table class="table table-hover" id="freightTable">
                                            <thead>
                                                <tr>
                                                    <th scope="col">Sl No</th>
                                                    <th scope="col">Trip Details</th>
                                                    <th scope="col">Contract / Client</th>
                                                    <th scope="col">Vehicle & Driver</th>
                                                    <th scope="col">Route & Milestones</th>
                                                    <th scope="col">ETA & Status</th>
                                                    <th scope="col" class="text-center">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody id="chargesBody"></tbody>
                                        </table>
                                    </div>
                                </div>
                            </form>

                            <!-- Pagination -->
                            <div
                                class="d-flex flex-wrap justify-content-between align-items-center mt-4 pt-3 border-top small text-secondary gap-2">
                                <p class="mb-0">Showing <span class="fw-bold text-dark">1</span> to <span
                                        class="fw-bold text-dark">3</span> of <span class="fw-bold text-dark">42</span>
                                    trips</p>
                                <ul class="pagination pagination-sm mb-0">
                                    <li class="page-item disabled"><button class="page-link"><i
                                                class="bi bi-chevron-left"></i></button></li>
                                    <li class="page-item active"><button class="page-link">1</button></li>
                                    <li class="page-item"><button class="page-link">2</button></li>
                                    <li class="page-item"><button class="page-link"><i
                                                class="bi bi-chevron-right"></i></button></li>
                                </ul>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Add Consignee Modal -->
                <div class="modal fade" id="addConsigneeModal" tabindex="-1" aria-labelledby="addConsigneeModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="addConsigneeModalLabel">Add New Consignee</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <form id="consigneeForm" novalidate>
                                    <div class="mb-3">
                                        <label for="newConsigneeNameInput" class="form-label">Consignee Name</label>
                                        <input type="text" class="form-control" id="newConsigneeNameInput"
                                            name="newConsigneeName" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="newConsigneeAddressInput" class="form-label">Consignee
                                            Address</label>
                                        <textarea class="form-control" id="newConsigneeAddressInput"
                                            name="newConsigneeAddress" rows="2" required></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newContactPerson" class="form-label">Contact Person</label>
                                        <input type="text" class="form-control" id="newContactPerson"
                                            name="newContactPerson" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="newContactNumber" class="form-label">Contact Number</label>
                                        <input type="tel" class="form-control" id="newContactNumber"
                                            name="newContactNumber" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="newEmailID" class="form-label">Email ID</label>
                                        <input type="email" class="form-control" id="newEmailID" name="newEmailID"
                                            required />
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary btn-sm"
                                    data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary btn-sm" onclick="addNewConsignee(event)">
                                    Add Consignee
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div id="errorToast" class="toast align-items-center text-white bg-danger border-0 shadow" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="errorToastMessage">Error message here...</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- External Library Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js" defer
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>

    <!-- Custom Scripts -->
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets/js/utils/navbar.js" defer></script>
    <script src="../../assets/js/utils/pincode-helper.js" defer></script>
    <script src="../../assets/js/utils/taxDescription.js" defer></script>
    <script src="../../assets/js/utils/logout.js" defer></script>
    <script src="../../assets/js/utils/GlobalShortcut.js" defer></script>
    <script src="../../assets/js/utils/dropdownLoader.js" defer></script>
    <script src="../../assets/js/utils/utils.js" defer></script>

    <!-- Booking Scripts -->
    <script src="../../assets/js/DomesticBooking/Domestic.js" defer></script>
    <script src="../../assets/js/DomesticBooking/DomesticCharges.js" defer></script>
    <script src="../../assets/js/DomesticBooking/DomesticVolumetric.js" defer></script>
    <script src="../../assets/js/DomesticBooking/DomesticContainer.js" defer></script>
    <script src="../../assets/js/InternationalBooking/TariffCalculation.js" defer></script>
    <script src="../../assets/js/InternationalBooking/BookingStatus.js" defer></script>

</body>

</html>
