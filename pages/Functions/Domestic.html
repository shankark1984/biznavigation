<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Domestic Booking System for cargo shipments" />
    <title>BizNavigation - Domestic Booking</title>

    <!-- Combined CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"
        crossorigin="anonymous" />

    <!-- Preload JS (only necessary if you want to preload large scripts; usually defer works well) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js" defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>


    <style>
        /* Hide the 13th column via class instead of nth-child for clarity */
        .hide-col-13 {
            display: none;
        }

        .form-control-sm {
            min-height: calc(1.5em + 0.5rem + 2px);
        }

        .card-header {
            padding: 0.75rem 1.25rem;
        }

        .nav-tabs .nav-link {
            padding: 0.5rem 1rem;
        }

        .bg-light-input {
            background-color: #e6f7ff;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container mt-4 pt-5" id="root">
        <div class="card shadow-lg rounded">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Domestic Booking</h3>
                <input type="hidden" id="tempFormID" />
                <input type="hidden" id="partyCode" />
                <input type="hidden" id="serviceProviderCode" />
            </div>

            <div class="card-body">
                <form class="container" novalidate>
                    <div class="d-flex flex-wrap gap-1 mb-2" role="group" aria-label="Booking action buttons">
                        <button type="button" class="btn btn-primary btn-sm" id="newButton" title="Create new booking">
                            <i class="bi bi-file-earmark-plus"></i> New
                        </button>
                        <button type="button" class="btn btn-warning btn-sm" id="modifyButton" disabled
                            title="Modify booking">
                            <i class="bi bi-pencil"></i> Modify
                        </button>
                        <button type="button" class="btn btn-danger btn-sm" id="deleteButton" disabled
                            title="Delete booking">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                        <button type="button" class="btn btn-info btn-sm" id="reportButton" disabled
                            title="Generate report">
                            <i class="bi bi-file-earmark-text"></i> Report
                        </button>
                        <button type="button" class="btn btn-success btn-sm" id="saveButton" data-mode="insert"
                            title="Save booking">
                            <i class="bi bi-save"></i> Save
                        </button>

                    </div>

                    <div class="row g-2">
                        <div class="col-md-4 col-sm-6">
                            <label for="partyName" class="form-label">Customer Name</label>
                            <input list="partySuggestions" id="partyName" class="form-control" placeholder="Choose..."
                                autocomplete="off" required />
                            <datalist id="partySuggestions"></datalist>
                        </div>

                        <!-- Job Details -->
                        <div class="col-md-2 col-sm-6">
                            <label for="docketNo" class="form-label">Docket No</label>
                            <input list="docketNoSuggestions" id="docketNo" class="form-control bg-light-input" />
                            <datalist id="docketNoSuggestions"></datalist>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label for="bookingDate" class="form-label">Booking Date</label>
                            <input type="date" id="bookingDate" class="form-control bg-light-input" required />
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label for="shippingTypeD" class="form-label">Shipping Type</label>
                            <select id="shippingTypeD" class="form-select" required>
                                <option value="">Choose...</option>
                                <option value="Economy">Economy</option>
                                <option value="Express">Express</option>
                                <option value="Same Day Delivery">Same Day Delivery</option>
                                <option value="Next Day Delivery">Next Day Delivery</option>
                            </select>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label for="currentStatus" class="form-label">Status</label>
                            <input type="text" id="currentStatus" value="New" readonly class="form-control" />
                        </div>

                        <div class="col-md-3 col-sm-6">
                            <label class="form-label">Consignor Name</label>
                            <input list="consignorNameSuggestions" class="form-control" id="consignorName" required
                                placeholder="Choose..." autocomplete="off">
                            <datalist id="consignorNameSuggestions"></datalist>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label for="originPincode" class="form-label">Origin Pincode</label>
                            <input type="text" id="originPincode" class="form-control" maxlength="6" required
                                aria-describedby="originPincodeHelp" />
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label for="originCity" class="form-label">Origin City</label>
                            <input type="text" id="originCity" class="form-control" placeholder="Enter City" required />
                        </div>

                        <div class="col-md-5 col-sm-6">
                            <label for="originAddress" class="form-label">Origin Address</label>
                            <textarea class="form-control" id="originAddress" rows="1"></textarea>
                        </div>
                        <!-- Consignee -->
                        <div class="col-md-3 col-sm-6">
                            <label for="consigneeName" class="form-label">Consignee Name</label>
                            <input list="consigneeNameSuggestions" class="form-control" id="consigneeName" required />
                            <datalist id="consigneeNameSuggestions"></datalist>
                        </div>

                        <!-- Destination Address -->
                        <div class="col-md-2 col-sm-6">
                            <label for="destinationPincode" class="form-label">Destination Pincode</label>
                            <input type="text" id="destinationPincode" class="form-control" placeholder="Enter Pincode"
                                maxlength="6" required aria-describedby="destinationPincodeHelp" />
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label for="destinationCity" class="form-label">Destination City</label>
                            <input type="text" id="destinationCity" class="form-control" placeholder="Enter City"
                                required />
                        </div>
                        <div class="col-md-5 col-sm-6">
                            <label for="destinationAddress" class="form-label">Destination Address</label>
                            <textarea class="form-control" id="destinationAddress" rows="1"></textarea>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label for="transitTypeD" class="form-label">Transit Type</label>
                            <select id="transitTypeD" class="form-select" required>
                                <option value="">Choose...</option>
                                <option value="By Air">By Air</option>
                                <option value="By Courier">By Courier</option>
                                <option value="By Road">By Road</option>
                                <option value="By Rail">By Rail</option>
                                <option value="By Sea">By Sea</option>
                            </select>
                        </div>

                        <div class="col-md-2 col-sm-6">
                            <label for="modeTypeD" class="form-label">Mode Type</label>
                            <select id="modeTypeD" class="form-select" required>
                                <option value="">Choose...</option>
                                <option value="Dox">Dox</option>
                                <option value="Non-Dox">Non-Dox</option>
                                <option value="FCL">FCL</option>
                                <option value="LCL">LCL</option>
                                <option value="LTL">LTL</option>
                                <option value="FTL">FTL</option>
                            </select>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <label for="customerReferenceNo" class="form-label">Customer Reference No & Date</label>
                            <input type="text" id="customerReferenceNo" class="form-control" autocomplete="off" />
                        </div>

                        <div class="col-md-2 col-sm-6">
                            <label for="invoiceValue" class="form-label">Invoice Value</label>
                            <input type="number" id="invoiceValue" class="form-control text-end" value="0.00"
                                step="0.01" min="0" />
                        </div>

                        <div class="col-md-4 col-sm-6">
                            <label class="form-label">Service Provider</label>
                            <input list="serviceProviderSuggestions" class="form-control" id="serviceProvider" required
                                placeholder="Choose..." autocomplete="off">
                            <datalist id="serviceProviderSuggestions"></datalist>
                        </div>


                        <!-- Quantity and Cargo Weight -->
                        <div class="col-md-2 col-sm-6">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" id="quantity" class="form-control text-end" value="0.00" step="1"
                                min="0" />
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label for="actualWeight" class="form-label">Actual Weight</label>
                            <input type="number" id="actualWeight" class="form-control text-end" value="0.00"
                                step="0.01" min="0" />
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label for="volumetricWeight" class="form-label">Volumetric Weight</label>
                            <input type="number" id="volumetricWeight" class="form-control text-end" value="0.00"
                                step="0.01" min="0" />
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label for="chargeableWeight" class="form-label">Chargeable Weight</label>
                            <input type="number" id="chargeableWeight" class="form-control text-end" value="0.00"
                                step="0.01" min="0" />
                        </div>

                        <div class="col-md-4 col-sm-12">
                            <label for="cargoDescription" class="form-label">Cargo Description</label>
                            <input type="text" id="cargoDescription" class="form-control"
                                placeholder="Enter Cargo Description" />
                        </div>
                    </div>

                    <!-- Tabs with ARIA roles -->
                    <div class="mt-3">
                        <ul class="nav nav-tabs" id="bookingTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="freight-tab" data-bs-toggle="tab" data-bs-target="#freight"
                                    type="button" role="tab" aria-controls="freight"
                                    aria-selected="false">Freight</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="container-details-tab" data-bs-toggle="tab"
                                    data-bs-target="#container-details" type="button" role="tab"
                                    aria-controls="container-details" aria-selected="false">Container Details</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="status-tab" data-bs-toggle="tab"
                                    data-bs-target="#booking-status" type="button" role="tab"
                                    aria-controls="booking-status" aria-selected="false">Status</button>
                            </li>
                        </ul>

                        <div class="tab-content p-3 border border-top-0">
                            <!-- Freight Tab -->
                            <div class="tab-pane fade show active" id="freight" role="tabpanel"
                                aria-labelledby="freight-tab">
                                <div class="row g-2 text-center">
                                    <div class="col-md-3 col-sm-4 text-start">
                                        <label for="chargesTypeInput" class="form-label small">Charges</label>
                                        <input list="chargesTypeList" id="chargesTypeInput"
                                            class="form-control form-control-sm" placeholder="Charges Type" />
                                        <datalist id="chargesTypeList"></datalist>
                                    </div>
                                    <div class="col-md-1 col-sm-2 text-start">
                                        <label for="hsnNumber" class="form-label small">HSN</label>
                                        <input type="text" id="hsnNumber" class="form-control form-control-sm" />
                                    </div>
                                    <div class="col-md-2 col-sm-3 text-start">
                                        <label for="freightAmount" class="form-label small">Amount</label>
                                        <input type="number" id="freightAmount" class="form-control form-control-sm"
                                            min="0" step="0.01" />
                                    </div>
                                    <div class="col-md-2 col-sm-4 text-start">
                                        <label for="remarksDetails" class="form-label small">Remarks</label>
                                        <input type="text" id="remarksDetails" class="form-control form-control-sm" />
                                    </div>
                                    <div class="col-md-2 col-sm-4 text-start">
                                        <label for="partyDefaultTax" class="form-label small">Tax Rate</label>
                                        <select id="partyDefaultTax" class="form-select form-select-sm">
                                            <option value="" disabled selected>Select Tax</option>
                                        </select>
                                    </div>
                                    <div class="col-md-1 col-sm-4 text-start">
                                        <label for="currencyCode" class="form-label small">Currency</label>
                                        <input type="text" id="currencyCode" list="currencyListDatalist" value="INR"
                                            required />
                                        <datalist id="currencyListDatalist"></datalist>
                                    </div>
                                    <div class="col-md-1 col-sm-2 d-flex align-items-end">
                                        <button type="button" id="addChargesRow"
                                            class="btn btn-sm btn-primary w-100">Add</button>
                                    </div>
                                </div>

                                <div class="table-responsive mt-3 small">
                                    <table class="table table-sm table-bordered text-center align-middle"
                                        id="chargesTable">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Charges Type</th>
                                                <th>HSN No</th>
                                                <th>Remarks</th>
                                                <th>Tax Rate</th>
                                                <th>Quantity</th>
                                                <th>Basic Amount</th>
                                                <th>SGST Amt</th>
                                                <th>CGST Amt</th>
                                                <th>IGST Amt</th>
                                                <th>Total GST Amt</th>
                                                <th>Grand Total</th>
                                                <th>Action</th>
                                                <th class="hide-col-13">Tax Type</th>
                                            </tr>
                                        </thead>
                                        <tbody></tbody>
                                        <tfoot>
                                            <tr id="totalsRow">
                                                <th colspan="5" class="text-end">Totals:</th>
                                                <th class="text-end" id="totalFreight">0.00</th>
                                                <th class="text-end" id="totalSGST">0.00</th>
                                                <th class="text-end" id="totalCGST">0.00</th>
                                                <th class="text-end" id="totalIGST">0.00</th>
                                                <th class="text-end" id="totalGST">0.00</th>
                                                <th class="text-end" id="totalGrand">0.00</th>
                                                <th></th>
                                                <th class="hide-col-13"></th>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>

                            <!-- Container Details Tab -->
                            <div class="tab-pane fade" id="container-details" role="tabpanel"
                                aria-labelledby="container-details-tab">
                                <div class="row g-2 align-items-end text-center">
                                    <div class="col-md-4 col-sm-6">
                                        <label for="containerType" class="form-label small text-start">Container
                                            Type</label>
                                        <select id="containerType" class="form-select form-select-sm"></select>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <label for="containerNumber" class="form-label small text-start">Container
                                            Number</label>
                                        <input type="text" class="form-control form-control-sm" id="containerNumber"
                                            placeholder="Enter Container Number" maxlength="11" />
                                    </div>
                                    <div class="col-md-1 col-sm-2 pt-sm-1">
                                        <label class="invisible">Add</label>
                                        <button type="button" class="btn btn-sm btn-primary w-100 mt-1"
                                            id="addContainer">Add</button>
                                    </div>
                                    <div class="col-12 text-start">
                                        <small id="containerFeedback" class="text-danger d-none"></small>
                                    </div>
                                </div>

                                <div class="table-responsive mt-3">
                                    <table class="table table-sm table-bordered text-center align-middle"
                                        id="containerDetailsTable">
                                        <thead class="table-light">
                                            <tr>
                                                <th>S No.</th>
                                                <th>Container Type</th>
                                                <th>Container Number</th>
                                                <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>

                            <!-- Booking Status Tab -->
                            <div class="tab-pane fade" id="booking-status" role="tabpanel" aria-labelledby="status-tab">
                                <div class="table-responsive mt-3">
                                    <table class="table table-bordered table-striped table-hover align-middle"
                                        id="bookingStatusTable">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Status Date</th>
                                                <th>Arrived At</th>
                                                <th>Information</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Rows dynamically inserted -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>

                <!-- Add Consignee Modal -->
                <div class="modal fade" id="addConsigneeModal" tabindex="-1" aria-labelledby="addConsigneeModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="addConsigneeModalLabel">Add New Consignee</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <form id="consigneeForm" novalidate>
                                    <div class="mb-3">
                                        <label for="newConsigneeName" class="form-label">Consignee Name</label>
                                        <input type="text" class="form-control" id="newConsigneeName" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="newConsigneeAddress" class="form-label">Consignee Address</label>
                                        <textarea class="form-control" id="newConsigneeAddress" required></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newContactPerson" class="form-label">Contact Person</label>
                                        <input type="text" class="form-control" id="newContactPerson" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="newContactNumber" class="form-label">Contact Number</label>
                                        <input type="tel" class="form-control" id="newContactNumber" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="newEmailID" class="form-label">Email ID</label>
                                        <input type="email" class="form-control" id="newEmailID" required />
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary" onclick="addNewConsignee(event)">Add
                                    Consignee</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

ś    <!-- Custom scripts loaded with defer -->
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets/js/utils/navbar.js" defer></script>
    <script src="../../assets/js/utils/footer.js" defer></script>
    <script src="../../assets/js/utils/pincode-helper.js" defer></script>
    <script src="../../assets/js/utils/taxDescription.js" defer></script>
    <script src="../../assets/js/utils/logout.js" defer></script>
    <script src="../../assets/js/utils/dropdownLoader.js" defer></script>
    <script src="../../assets/js/utils/utils.js" defer></script>


    <script src="../../assets/js/InternationalBooking/ContainerDetails.js" defer></script>
    <script src="../../assets/js/InternationalBooking/TariffCalculation.js" defer></script>
    <script src="../../assets/js/InternationalBooking/BookingStatus.js" defer></script>

</body>

</html>
