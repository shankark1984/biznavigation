<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Provider</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="../../assets/css/navbar.css" />
</head>

<body class="bg-light">

    <div class="app-wrapper">

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="text-center text-white p-3">Loading...</div>
        </div>

        <!-- Main -->
        <div class="main-content">
            <div class="page-content">

                <main class="container-fluid mt-2">

                    <div class="card shadow rounded">
                        <div class="card-body">

                            <form class="needs-validation" novalidate>

                                <!-- 🔹 HIDDEN FIELDS -->
                                <input type="hidden" id="tempFormID">
                                <input type="hidden" id="serviceProviderCode">
                                <input type="hidden" id="vendorCode">
                                <input type="hidden" id="billingAddressID">

                                <!-- 🔹 ACTION BUTTONS -->
                                <div class="d-flex flex-wrap gap-2 mb-3">
                                    <button type="button" class="btn btn-primary btn-sm" id="newButton">
                                        <i class="bi bi-file-earmark-plus"></i> New
                                    </button>

                                    <button type="button" class="btn btn-warning btn-sm" id="modifyButton">
                                        <i class="bi bi-pencil"></i> Modify
                                    </button>

                                    <button type="button" class="btn btn-danger btn-sm" id="deleteButton" disabled>
                                        <i class="bi bi-trash"></i> Delete
                                    </button>

                                    <button type="button" class="btn btn-info btn-sm" id="reportButton" disabled>
                                        <i class="bi bi-file-earmark-text"></i> Report
                                    </button>

                                    <button type="button" class="btn btn-success btn-sm" id="saveButton">
                                        <span id="saveText">
                                            <i class="bi bi-save"></i> Save
                                        </span>
                                        <span id="saveSpinner" class="spinner-border spinner-border-sm d-none"></span>
                                    </button>
                                </div>

                                <!-- 🔹 FORM -->
                                <div class="row g-2">

                                    <div class="col-md-2">
                                        <label for="courierCode" class="form-label">Courier Code</label>
                                        <input type="text" class="form-control bg-light" id="courierCode"
                                            name="courierCode" readonly>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="courierName" class="form-label">Courier Name</label>
                                        <input list="courierSuggestions" class="form-control" id="courierName"
                                            name="courierName" required>
                                        <datalist id="courierSuggestions"></datalist>
                                        <div class="invalid-feedback">Required</div>
                                    </div>

                                    <div class="col-md-2">
                                        <label for="serviceProviderStatus" class="form-label">Status</label>
                                        <select class="form-select" id="serviceProviderStatus" name="status" required>
                                            <option value="">Select</option>
                                            <option>Active</option>
                                            <option>De-Active</option>
                                        </select>
                                    </div>

                                    <div class="col-md-2">
                                        <label for="deActiveDate" class="form-label">De-Active Date</label>
                                        <input type="date" class="form-control" id="deActiveDate" name="deActiveDate"
                                            disabled>
                                    </div>

                                    <div class="col-md-3">
                                        <label for="contactPerson" class="form-label">Contact Person</label>
                                        <input type="text" class="form-control" id="contactPerson" name="contactPerson"
                                            required>
                                    </div>

                                    <div class="col-md-3">
                                        <label for="phoneNumber" class="form-label">Phone</label>
                                        <input type="tel" class="form-control" id="phoneNumber" name="phone" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="emailID" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="emailID" name="email" required>
                                    </div>

                                </div>

                                <!-- 🔹 FSC SECTION -->
                                <div class="mt-4 p-3 border bg-white rounded">

                                    <div class="row g-2 align-items-end">

                                        <div class="col-md-2">
                                            <label for="effectiveDate" class="form-label">Effective Date</label>
                                            <input type="date" class="form-control" id="effectiveDate">
                                        </div>
                                        <div class="col-md-2">
                                            <label for="fuelSurcharge" class="form-label">Fuel %</label>
                                            <div class="input-group">
                                                <input type="number" class="form-control text-end" id="fuelSurcharge">
                                                <span class="input-group-text">%</span>
                                            </div>
                                        </div>

                                        <div class="col-md-2 d-grid">
                                            <button type="button" class="btn btn-primary" id="addFuelSurchargeButton">
                                                <i class="bi bi-plus-circle"></i> Add
                                            </button>
                                        </div>

                                    </div>

                                    <!-- TABLE -->
                                    <div class="table-responsive mt-3">
                                        <table class="table table-sm table-bordered text-center align-middle"
                                            id="fuelSurchargeTable">
                                            <thead class="table-dark">
                                                <tr>
                                                    <th>Date</th>
                                                    <th>Description</th>
                                                    <th>Fuel %</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody id="fuelSurchargeTableBody"></tbody>
                                        </table>
                                    </div>

                                </div>

                            </form>

                        </div>
                    </div>

                </main>

            </div>
        </div>
    </div>

    <!-- 🔹 LOADER -->
    <div id="loadingSpinner"
        class="d-none position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-50">
        <div class="spinner-border text-light"></div>
    </div>

    <!-- Toast Container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999">
        <div id="errorToast" class="toast align-items-center text-white bg-danger border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="errorToastMessage">
                    Error message here...
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- 🔹 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>

    <script src="../../assets/js/utils/navbar.js" defer></script>
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets/js/utils/utils.js" defer></script>
    <script src="../../assets/js/utils/logout.js" defer></script>
    <script src="../../assets/js/utils/GlobalShortcut.js" defer></script>
    <script src="../../assets/js/utils/dropdownLoader.js" defer></script>
    <script src="../../assets/js/ServiceProvider/ServiceProvider.js" defer></script>

    <!-- 🔹 INLINE JS -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            // ✅ Bootstrap Validation
            (() => {
                'use strict';
                const forms = document.querySelectorAll('.needs-validation');
                forms.forEach(form => {
                    form.addEventListener('submit', event => {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    });
                });
            })();

            // ✅ Enable/Disable DeActive Date
            document.getElementById('serviceProviderStatus')
                .addEventListener('change', function () {
                    const dateField = document.getElementById('deActiveDate');
                    dateField.disabled = this.value !== 'De-Active';
                });

        });
    </script>

</body>

</html>
