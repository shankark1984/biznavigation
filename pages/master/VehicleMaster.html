<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizNavigation - Customs Clearance</title>

    <!-- External Stylesheets (Consistent Bootstrap 5.3.2) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/navbar.css" />
</head>

<body class="bg-light">
    <!-- APP LAYOUT -->
    <div class="app-wrapper">

        <!-- Sidebar Mount -->
        <aside id="sidebar" aria-label="Sidebar Navigation">
            <div class="text-center text-white p-3">Loading...</div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="page-content">
                <div class="container-fluid py-2">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-3 p-md-4">

                            <form id="customsClearanceForm" novalidate>
                                <!-- Action Toolbar -->
                                <div class="d-flex flex-wrap gap-2 pb-3 mb-3 border-bottom" role="toolbar"
                                    aria-label="Booking action buttons">
                                    <button type="button" class="btn btn-primary btn-sm" id="newButton"
                                        title="Create new booking">
                                        <i class="bi bi-file-earmark-plus"></i> New
                                    </button>
                                    <button type="button" class="btn btn-warning btn-sm" id="modifyButton"
                                        title="Modify booking" disabled>
                                        <i class="bi bi-pencil"></i> Modify
                                    </button>
                                    <button type="button" class="btn btn-danger btn-sm" id="deleteButton"
                                        title="Delete booking" disabled>
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                    <button type="button" class="btn btn-info btn-sm text-white" id="reportButton"
                                        title="Print booking" disabled>
                                        <i class="bi bi-printer"></i> Print
                                    </button>
                                    <button type="button" class="btn btn-success btn-sm" id="saveButton"
                                        data-mode="insert" title="Save booking">
                                        <i class="bi bi-save"></i> Save
                                    </button>

                                    <!-- Form State & Meta Tracking -->
                                    <input type="hidden" id="status" name="status" value="New" />
                                    <input type="hidden" id="tempFormID" name="tempFormID" />
                                    <input type="hidden" id="partyCode" name="partyCode" />
                                    <input type="hidden" id="serviceProviderCode" name="serviceProviderCode" />
                                </div>

                                <!-- Main Details Grid -->
                                <div class="row g-3">
                                    <!-- Registration No. -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="regNumber" class="form-label small fw-semibold">Registration No.
                                            *</label>
                                        <div class="input-group input-group-sm">
                                            <input list="regNumberSuggestions" id="regNumber" name="regNumber"
                                                class="form-control form-control-sm border-primary bg-primary-subtle"
                                                placeholder="e.g. KA-01-AB-1234" autocomplete="off" required />
                                            <datalist id="regNumberSuggestions"></datalist>
                                            <button type="button" class="btn btn-secondary btn-sm"
                                                data-bs-toggle="modal" data-bs-target="#searchVehicleModal">
                                                <i class="bi bi-search"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Chassis Number -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="chassisNumber" class="form-label small fw-semibold">Chassis Number
                                            *</label>
                                        <input type="text" id="chassisNumber" name="chassisNumber"
                                            class="form-control form-control-sm" placeholder="17-character VIN"
                                            required />
                                    </div>

                                    <!-- Make / Manufacturer -->
                                    <div class="col-xl-4 col-md-6 col-sm-12">
                                        <label for="make" class="form-label small fw-semibold">Make /
                                            Manufacturer</label>
                                        <input list="makeSuggestions" id="make" name="make"
                                            class="form-control form-control-sm" placeholder="e.g. Tata, Volvo"
                                            autocomplete="off" required />
                                        <datalist id="makeSuggestions"></datalist>
                                    </div>

                                    <!-- Model -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="model" class="form-label small fw-semibold">Model</label>
                                        <input type="text" id="model" name="model" class="form-control form-control-sm"
                                            placeholder="e.g. 407, FH16" required />
                                    </div>

                                    <!-- Vehicle Type (Select) -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="vehicleType" class="form-label small fw-semibold">Vehicle
                                            Type</label>
                                        <select id="vehicleType" name="vehicleType" class="form-select form-select-sm"
                                            required>
                                            <option value="Truck">Truck</option>
                                            <option value="Van">Van</option>
                                            <option value="Trailer">Trailer</option>
                                            <option value="Bus">Bus</option>
                                            <option value="Sedan">Car / Sedan</option>
                                        </select>
                                    </div>

                                    <!-- Fuel Type -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="fuelType" class="form-label small fw-semibold">Fuel Type</label>
                                        <select id="fuelType" name="fuelType" class="form-select form-select-sm"
                                            required>
                                            <option value="Diesel">Diesel</option>
                                            <option value="Petrol">Petrol</option>
                                            <option value="EV">Electric</option>
                                            <option value="CNG">CNG</option>
                                        </select>
                                    </div>

                                    <!-- Load Capacity -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="loadCapacity" class="form-label small fw-semibold">Load Capacity
                                            (kg)</label>
                                        <input type="number" id="loadCapacity" name="loadCapacity" min="0" step="any"
                                            class="form-control form-control-sm" placeholder="e.g. 2500" required />
                                    </div>

                                    <!-- Operational Status -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="operationalStatus" class="form-label small fw-semibold">Operational
                                            Status</label>
                                        <select id="operationalStatus" name="operationalStatus"
                                            class="form-select form-select-sm" required>
                                            <option value="Active">Active</option>
                                            <option value="Maintenance">Under Maintenance</option>
                                            <option value="Inactive">Inactive</option>
                                        </select>
                                    </div>

                                    <!-- Owner / Consignor Name -->
                                    <div class="col-xl-4 col-md-6 col-sm-12">
                                        <label for="partyName" class="form-label small fw-semibold">Owner Name</label>
                                        <input list="partySuggestions" id="partyName" name="partyName"
                                            class="form-control form-control-sm"
                                            placeholder="Choose owner or consignor..." autocomplete="off" required />
                                        <datalist id="partySuggestions"></datalist>
                                    </div>

                                    <!-- Category / Body Type List -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="vehicleTypeList" class="form-label small fw-semibold">Vehicle
                                            Sub-Type</label>
                                        <input list="vehicleTypeSuggestions" id="vehicleTypeList" name="vehicleTypeList"
                                            class="form-control form-control-sm" placeholder="Choose..."
                                            autocomplete="off" required />
                                        <datalist id="vehicleTypeSuggestions"></datalist>
                                    </div>

                                    <!-- Additional Notes -->
                                    <div class="col-12">
                                        <label for="information" class="form-label small fw-semibold">Information /
                                            Remarks</label>
                                        <input type="text" id="information" name="information"
                                            class="form-control form-control-sm"
                                            placeholder="Enter operational notes or clearance remarks" />
                                    </div>
                                </div>

                                <!-- Tabbed Sections -->
                                <div class="mt-4">
                                    <ul class="nav nav-tabs" id="vehicleMasterTabs" role="tablist">
                                        <li class="nav-item" role="presentation">
                                            <button class="nav-link active" id="documents-tab" data-bs-toggle="tab"
                                                data-bs-target="#documents" type="button" role="tab"
                                                aria-controls="documents" aria-selected="true">
                                                <i class="bi bi-file-earmark-text me-1"></i> Documents
                                            </button>
                                        </li>
                                    </ul>

                                    <div class="tab-content border border-top-0 bg-white p-3 rounded-bottom shadow-sm">
                                        <!-- Documents Tab Pane -->
                                        <div class="tab-pane fade show active" id="documents" role="tabpanel"
                                            aria-labelledby="documents-tab">
                                            <div class="row g-2 align-items-end">
                                                <div class="col-md-4 col-sm-6">
                                                    <label for="documentTypeInput"
                                                        class="form-label small fw-semibold">Document Type</label>
                                                    <input list="documentTypeList" id="documentTypeInput"
                                                        class="form-control form-control-sm"
                                                        placeholder="Select or enter document type" />
                                                    <datalist id="documentTypeList"></datalist>
                                                </div>

                                                <div class="col-md-3 col-sm-6">
                                                    <label for="documentNumber"
                                                        class="form-label small fw-semibold">Document Number</label>
                                                    <input type="text" id="documentNumber"
                                                        class="form-control form-control-sm"
                                                        placeholder="e.g. RC-98765432" />
                                                </div>

                                                <div class="col-md-2 col-sm-6">
                                                    <label for="validUpTo" class="form-label small fw-semibold">Valid Up
                                                        To</label>
                                                    <input type="date" id="validUpTo"
                                                        class="form-control form-control-sm" />
                                                </div>
                                                <div class="col-md-2 col-sm-6">
                                                    <label for="documentFile"
                                                        class="form-label small fw-semibold">Select File (PDF, PNG,
                                                        JPG)</label>
                                                    <input type="file" id="documentFile"
                                                        class="form-control form-control-sm"
                                                        accept=".pdf,.png,.jpg,.jpeg" />
                                                </div>
                                                <div class="col-md-1 col-sm-6">
                                                    <button type="button" id="addDocumentButton"
                                                        class="btn btn-sm btn-primary w-100">
                                                        <i class="bi bi-plus-circle me-1"></i> Add
                                                    </button>
                                                </div>
                                            </div>

                                            <div class="table-responsive mt-3">
                                                <table
                                                    class="table table-sm table-bordered table-hover text-center align-middle mb-0"
                                                    id="chargesTable">
                                                    <thead class="table-light small">
                                                        <tr>
                                                            <th>Document Type</th>
                                                            <th>Document Number</th>
                                                            <th>Valid Up To</th>
                                                            <th>Attached Document</th>
                                                            <th style="width: 100px;">Action</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="documentTableBody"></tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <!-- SEARCH SAVED PAYMENTS MODAL -->
                            <div class="modal fade" id="searchVehicleModal" tabindex="-1"
                                aria-labelledby="searchVehicleModalLabel" aria-hidden="true">
                                <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                                    <div class="modal-content">

                                        <!-- Modal Header -->
                                        <div class="modal-header bg-primary text-white">
                                            <h5 class="modal-title" id="searchVehicleModalLabel">
                                                <i class="bi bi-search"></i> Search Saved Vehicles
                                            </h5>
                                            <button type="button" class="btn-close btn-close-white"
                                                data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>

                                        <!-- Modal Body -->
                                        <div class="modal-body">
                                            <!-- Search Input Box -->
                                            <div class="input-group mb-3">
                                                <input type="text" id="searchSavedVehicleInput" class="form-control"
                                                    placeholder="Search by Registration No, Owner Name, Make or Model..."
                                                    autocomplete="off">
                                                <button class="btn btn-outline-primary" type="button"
                                                    id="btnTriggerSearch">
                                                    <i class="bi bi-search"></i> Search
                                                </button>
                                            </div>

                                            <!-- Search Results Table -->
                                            <div class="table-responsive">
                                                <table
                                                    class="table table-sm table-hover table-bordered align-middle text-center">
                                                    <thead class="table-light">
                                                        <tr>
                                                            <th>Registration No</th>
                                                            <th>Owner Name</th>
                                                            <th>Vehicle Type</th>
                                                            <th>Model</th>
                                                            <th>Make</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="searchVehicleTableBody">
                                                        <!-- Example Placeholder Row (Replace with JS data) -->
                                                        <tr>
                                                            <td colspan="6"
                                                                class="text-center text-muted fst-italic py-3">
                                                                Enter search criteria to find vehicles...
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <!-- Modal Footer -->
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary btn-sm"
                                                data-bs-dismiss="modal">Close</button>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Third-party Bundles (Version synced to 5.3.2) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js" defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>

    <!-- Application Modules -->
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets/js/utils/navbar.js" defer></script>
    <script src="../../assets/js/utils/pincode-helper.js" defer></script>
    <script src="../../assets/js/utils/taxDescription.js" defer></script>
    <script src="../../assets/js/utils/logout.js" defer></script>
    <script src="../../assets/js/utils/GlobalShortcut.js" defer></script>
    <script src="../../assets/js/utils/dropdownLoader.js" defer></script>
    <script src="../../assets/js/utils/utils.js" defer></script>

</body>

</html>
