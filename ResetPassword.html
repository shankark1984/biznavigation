<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizNavigation - Reset Password</title>

    <!-- Preload critical CSS -->
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    </noscript>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/build/sha256.min.js" defer></script>

    <!-- Internal Scripts -->
    <script src="assets/js/utils/server.js" defer></script>
    <script src="assets/js/UserAccessRules/ResetPassword.js" defer></script>
    <script src="https://sdk.twilio.com/js/client/releases/1.13.5/twilio.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: #fff;
            border-radius: 10px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-primary {
            background-color: #6c63ff;
            border: none;
            border-radius: 10px;
        }

        .text-danger {
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="background-blur">
        <div class="blur-1"></div>
        <div class="blur-2"></div>
        <div class="blur-3"></div>
    </div>

    <main class="card login-card" role="main">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-secondary mt-2">Reset Password</h2>
        </div>

        <form id="userActivationForm" aria-label="Reset Password Form" novalidate>
            <div class="mb-3">
                <label for="loginID" class="form-label">Username</label>
                <input type="text" id="loginID" class="form-control" placeholder="Enter your username"
                    autocomplete="off" required />
            </div>

            <div class="mb-3">
                <label for="userPhoneNo" class="form-label">Phone No.</label>
                <input type="tel" id="userPhoneNo" class="form-control" placeholder="Enter your phone no"
                    autocomplete="off" required />
            </div>

            <div class="mb-3">
                <label for="userPhoneOTP" class="form-label">OTP</label>
                <input type="text" id="userPhoneOTP" class="form-control" placeholder="Enter phone OTP"
                    inputmode="numeric" required />
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Enter your new password"
                    autocomplete="new-password" required />
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password"
                    autocomplete="new-password" required />
            </div>

            <button type="submit" class="btn btn-primary w-100 d-flex justify-content-center align-items-center">
                <span id="loginButtonText">Get OTP</span>
                <div id="resetPasswordSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"
                    aria-hidden="true"></div>
            </button>

            <div class="text-center mt-3">
                <a href="UserActivation.html" class="text-decoration-none">User Activation?</a>
            </div>
        </form>

        <p id="errorMessage" class="text-danger text-center mt-3 d-none" role="alert">
            Something went wrong. Please try again.
        </p>
    </main>
</body>

</html>
