<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>BizNavigation - Login</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="manifest" href="/manifest.json">
    <script src="https://unpkg.com/@supabase/supabase-js"></script>
</head>

<body class="d-flex justify-content-center align-items-center vh-100" style="background-color: #f0f2f5;">

    <!-- Login Card Section -->
    <div class="card p-4 border-0 shadow-lg" style="width: 100%; max-width: 400px; border-radius: 16px;">
        <div class="text-center">
            <img src="assets/img/applogo.png" alt="Logo" class="img-fluid" style="max-width: 100px;">
            <h1 class="fw-bold mt-3" style="color: #5a5a5a;">BizNavigation</h1>
            <p class="text-secondary">Take your business to the next level</p>
        </div>

        <!-- Form Section -->
        <form>
            <div class="mb-3">
                <label for="userName" class="form-label">Username</label>
                <input type="text" class="form-control" id="userName" name="userName" required autocomplete="off"
                    placeholder="Enter your username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required autocomplete="off"
                    placeholder="Enter your password" onkeydown="checkEnterKey(event)">
            </div>
            <button type="button" class="btn btn-primary w-100" onclick="login()">Login</button>
            <div class="text-center mt-3">
                <a href="#" class="text-decoration-none" onclick="resetPassword()">Forgot Password?</a>
            </div>
        </form>

        <!-- Error Message -->
        <p id="errorMessage" class="text-danger text-center mt-3" style="display: none;">Invalid username or password.
            Please try again.</p>
    </div>

    <script>
        function checkEnterKey(event) {
            if (event.key === 'Enter') {
                login(); // Call login when Enter is pressed
            }
        }
    </script>
    <script src="assets/js/server.js"></script>
    <script src="assets/js/login.js"></script>

    <script>
        function disablePullToRefresh() {
            let touchStartY = 0;

            window.addEventListener('touchstart', function (e) {
                touchStartY = e.touches[0].clientY;
            }, { passive: false });

            window.addEventListener('touchmove', function (e) {
                const currentY = e.touches[0].clientY;

                if (window.scrollY === 0 && currentY > touchStartY) {
                    e.preventDefault();
                }
            }, { passive: false });
        }

        // Call it when the page loads
        window.addEventListener('load', disablePullToRefresh);
    </script>


</body>

</html>
