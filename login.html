<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizNavigation - Login</title>

    <!-- Preload Bootstrap -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    </noscript>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Defer non-critical scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js" defer></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <!-- Web Manifest -->
    <link rel="manifest" href="/manifest.json" />



    <style>
        :root {
            --background-color: linear-gradient(135deg, #74ebd5, #ACB6E5);
            --card-background: #ffffff;
            --text-color: #333333;
            --subtext-color: #666666;
            --input-background: #f9f9f9;
            --input-border: #ddd;
            --button-color: #6c63ff;
            --button-hover: #574b90;
            --link-color: #6c63ff;
            --error-color: #dc3545;
        }

        * {
            box-sizing: border-box;
        }

        .input-icon,
        .position-absolute i {
            pointer-events: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--background-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .login-container {
            background: var(--card-background);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.8s ease;
            color: var(--text-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }


        .login-header img {
            max-width: 100px;
            filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.2));
        }

        .login-header h1 {
            font-weight: 600;
            margin-top: 1rem;
            color: var(--text-color);
        }

        .login-header p {
            color: var(--subtext-color);
            font-size: 0.9rem;
        }

        .form-control {
            border-radius: 8px;
            padding: 0.75rem;
            border: 1px solid var(--input-border);
            background-color: var(--input-background);
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(108, 99, 255, 0.3);
            border-color: var(--button-color);
            background-color: #fff;
        }

        .btn-primary {
            background-color: var(--button-color);
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--button-hover);
        }

        .form-links {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .form-links a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
        }

        .form-links a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--error-color);
            text-align: center;
            margin-top: 1rem;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <main class="login-container" role="main">
        <div class="login-header">
            <img src="assets/img/applogo.png" alt="BizNavigation Logo" />
            <h1>BizNavigation</h1>
            <p>Take your business to the next level</p>
        </div>

        <form id="loginForm">
            <div class="mb-3 position-relative">
                <input type="text" class="form-control ps-5" id="userName" placeholder="Username"
                    autocomplete="username" required autofocus /><span
                    class="input-icon position-absolute top-50 start-0 translate-middle-y ps-3">
                    <i class="bi bi-person"></i>
                </span>
            </div>

            <div class="mb-3 position-relative">
                <input type="password" class="form-control ps-5" id="password" placeholder="Password"
                    autocomplete="current-password" required />

                <span class="position-absolute top-50 start-0 translate-middle-y ps-3">
                    <i class="bi bi-lock"></i>
                </span>
            </div>

            <button id="loginButton" type="submit"
                class="btn btn-primary d-flex justify-content-center align-items-center">
                <span id="loginButtonText">Login</span>
                <div id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </button>

            <div class="form-links mt-3">
                <a href="/pages/Tools/ResetPassword.html" id="forgotPasswordLink" class="me-3">Forgot Password?</a>
                <a href="/pages/Tools/UserActivation.html" id="userActivationLink1">User Activation?</a>
            </div>
            <div class="text-center mt-4">
                <small class="text-muted" id="versionInfo">&copy; AllEdge @ 2018 | v1.4.3 | Build:
                    04-02-2026</small>
            </div>
        </form>

        <p id="errorMessage" class="error-message d-none" aria-live="assertive">
            Invalid username or password. Please try again.
        </p>
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/build/sha256.min.js"></script>

    <!-- External login handling script -->
    <script src="assets/js/utils/server.js"></script>
    <script src="assets/js/utils/login.js"></script>

</body>

</html>
