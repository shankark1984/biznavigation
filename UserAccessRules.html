<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizNavigation</title>
    <!-- Combined CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="bg-light">
    <div class="container mt-2">
        <div class="card shadow-lg rounded">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">User Access Rules</h3>
                <input type="hidden" id="tempFormID" name="tempFormID">
                <input type="hidden" id="partyCode" name="partyCode">
                <input type="hidden" id="vendorCode" name="vendorCode">
            </div>
            <div class="card-body">
                <form class="container">
                    <!-- Button Group -->
                    <div class="d-flex flex-wrap justify-content-start gap-1 mb-2">
                        <button type="button" class="btn btn-primary btn-sm" id="newButton"><i
                                class="bi bi-file-earmark-plus"></i> New</button>
                        <button type="button" class="btn btn-warning btn-sm" id="modifyButton"><i
                                class="bi bi-pencil"></i> Modify</button>
                        <button type="button" class="btn btn-danger btn-sm" id="deleteButton"><i
                                class="bi bi-trash"></i> Delete</button>
                        <button type="button" class="btn btn-info btn-sm" id="reportButton"><i
                                class="bi bi-file-earmark-text"></i> Report</button>
                        <button type="button" class="btn btn-success btn-sm" id="saveButton"><i class="bi bi-save"></i>
                            Save</button>
                    </div>
                    <div class="row g-1">
                        <!-- User Login ID -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="userID" class="form-label small">User Login ID</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="userID" name="userID" required
                                        autocomplete="off" placeholder="User Login ID" list="userLoginList">
                                    <!-- Datalist for User Login IDs -->
                                    <datalist id="userLoginList"></datalist>
                                </div>
                            </div>
                        </div>

                        <!-- User Name -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="userName" class="form-label small">User Name</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="userName" name="userName" required
                                        disabled placeholder="User Name">
                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- New Row for User Access -->
                    <div class="row g-1 mt-2">
                        <!-- User Access -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="userAccess" class="form-label small">Form Name</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="userAccess" name="userAccess" required
                                        autocomplete="off" placeholder="User Access" list="formNameList">
                                    <datalist id="formNameList"></datalist>
                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- New Row for Checkboxes and Add Role Button -->
                    <div class="row g-1 mt-2">
                        <!-- Role Checkboxes -->
                        <div class="col-3 col-md-1 d-flex align-items-center justify-content-center">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="roleRead">
                                <label class="form-check-label small ms-1" for="roleRead">Read</label>
                            </div>
                        </div>
                        <div class="col-3 col-md-1 d-flex align-items-center justify-content-center">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="roleWrite">
                                <label class="form-check-label small ms-1" for="roleWrite">Write</label>
                            </div>
                        </div>
                        <div class="col-3 col-md-1 d-flex align-items-center justify-content-center">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="roleDelete">
                                <label class="form-check-label small ms-1" for="roleDelete">Delete</label>
                            </div>
                        </div>
                        <div class="col-3 col-md-1 d-flex align-items-center justify-content-center">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="roleUpdate">
                                <label class="form-check-label small ms-1" for="roleUpdate">Update</label>
                            </div>
                        </div>

                        <!-- Add Role Button -->
                        <div class="col-12 col-md-2 mt-2 mt-md-0 d-flex align-items-center justify-content-center">
                            <button type="button" class="btn btn-primary w-100" id="addUserRole">Add Role</button>
                        </div>
                    </div>

                    <!-- User Roles Details Table -->
                    <div class="mt-4 scrollable-table">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>From Name</th>
                                    <th>Read</th>
                                    <th>Write</th>
                                    <th>Delete</th>
                                    <th>Update</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="roleTableBody">
                                <tr>
                                    <td colspan="5" class="text-center">No roles created</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Combined JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js"></script>

    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/AccessRules.js"></script>
    <script src="assets/js/server.js"></script>
    <script src="assets/js/generalfunction.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/logout.js"></script>

    <script src="assets/js/UserAccessRules.js"></script>


</body>

</html>
