<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizNavigation</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/company.css">
    <!-- jQuery and Supabase -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js"></script> <!-- Supabase client -->
</head>

<body class="bg-light">
    <div class="container mt-2">
        <div class="card shadow-lg rounded">
            <div class="card-header bg-primary text-white">
                <div class="company-header">
                    <h2 id="formTitle">Company Registration - (<span id="CompID">companyid</span>)</h2>
                    <img src="assets/img/logo/CA0001.png" alt="Company Logo" class="company-logo" id="companylogo">
                </div>
                <input type="hidden" id="tempFormID" name="tempFormID">
                <input type="hidden" id="partyCode" name="partyCode">
                <input type="hidden" id="vendorCode" name="vendorCode">
            </div>
            <div class="card-body">
                <form class="container">
                    <!-- Button Group -->
                    <div class="d-flex flex-wrap justify-content-start gap-1 mb-2">
                        <button type="button" class="btn btn-primary btn-sm" id="newButton">
                            <i class="bi bi-file-earmark-plus"></i> New
                        </button>
                        <button type="button" class="btn btn-warning btn-sm" id="modifyButton">
                            <i class="bi bi-pencil"></i> Modify
                        </button>
                        <button type="button" class="btn btn-danger btn-sm" id="deleteButton">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                        <button type="button" class="btn btn-info btn-sm" id="reportButton">
                            <i class="bi bi-file-earmark-text"></i> Report
                        </button>
                        <button type="button" class="btn btn-success btn-sm" id="saveButton">
                            <i class="bi bi-save"></i> Save
                        </button>
                    </div>
                    <div class="row g-1">
                        <!-- Short Code -->
                        <div class="col-md-2">
                            <label for="shortCode" class="form-label small">Short Code</label>
                            <input type="text" class="form-control" id="shortCode" name="shortCode" required
                                class="input-small" placeholder="Short Code">
                        </div>
                        <!-- Company Name -->
                        <div class="col-md-4">
                            <label for="companyName" class="form-label small">Company Name</label>
                            <input type="text" class="form-control" id="companyName" name="companyName" required
                                placeholder="Company Name" style="text-transform: capitalize;">
                        </div>
                        <!-- CIN No -->
                        <div class="col-md-2">
                            <label for="cinNo" class="form-label small">CIN No</label>
                            <input type="text" class="form-control" id="cinNo" name="cinNo" required
                                placeholder="CIN No" style="text-transform: uppercase;">
                        </div>
                        <!-- Udyog Aadhaar No -->
                        <div class="col-md-2">
                            <label for="uaNo" class="form-label small">UA No</label>
                            <input type="text" class="form-control" id="uaNo" name="uaNo" required
                                placeholder="Udyog Aadhaar No" style="text-transform: uppercase;">
                        </div>
                        <!-- Address -->
                        <div class="col-md-4">
                            <label for="address" class="form-label small">Address</label>
                            <textarea class="form-control" id="address" name="address" required rows="1"
                                placeholder="Enter address" style="text-transform: capitalize;"></textarea>
                        </div>
                        <!-- Pin Code -->
                        <div class="col-md-2">
                            <label for="pinCode" class="form-label small">Pin Code</label>
                            <input type="text" class="form-control" id="pinCode" name="pinCode" required
                                placeholder="Enter Pin Code">
                        </div>
                        <!-- City -->
                        <div class="col-md-2">
                            <label for="city" class="form-label small">City</label>
                            <input type="text" class="form-control" id="city" name="city" required placeholder="City"
                                style="text-transform: capitalize;">
                        </div>
                        <!-- State -->
                        <div class="col-md-3">
                            <label for="state" class="form-label small">State</label>
                            <input type="text" class="form-control" id="state" name="state" required placeholder="State"
                                style="text-transform: capitalize;">
                        </div>
                        <!-- Country -->
                        <div class="col-md-3">
                            <label for="country" class="form-label small">Country</label>
                            <input type="text" class="form-control" id="country" name="country" required
                                placeholder="Country" style="text-transform: capitalize;">
                        </div>
                        <!-- Pan Number -->
                        <div class="col-md-4">
                            <label for="panNumber" class="form-label small">Pan Number</label>
                            <input type="text" class="form-control" id="panNumber" name="panNumber" required
                                placeholder="Enter Pan Number" style="text-transform: uppercase;">
                        </div>
                        <!-- GST Number -->
                        <div class="col-md-3">

                            <label for="gstNumber" class="form-label small">GST Number</label>
                            <input type="text" class="form-control" id="gstNumber" name="gstNumber" required
                                placeholder="Enter GST Number" style="text-transform: uppercase;">
                        </div>
                        <!-- Phone Number -->
                        <div class="col-md-3">
                            <label for="phoneNumber" class="form-label small">Phone Number</label>
                            <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" required
                                placeholder="Enter Phone Number">
                        </div>
                        <!-- Email ID -->
                        <div class="col-md-2">
                            <label for="email" class="form-label small">Email ID</label>
                            <input type="email" class="form-control" id="email" name="email" required
                                placeholder="Enter Email ID">
                        </div>
                        <!-- Website -->
                        <div class="col-md-4">
                            <label for="website" class="form-label small">Website</label>
                            <input type="url" class="form-control" id="website" name="website"
                                placeholder="http://example.com">
                        </div>

                        <!-- Tabbed Form -->
                        <ul class="nav nav-tabs" id="branchTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="branch-tab" data-bs-toggle="tab"
                                    data-bs-target="#branch" type="button" role="tab">Branch
                                    Details</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="bank-tab" data-bs-toggle="tab" data-bs-target="#bank"
                                    type="button" role="tab">Bank Details</button>
                            </li>

                        </ul>
                        <div class="tab-content p-3 border border-top-0" id="branchTabsContent">
                            <!-- Branch Details -->
                            <div class="tab-pane fade show active" id="branch" role="tabpanel">
                                <div class="row g-2">
                                    <div class="col-md-1">
                                        <label for="branchCode" class="form-label small">Branch Code</label>
                                        <input type="text" class="form-control" id="branchCode"
                                            placeholder="Branch code">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="branchAddress" class="form-label small">Address</label>
                                        <textarea class="form-control" id="branchAddress" rows="2"
                                            autocomplete="new-password" placeholder="Enter branch address"></textarea>
                                    </div>
                                    <div class="col-md-1">
                                        <label for="branchPinCode" class="form-label small">Pin Code</label>
                                        <input type="text" class="form-control" id="branchPinCode"
                                            placeholder="Enter Pin Code">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchCity" class="form-label small">City</label>
                                        <input type="text" class="form-control" id="branchCity"
                                            placeholder="Enter City">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchState" class="form-label small">State</label>
                                        <input type="text" class="form-control" id="branchState"
                                            placeholder="Enter State">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchCountry" class="form-label small">Country</label>
                                        <input type="text" class="form-control" id="branchCountry"
                                            placeholder="Enter Country">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchPhoneNo" class="form-label small">Phone No</label>
                                        <input type="text" class="form-control" id="branchPhoneNo"
                                            placeholder="Enter Phone No">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchEmailID" class="form-label small">Email ID</label>
                                        <input type="email" class="form-control" id="branchEmailID"
                                            placeholder="Enter Email ID">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="branchGSTNo" class="form-label small">GST No</label>
                                        <input type="text" class="form-control" id="branchGSTNo"
                                            placeholder="Enter GST No">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchPANNo" class="form-label small">PAN No</label>
                                        <input type="text" class="form-control" id="branchPANNo"
                                            placeholder="Enter PAN No">
                                    </div>
                                    <div class="col-md-1 d-flex align-items-end">
                                        <div class="form-check">
                                            <label class="form-check-label small" for="branchInvYN">InvYN</label>
                                            <input type="checkbox" class="form-check-input" id="branchInvYN">
                                        </div>
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchStatus" class="form-label small">Status</label>
                                        <select class="form-control" id="branchStatus">
                                            <option value="">Select Status</option>
                                            <option value="Active">Active</option>
                                            <option value="Inactive">Inactive</option>
                                        </select>
                                    </div>
                                    <div class="col-md-10">
                                        <label for="branchScope" class="form-label small">Branch Scope</label>
                                        <textarea class="form-control" id="branchScope" rows="2"
                                            placeholder="Enter branch scope"></textarea>
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchAddDetails" class="form-label small"
                                            style="color: transparent;">...</label>
                                        <button type="submit" class="btn btn-primary" id="branchAddDetails">Add Branch
                                            Details</button>
                                    </div>
                                    <!-- Branch Details Table -->
                                    <div class="mt-4">
                                        <table class="table table-bordered">
                                            <thead>
                                                <tr>
                                                    <th>Select</th>
                                                    <th>Branch Code</th>
                                                    <th>Address</th>
                                                    <th>City</th>
                                                    <th>State</th>
                                                    <th>Country</th>
                                                    <th>Phone No</th>
                                                    <th>Email ID</th>
                                                    <th>Status</th>
                                                </tr>
                                            </thead>
                                            <tbody id="branchTableBody">
                                                <tr>
                                                    <td colspan="9" class="text-center">No branch created</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>


                            </div>
                            <!-- Bank Details -->
                            <div class="tab-pane fade" id="bank" role="tabpanel">
                                <div class="row g-2">
                                    <div class="col-md-3">
                                        <label for="branchBankName" class="form-label small">Bank Name</label>
                                        <input type="text" class="form-control" id="branchBankName"
                                            placeholder="Enter bank name">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="branchAccountNo" class="form-label small">Account No</label>
                                        <input type="text" class="form-control" id="branchAccountNo" rows="2"
                                            placeholder="Enter Account No">
                                    </div>
                                    <div class="col-md-1">
                                        <label for="branchIFSCCode" class="form-label small">IFSC Code</label>
                                        <input type="text" class="form-control" id="branchIFSCCode"
                                            placeholder="Enter IFSC Code">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchAcBankName" class="form-label small">Branch Name</label>
                                        <input type="text" class="form-control" id="branchAcBankName"
                                            placeholder="Enter Branch Name">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchMICRCode" class="form-label small">MICR Code</label>
                                        <input type="text" class="form-control" id="branchMICRCode"
                                            placeholder="Enter MICR Code">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchBankAddress" class="form-label small">Bank Address</label>
                                        <input type="text" class="form-control" id="branchBankAddress"
                                            placeholder="Enter Bank Address">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchDefaultBank" class="form-label small">Default Bank</label>
                                        <input type="text" class="form-control" id="branchDefaultBank"
                                            placeholder="Enter DefaultBank">
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchAccountStatus" class="form-label small">Status</label>
                                        <select class="form-control" id="branchAccountStatus">
                                            <option value="">Select Status</option>
                                            <option value="Active">Active</option>
                                            <option value="Inactive">Inactive</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <label for="branchBankAddDetails" class="form-label small"
                                            style="color: transparent;">...</label>
                                        <button type="submit" class="btn btn-primary" id="branchBankAddDetails">Add Bank
                                            Details</button>
                                    </div>
                                </div>
                                <!-- Branch Bank Details Table -->
                                <div class="mt-4">
                                    <table class="table table-bordered">
                                        <thead>
                                            <tr>
                                                <th>Select</th>
                                                <th>Bank Name</th>
                                                <th>Account No</th>
                                                <th>IFSC Code</th>
                                                <th>Branch Name</th>
                                                <th>MICR Code</th>
                                                <th>Default Bank</th>
                                                <th>Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="branchBankTableBody">
                                            <tr>
                                                <td colspan="9" class="text-center">No branch created</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>


            </div>
            </form>

            <!-- Modal (Outside Main Form) -->
            <div id="addConsigneeModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
background: white; padding: 20px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); border-radius: 5px;">
                <h3>Add New Consignee</h3>
                <form id="consigneeForm" onsubmit="addNewConsignee(event)">
                    <input type="text" id="newConsigneeName" placeholder="Consignee Name" required>
                    <input type="text" id="newConsigneeAddress" placeholder="Consignee Address" required>
                    <input type="text" id="newContactPerson" placeholder="Contact Person" required>
                    <input type="text" id="newContactNumber" placeholder="Contact Number" required>
                    <input type="email" id="newEmailID" placeholder="Email ID" required>

                    <div style="margin-top: 10px;">
                        <button type="submit">Add Consignee</button>
                        <button type="button" onclick="hideModal()">Cancel</button>
                    </div>
                </form>
            </div>

        </div>

    </div>
    </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript Files -->
    <script src="assets/js/server.js"></script>
    <script src="assets/js/generalfunction.js"></script>
    <script src="assets/js/companyDetails.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/pincode.js"></script>
    <script src="assets/js/logout.js"></script>
    <script src="assets/js/test.js"></script>

    <!-- Tabs Script -->
    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        // Default open tab
        document.addEventListener('DOMContentLoaded', (event) => {
            document.getElementById("branch").style.display = "block";
        });
    </script>



</body>

</html>
