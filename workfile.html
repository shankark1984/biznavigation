<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizNavigation</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- jQuery and Supabase -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js"></script>
</head>

<body class="bg-light">
    <div class="container mt-4">
        <div class="card shadow-lg rounded">
            <div class="card-header bg-primary text-white">
                <div class="company-header">
                    <h3 class="mb-0">Company Registration - (<span id="CompID">companyid</span>)</h3>
                    <img src="assets/img/logo/CA0001.png" alt="Company Logo" class="company-logo" id="companylogo">
                </div>
                <input type="hidden" id="tempFormID" name="tempFormID">
                <input type="hidden" id="partyCode" name="partyCode">
                <input type="hidden" id="vendorCode" name="vendorCode">
            </div>
            <div class="card-body">
                <form class="container">
                    <!-- Button Group -->
                    <div class="d-flex flex-wrap justify-content-start gap-1 mb-2">
                        <button type="button" class="btn btn-primary btn-sm" id="newButton"><i
                                class="bi bi-file-earmark-plus"></i> New</button>
                        <button type="button" class="btn btn-warning btn-sm" id="modifyButton"><i
                                class="bi bi-pencil"></i> Modify</button>
                        <button type="button" class="btn btn-danger btn-sm" id="deleteButton"><i
                                class="bi bi-trash"></i> Delete</button>
                        <button type="button" class="btn btn-info btn-sm" id="reportButton"><i
                                class="bi bi-file-earmark-text"></i> Report</button>
                        <button type="button" class="btn btn-success btn-sm" id="saveButton"><i class="bi bi-save"></i>
                            Save</button>
                    </div>
                    <div class="row g-1">
                        <!-- Short Code Section -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="shortCode" class="form-label small">Short Code</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="shortCode" name="shortCode" required
                                        placeholder="Short Code">
                                </div>
                            </div>
                        </div>

                        <!-- Company Name Section -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="companyName" class="form-label small">Company Name</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="companyName" name="companyName" required
                                        placeholder="Company Name" style="text-transform: capitalize;">
                                </div>
                            </div>
                        </div>

                        <!-- CIN No Section-->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="cinNo" class="form-label small">CIN No</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="cinNo" name="cinNo" required
                                        placeholder="CIN No" style="text-transform: uppercase;">
                                </div>
                            </div>
                        </div>
                        <!-- Udyog Aadhaar No Section-->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="uaNo" class="form-label small">UA No</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="uaNo" name="uaNo" required
                                        placeholder="Udyog Aadhaar No" style="text-transform: uppercase;">
                                </div>
                            </div>
                        </div>
                        <!-- Address Section-->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="address" class="form-label small">Address</label>
                                </div>
                                <div class="col-8">
                                    <textarea class="form-control" id="address" name="address" required rows="1"
                                        placeholder="Enter address" style="text-transform: capitalize;"></textarea>
                                </div>
                            </div>
                        </div>
                        <!-- Pin Code Section-->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="pinCode" class="form-label small">Pin Code</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="pinCode" name="pinCode" required
                                        placeholder="Enter Pin Code">
                                </div>
                            </div>
                        </div>
                        <!-- City Section-->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="city" class="form-label small">City</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="city" name="city" required
                                        placeholder="City" style="text-transform: capitalize;">
                                </div>
                            </div>
                        </div>
                        <!-- State Section-->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="state" class="form-label small">State</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="state" name="state" required
                                        placeholder="State" style="text-transform: capitalize;">
                                </div>
                            </div>
                        </div>

                        <!-- Country -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="country" class="form-label small">Country</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="country" name="country" required
                                        placeholder="Country" style="text-transform: capitalize;">
                                </div>
                            </div>
                        </div>

                        <!-- Pan Number -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="panNumber" class="form-label small">Pan Number</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="panNumber" name="panNumber" required
                                        placeholder="Enter Pan Number" style="text-transform: uppercase;">
                                </div>
                            </div>
                        </div>

                        <!-- GST Number -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="gstNumber" class="form-label small">GST Number</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="gstNumber" name="gstNumber" required
                                        placeholder="Enter GST Number" style="text-transform: uppercase;">
                                </div>
                            </div>
                        </div>

                        <!-- Phone Number -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="phoneNumber" class="form-label small">Phone Number</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" required
                                        placeholder="Enter Phone Number">
                                </div>
                            </div>
                        </div>

                        <!-- Email ID -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="email" class="form-label small">Email ID</label>
                                </div>
                                <div class="col-8">
                                    <input type="email" class="form-control" id="email" name="email" required
                                        placeholder="Enter Email ID">
                                </div>
                            </div>
                        </div>
                        <!-- Website -->
                        <div class="col-md-4 col-sm-6">
                            <div class="row align-items-center">
                                <div class="col-4">
                                    <label for="website" class="form-label small">Website</label>
                                </div>
                                <div class="col-8">
                                    <input type="url" class="form-control" id="website" name="website"
                                        placeholder="http://example.com">
                                </div>
                            </div>
                        </div>

                        <!-- Tabbed Form -->
                        <ul class="nav nav-tabs" id="branchTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="branch-tab" data-bs-toggle="tab"
                                    data-bs-target="#branch" type="button" role="tab">Branch Details</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="bank-tab" data-bs-toggle="tab" data-bs-target="#bank"
                                    type="button" role="tab">Bank Details</button>
                            </li>
                        </ul>

                        <div class="tab-content p-3 border border-top-0" id="bookingTabsContent">
                            <!-- Branch Details  -->
                            <div class="tab-pane fade show active" id="branch" role="tabpanel">
                                <div class="row g-1">
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchCode" class="form-label small">Branch Code</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchCode"
                                                    placeholder="Enter Branch code">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchAddress" class="form-label small">Address</label>
                                            </div>
                                            <div class="col-8">
                                                <textarea type="text" class="form-control" id="branchAddress"
                                                    placeholder="Enter branch address"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchPinCode" class="form-label small">Pin Code</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchPinCode"
                                                    placeholder="Enter Pin Code">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchCity" class="form-label small">City</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchCity"
                                                    placeholder="Enter City">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchState" class="form-label small">State</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchState"
                                                    placeholder="Enter State">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchCountry" class="form-label small">Country</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchCountry"
                                                    placeholder="Enter Country">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchPhoneNo" class="form-label small">Phone No</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchPhoneNo"
                                                    placeholder="Enter Phone No">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchEmailID" class="form-label small">Email ID</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="email" class="form-control" id="branchEmailID"
                                                    placeholder="Enter Email ID">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchGSTNo" class="form-label small">GST No</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchGSTNo"
                                                    placeholder="Enter GST No">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchPANNo" class="form-label small">PAN No</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchPANNo"
                                                    placeholder="Enter PAN No">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label class="form-check-label small" for="branchInvYN">Inv YN?</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="checkbox" class="form-check-input" id="branchInvYN">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchStatus" class="form-label small">Status</label>
                                            </div>
                                            <div class="col-8">
                                                <select class="form-control" id="branchStatus">
                                                    <option value="">Select Status</option>
                                                    <option value="Active">Active</option>
                                                    <option value="Inactive">Inactive</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchInactiveDate" class="form-label small">Inactive
                                                    Date</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="date" class="form-control" id="branchInactiveDate"
                                                    placeholder="Enter Bank Address">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchScope" class="form-label small">Branch Scope</label>
                                            </div>
                                            <div class="col-8">
                                                <textarea class="form-control" id="branchScope" rows="2"
                                                    placeholder="Enter branch scope"></textarea>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-2 d-flex align-items-end">
                                        <button type="submit" class="btn btn-primary" id="branchAddDetails">Add Branch
                                        </button>
                                    </div>
                                </div>

                                <!-- Branch Details Table -->
                                <div class="mt-4 scrollable-table">
                                    <table class="table table-bordered">
                                        <thead>
                                            <tr>
                                                <th>Select</th>
                                                <th>Branch Code</th>
                                                <th>Address</th>
                                                <th>City</th>
                                                <th>State</th>
                                                <th>Country</th>
                                                <th>Phone No</th>
                                                <th>Email ID</th>
                                                <th>Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="branchTableBody">
                                            <tr>
                                                <td colspan="9" class="text-center">No branch created</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <!-- Bank Details -->
                            <div class="tab-pane fade" id="bank" role="tabpanel">
                                <div class="row g-1">
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchAccountNo" class="form-label small">Account No</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchAccountNo" rows="2"
                                                    placeholder="Enter Account No">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchIFSCCode" class="form-label small">IFSC Code</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchIFSCCode"
                                                    name="branchIFSCCode" placeholder="Enter IFSC Code" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchBankName" class="form-label small">Bank Name</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchBankName" rows="3"
                                                    placeholder="Enter bank name">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchAcBankName" class="form-label small">Branch
                                                    Name</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchAcBankName"
                                                    placeholder="Enter Branch Name">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchMICRCode" class="form-label small">MICR Code</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchMICRCode"
                                                    placeholder="Enter MICR Code">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchBankAddress" class="form-label small">Bank
                                                    Address</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="text" class="form-control" id="branchBankAddress"
                                                    placeholder="Enter Bank Address">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchDefaultBank" class="form-label small">Default
                                                    Bank</label>
                                            </div>
                                            <div class="col-8">
                                                <select class="form-control" id="branchDefaultBank">
                                                    <option value="">Select Default Bank</option>
                                                    <option value="Yes">Yes</option>
                                                    <option value="No">No</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="branchAccountStatus" class="form-label small">Status</label>
                                            </div>
                                            <div class="col-8">
                                                <select class="form-control" id="branchAccountStatus">
                                                    <option value="">Select Status</option>
                                                    <option value="Active">Active</option>
                                                    <option value="Inactive">Inactive</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 col-sm-6">
                                        <div class="row align-items-center">
                                            <div class="col-4">
                                                <label for="bankInactiveDate" class="form-label small">Inactive
                                                    Date</label>
                                            </div>
                                            <div class="col-8">
                                                <input type="date" class="form-control" id="bankInactiveDate"
                                                    placeholder="Enter Bank Address">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-2 d-flex align-items-end">
                                        <button type="submit" class="btn btn-primary" id="branchBankAddDetails">Add
                                            Branch
                                        </button>
                                    </div>

                                </div>
                                <!-- Branch Bank Details Table -->
                                <div class="mt-4 scrollable-table">
                                    <table class="table table-bordered">
                                        <thead>
                                            <tr>
                                                <th>Select</th>
                                                <th>Bank Name</th>
                                                <th>Account No</th>
                                                <th>IFSC Code</th>
                                                <th>Branch Name</th>
                                                <th>MICR Code</th>
                                                <th>Default Bank</th>
                                                <th>Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="branchBankTableBody">
                                            <tr>
                                                <td colspan="9" class="text-center">No branch created</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript Files -->
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/AccessRules.js"></script>
    <script src="assets/js/server.js"></script>
    <script src="assets/js/generalfunction.js"></script>
    <script src="assets/js/companyProfile.js"></script>
    <script src="assets/js/branchManagement.js"></script>
    <script src="assets/js/bankManagement.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/pincode.js"></script>
    <script src="assets/js/logout.js"></script>
    <!-- <script src="assets/js/test.js"></script> -->

</body>

</html>
