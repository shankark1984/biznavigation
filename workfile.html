<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimension Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 94.85vh;
            position: relative;
            background-color: #45a049;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px;
            border: black;
            border-radius: 10px;
            border-style: groove;
            flex: 1;
            background-color: rgba(255, 255, 255, 0.9);
            /* Semi-transparent background */
            position: relative;
            z-index: 1;
            /* Ensure content is above the watermark */
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        input,
        select,
        button {
            padding: 10px;
            box-sizing: border-box;
            flex: 1 1 150px;
            /* Flex-grow, flex-shrink, flex-basis */
        }

        input[type="number"] {
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;

        }

        button.delete-btn {
            background-color: #ff4444;

        }

        button.delete-btn:hover {
            background-color: #cc0000;
        }

        button.reset-btn {
            background-color: #ff9800;
        }

        button.reset-btn:hover {
            background-color: #e68900;
        }

        button:hover {
            background-color: #45a049;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #f2f2f2;
            margin-top: auto;
            border-top: 1px solid #ddd;
            border-radius: 0 0 10px 10px;
            /* Rounded corners at the bottom */
        }

        /* Watermark Style */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('assets/img/applogo.png');
            /* Replace with your logo path */
            background-repeat: no-repeat;
            background-position: center;
            background-size: 30%;
            /* Adjust the size of the logo */
            opacity: 10;
            /* Adjust the opacity of the watermark */
            z-index: 0;
            /* Ensure the watermark is behind the container */
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
            }

            input,
            select,
            button {
                width: 100%;
                flex: 1 1 auto;
            }

            table {
                font-size: 14px;
            }

            th,
            td {
                padding: 6px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 20px;
            }

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 4px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 style="text-align: center; background-color:blue; color: white; padding: 0.2em; border-radius: 10px;">
            Dimension Converter</h1>
        <div class="input-group">
            <select id="originalUnitType">
                <option value="cm">Centimeters (cm)</option>
                <option value="mm">Millimeters (mm)</option>
                <option value="m">Meters (m)</option>
                <option value="in">Inches (in)</option>
                <option value="ft">Feet (ft)</option>
            </select>
            <input type="number" id="length" placeholder="Length">
            <input type="number" id="width" placeholder="Width">
            <input type="number" id="height" placeholder="Height">
            <select id="convertUnitType">
                <option value="cm">Centimeters (cm)</option>
                <option value="mm">Millimeters (mm)</option>
                <option value="m">Meters (m)</option>
                <option value="in">Inches (in)</option>
                <option value="ft">Feet (ft)</option>
            </select>
            <button onclick="addData()">Add Data</button>
        </div>
        <div>
            <button onclick="exportToExcel()">Download Excel</button>
            <button onclick="resetData()" class="reset-btn">Reset</button>
        </div>
        <h2>Combined Data</h2>
        <table id="combinedTable">
            <thead>
                <tr>
                    <th>Original Length</th>
                    <th>Original Width</th>
                    <th>Original Height</th>
                    <th>Converted Length</th>
                    <th>Converted Width</th>
                    <th>Converted Height</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <!-- Footer inside the container -->
        <footer>
            <p>&copy; 2018 AllEdge Soft & Logic (OPC) Pvt. Ltd., All rights reserved.</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        const combinedData = [];

        function addData() {
            const length = parseFloat(document.getElementById('length').value);
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);

            const originalUnitType = document.getElementById('originalUnitType').value;
            const convertUnitType = document.getElementById('convertUnitType').value;

            if (isNaN(length) || isNaN(width) || isNaN(height)) {
                alert("Please enter valid numbers for length, width, and height.");
                return;
            }

            // Original data
            const originalRow = [`${length} ${originalUnitType}`, `${width} ${originalUnitType}`, `${height} ${originalUnitType}`];

            // Convert data to the selected unit
            const lengthConverted = convertUnit(length, originalUnitType, convertUnitType);
            const widthConverted = convertUnit(width, originalUnitType, convertUnitType);
            const heightConverted = convertUnit(height, originalUnitType, convertUnitType);

            const convertedRow = [`${lengthConverted.toFixed(4)} ${convertUnitType}`, `${widthConverted.toFixed(4)} ${convertUnitType}`, `${heightConverted.toFixed(4)} ${convertUnitType}`];

            // Combine original and converted data
            const combinedRow = [...originalRow, ...convertedRow];
            combinedData.push(combinedRow);

            // Add row to the combined table
            addRowToTable('combinedTable', combinedRow);
        }

        function convertUnit(value, fromUnit, toUnit) {
            const conversions = {
                cm: { cm: 1, mm: 10, m: 0.01, in: 0.393701, ft: 0.0328084 },
                mm: { cm: 0.1, mm: 1, m: 0.001, in: 0.0393701, ft: 0.00328084 },
                m: { cm: 100, mm: 1000, m: 1, in: 39.3701, ft: 3.28084 },
                in: { cm: 2.54, mm: 25.4, m: 0.0254, in: 1, ft: 0.0833333 },
                ft: { cm: 30.48, mm: 304.8, m: 0.3048, in: 12, ft: 1 }
            };
            return value * conversions[fromUnit][toUnit];
        }

        function addRowToTable(tableId, rowData) {
            const table = document.getElementById(tableId).getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();
            rowData.forEach(data => {
                const cell = newRow.insertCell();
                cell.textContent = data;
            });

            // Add delete button
            const deleteCell = newRow.insertCell();
            const deleteButton = document.createElement('button');
            deleteButton.textContent = 'Delete';
            deleteButton.className = 'delete-btn';
            deleteButton.onclick = function () {
                deleteRow(tableId, newRow.rowIndex - 1);
            };
            deleteCell.appendChild(deleteButton);
        }

        function deleteRow(tableId, rowIndex) {
            // Remove row from the table
            const table = document.getElementById(tableId).getElementsByTagName('tbody')[0];
            table.deleteRow(rowIndex);

            // Remove corresponding data from the array
            combinedData.splice(rowIndex, 1);
        }

        function resetData() {
            // Clear the data array
            combinedData.length = 0;

            // Clear the table body
            document.getElementById('combinedTable').getElementsByTagName('tbody')[0].innerHTML = '';
        }

        function exportToExcel() {
            const wb = XLSX.utils.book_new();

            // Combined Data Sheet
            const combinedWs = XLSX.utils.aoa_to_sheet([
                ["Original Length", "Original Width", "Original Height", "Converted Length", "Converted Width", "Converted Height"],
                ...combinedData
            ]);
            XLSX.utils.book_append_sheet(wb, combinedWs, "Combined Data");

            // Export to Excel
            XLSX.writeFile(wb, "Combined_Dimension_Data.xlsx");
        }
    </script>

    <script>
        // Register the service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('Service Worker registered: ', registration);
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed: ', error);
                    });
            });
        }
    </script>

</body>

</html>
