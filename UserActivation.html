<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizNavigation - User Activation</title>

    <!-- Preload critical CSS -->
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    </noscript>

    <!-- External JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/build/sha256.min.js" defer></script>

    <!-- Internal Scripts -->
    <script src="assets/js/utils/server.js" defer></script>
    <script src="assets/js/UserAccessRules/UserActivation.js" defer></script>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow: hidden;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            color: #fff;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-in-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-control {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: #fff;
            padding: 0.75rem;
            border-radius: 10px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 0.25rem rgba(108, 99, 255, 0.3);
        }

        .form-label {
            color: #f0f0f0;
            font-weight: 500;
        }

        .btn-primary {
            background-color: #6c63ff;
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #574b90;
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.6);
        }

        .text-danger {
            font-weight: 500;
        }

        a.text-decoration-none {
            color: #fce38a;
        }

        a.text-decoration-none:hover {
            text-decoration: underline;
        }

        .background-blur {
            position: absolute;
            inset: 0;
            z-index: -1;
        }

        .background-blur div {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
        }

        .blur-1 {
            width: 300px;
            height: 300px;
            background: #ff9a9e;
            top: -100px;
            left: -100px;
        }

        .blur-2 {
            width: 200px;
            height: 200px;
            background: #fad0c4;
            bottom: -100px;
            right: -50px;
        }

        .blur-3 {
            width: 250px;
            height: 250px;
            background: #a1c4fd;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @media (prefers-reduced-motion: reduce) {
            .login-card {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div class="background-blur">
        <div class="blur-1"></div>
        <div class="blur-2"></div>
        <div class="blur-3"></div>
    </div>

    <div class="card login-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-secondary mt-2">User Activation</h2>
        </div>

        <form id="userActivationForm" aria-label="User Activation Form" novalidate>
            <div class="mb-3">
                <label for="employeeCode" class="form-label">Employee Code</label>
                <input type="text" id="employeeCode" class="form-control" placeholder="Enter your employee code"
                    autocomplete="off" required style="text-transform: uppercase;" />
            </div>

            <div class="mb-3">
                <label for="loginID" class="form-label">Username</label>
                <input type="text" id="loginID" class="form-control" placeholder="Enter your username"
                    autocomplete="off" required />
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label">Password</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Enter your password"
                    autocomplete="new-password" required />
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password"
                    autocomplete="new-password" required />
            </div>

            <button type="submit" class="btn btn-primary w-100 d-flex justify-content-center align-items-center">
                <span id="loginButtonText">Activate</span>
                <div id="userActivationSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"
                    aria-hidden="true"></div>
            </button>

            <div class="text-center mt-3">
                <a href="ResetPassword.html" class="text-decoration-none">Forgot Password?</a>
            </div>
        </form>

        <p id="errorMessage" class="text-danger text-center mt-3 d-none" role="alert">
            Something went wrong. Please try again.
        </p>
    </div>
</body>

</html>
